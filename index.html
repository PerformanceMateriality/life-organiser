<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
<title>Life Organiser</title>
<meta name="theme-color" content="#0f1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life OS" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  @font-face{font-family:"Archivo";src:url("fonts/archivo.woff2") format("woff2");
    font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
  :root{
    --bg:#0f1220; --bg2:#12141c; --surface:#1a1e2e; --surface2:#222741;
    --line:rgba(255,255,255,.08); --text:#e7e9f0; --muted:#9aa0b4; --muted2:#838aa3;
    --health:#34d399; --fitness:#fb923c; --mind:#a78bfa; --work:#38bdf8;
    --flame:#fbbf24; --danger:#f87171; --radius:16px; --onc:#0f1220;
    --ease:cubic-bezier(.16,1,.3,1); --sheet:cubic-bezier(.32,.72,0,1);
    --font:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overscroll-behavior:none}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(620px 380px at 50% -80px,#232a4a 0%,#161a2e 45%,var(--bg) 80%) fixed, var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  ::selection{background:var(--mind);color:var(--bg)}
  :focus-visible{outline:2px solid var(--text);outline-offset:2px}
  button{font-family:inherit;touch-action:manipulation}
  button,.t,.pcard,.navbtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select{font-family:inherit}
  svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:600px;margin:0 auto;padding:16px 16px 120px}

  /* header: ring + display title (date on Today) + manage */
  header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .ring{position:relative;width:64px;height:64px;flex:0 0 auto}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible;display:block}
  .ring .seg{transition:stroke-dasharray .4s var(--ease)}
  .ring .seg.off{transition-duration:.18s}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .ring.perfect svg{filter:drop-shadow(0 0 10px rgba(52,211,153,.45))}
  .htitle{flex:1;min-width:0}
  .dl{display:flex;align-items:center;margin-left:-8px}
  .dl button{width:32px;height:44px;display:grid;place-items:center;color:var(--muted);background:none;border:0;cursor:pointer;padding:0;flex:0 0 auto}
  .dl button:disabled{opacity:.3;cursor:default}
  .dl button svg{width:20px;height:20px}
  .dl.static{margin-left:0} .dl.static button{display:none}
  .htitle h1{margin:0;font-size:46px;line-height:.92;font-weight:300;font-stretch:112%;letter-spacing:-.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .htitle .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .htitle .sub b{color:var(--text);font-weight:600}
  .htitle .sub.perfect b{color:var(--health)}
  .mng{flex:0 0 auto;align-self:flex-start;width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
    color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .12s var(--ease);padding:0}
  .mng:active{transform:scale(.95)}
  .levelbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px;font-size:12px;color:var(--muted);cursor:pointer;min-height:24px}
  .levelbar .lv{color:var(--text);font-weight:600}
  .levelbar .rank{color:var(--mind)}
  .levelbar .xpbar{flex:1;height:3px}
  .levelbar .xpn{font-variant-numeric:tabular-nums}
  .xpbar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--mind),var(--health));border-radius:8px}
  .xpbar.big{height:12px}
  .xpfloat{position:fixed;transform:translateX(-50%);color:var(--text);font-weight:600;font-size:16px;pointer-events:none;z-index:75;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .restrow{margin:0 0 4px}
  .restbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:34px}
  .restbtn svg{width:15px;height:15px}
  .restbtn.on{color:var(--text);border-color:color-mix(in srgb,var(--muted) 45%,transparent);background:var(--surface)}

  /* Today: grouped icon tiles that flood with colour when done */
  .cat{margin-bottom:4px}
  .cat h2{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:400;color:var(--muted);margin:18px 2px 8px}
  .cat h2 .dot{width:7px;height:7px;border-radius:2px;align-self:center}
  .cat h2 .cl{color:var(--text);font-weight:500}
  .cat h2 .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
  .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tgrid.mind{grid-template-columns:repeat(var(--n,1),1fr)}
  .t{aspect-ratio:1;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;
    display:block;width:100%;padding:0;cursor:pointer;color:var(--text);text-align:left;font:inherit;
    transition:transform .12s var(--ease),border-color .3s,box-shadow .3s}
  .t:active{transform:scale(.97)}
  .tgrid.mind .t{aspect-ratio:auto;height:104px}
  .lay{position:absolute;inset:0;padding:11px;display:flex;flex-direction:column;gap:6px}
  .lay .i{color:var(--c)}
  .lay .n{font-size:12.5px;line-height:1.2;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
  .lay .tv{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
  .lay.hv .n{-webkit-line-clamp:1}
  .lay .s{position:absolute;right:10px;bottom:7px;display:flex;align-items:flex-end;gap:2px;line-height:1}
  .lay .s .vw{display:block;overflow:hidden;height:1.1em;font-size:34px}
  .lay.hv .s .vw{font-size:26px}
  .lay .s .v{display:block;font-weight:300;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
  .lay .s.k3 .vw{font-size:27px}
  .tgrid.mind .lay .s .vw{font-size:60px}
  .lay .s svg{width:13px;height:13px;color:var(--flame);margin-bottom:5px;fill:currentColor;stroke:none}
  .lay .s .start{font-size:12px;color:var(--muted);margin-bottom:3px}
  .lay .nf{position:absolute;top:13px;right:13px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .fill{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 58%);color:var(--onc);
    clip-path:circle(0px at 50% 50%);opacity:0;pointer-events:none}
  .fill .i,.fill .tv,.fill .s .start,.fill .s svg{color:var(--onc)}
  .fill .nf{display:none}
  .t.done .fill{opacity:1;clip-path:circle(150% at 50% 50%)}
  .chk{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:var(--onc);color:var(--c);display:grid;place-items:center}
  .chk svg{width:13px;height:13px;stroke-width:3}
  .t.done{border-color:transparent;box-shadow:0 10px 24px -14px var(--c)}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 11px;
    color:var(--text);cursor:pointer;min-height:58px;text-align:left;width:100%;font:inherit;transition:transform .12s var(--ease),background-color .25s,border-color .25s}
  .pcard:active{transform:scale(.97)}
  .pcard .i{color:var(--c)}
  .pcard .pm{flex:1;min-width:0}
  .pcard .pn{font-size:12.5px;font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pcard .ps{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pcard.due .ps{color:var(--flame)}
  .pcard.done{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
  .pcard.done .ps{color:var(--text)}
  .pcard .go{color:var(--muted)}
  .pcard .go svg{width:18px;height:18px}

  /* History */
  .tiles{display:flex;gap:10px;margin-bottom:16px}
  .tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
  .tile .big{font-size:24px;font-weight:600;line-height:1}
  .tile .lbl{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
  .legend{display:flex;gap:14px;justify-content:center;margin:0 0 18px;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
  .hcard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hcard .top .n{font-weight:600;font-size:14.5px}
  .hcard .top .s{margin-left:auto;font-size:12px;color:var(--muted)}
  .hstrip{display:flex;gap:3px}
  .hstrip .sq{flex:1;min-width:0;height:14px;border-radius:3px;background:rgba(255,255,255,.05)}

  /* Rewards */
  .lvlcard{background:linear-gradient(160deg,#242a44,#191d2c);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;margin-bottom:6px}
  .lvlbig{font-size:44px;font-weight:600;line-height:1}
  .lvlrank{color:var(--mind);font-weight:600;letter-spacing:.5px;margin:4px 0 16px}
  .lvlmeta{color:var(--muted);font-size:12.5px;margin-top:10px}
  .rewh{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 12px}
  .catlv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
  .catlv-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:14px}
  .catlv-top .dot{width:9px;height:9px;border-radius:50%}
  .catlv-top .tn{font-weight:600}
  .catlv-top .cl{margin-left:auto;color:var(--muted);font-weight:600}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .badge2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;opacity:.45;filter:grayscale(.7)}
  .badge2.got{opacity:1;filter:none;border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
  .badge2 .bi{font-size:26px}
  .badge2 .bn{font-weight:600;font-size:12.5px;margin-top:5px}
  .badge2 .bd{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .rewnote{color:var(--muted2);font-size:11.5px;text-align:center;margin-top:18px}

  /* Daily quests */
  .quests{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:18px}
  .qhead{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 11px}
  .qhead .qsum{margin-left:auto;letter-spacing:.3px;text-transform:none;font-size:12px;color:var(--muted2)}
  .qhead .qsum b{color:var(--flame)}
  .quest{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line)}
  .quest:first-of-type{border-top:none;padding-top:2px}
  .quest .qic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
  .quest.done .qic{background:color-mix(in srgb,var(--flame) 22%,var(--surface2));box-shadow:0 0 0 1px color-mix(in srgb,var(--flame) 45%,transparent)}
  .quest .qmid{flex:1;min-width:0}
  .quest .qn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .quest .qn .qtick{color:var(--flame)}
  .quest .qd{font-size:11.5px;color:var(--muted);margin-top:1px}
  .quest .qbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
  .quest .qbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mind),var(--flame))}
  .quest.done .qbar > i{background:var(--flame)}
  .quest .qxp{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--muted2);min-width:42px;text-align:right}
  .quest.done .qxp{color:var(--flame)}
  .qfoot{color:var(--muted2);font-size:11px;text-align:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
  .setnote{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--flame) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--flame) 30%,var(--line));border-radius:12px;padding:10px 13px;margin-bottom:9px;font-size:12.5px;color:var(--text)}
  .setnote b{color:var(--flame)}

  /* Badge progress on tiles */
  .badge2{cursor:pointer;position:relative}
  .badge2:active{transform:scale(.97)}
  .badge2 .bprog{height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px}
  .badge2 .bprog > i{display:block;height:100%;border-radius:4px;background:var(--muted)}
  .badge2.got .bprog{display:none}
  .badge2 .bcount{font-size:10px;color:var(--muted2);margin-top:4px}
  .badge2 .bgot{position:absolute;top:7px;right:8px;font-size:12px;color:var(--flame)}
  /* Badge detail sheet */
  .bdhero{text-align:center;padding:8px 0 4px}
  .bdhero .bdi{font-size:60px;line-height:1}
  .bdhero .bdn{font-weight:600;font-size:20px;margin-top:8px}
  .bdhero .bds{color:var(--muted);font-size:13.5px;margin-top:4px}
  .bdstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
  .bdstat .bl{display:flex;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .bdstat .bl b{margin-left:auto;color:var(--text);font-size:14px}
  .bdstat .xpbar{height:10px}
  .bdunlocked{text-align:center;color:var(--flame);font-weight:600;font-size:14px;margin-top:18px}

  /* Level-up moment */
  .lvlup{background:radial-gradient(900px 500px at 50% 30%, rgba(251,191,36,.18), rgba(8,10,18,.92) 60%)!important}
  .lucard{max-width:400px;margin:16vh auto 0;text-align:center;padding:20px}
  .lucard .luspark{font-size:52px;animation:luspin 2.4s linear infinite;display:inline-block}
  @keyframes luspin{to{transform:rotate(360deg)}}
  .lucard .lulabel{margin-top:6px;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--flame);font-weight:600}
  .lucard .lubig{font-size:74px;font-weight:600;line-height:1;margin:6px 0 2px;
    color:var(--text)}
  .lucard .lurank{font-size:17px;font-weight:600;color:var(--mind)}
  .lucard .lurankup{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
    color:var(--flame);background:color-mix(in srgb,var(--flame) 14%,transparent);border:1px solid color-mix(in srgb,var(--flame) 45%,transparent)}
  .lucard .lunext{color:var(--muted);font-size:13px;margin-top:16px}
  .lucard .lugo{margin-top:22px;width:100%;background:var(--flame);color:#2a1e02;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
  .lucard .lugo:active{transform:scale(.97)}
  @keyframes lupop{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

  /* Gym */
  .gymhero{display:flex;gap:10px;margin-bottom:12px}
  .gbtn{flex:1;background:linear-gradient(160deg,#242a44,#191d2c);border:1px solid var(--line);border-radius:16px;padding:15px 12px;text-align:center;cursor:pointer;color:var(--text)}
  .gbtn:active{transform:scale(.98)}
  .gbtn .gt{font-weight:600;font-size:15px}
  .gbtn .gs{font-size:11px;color:var(--muted);margin-top:3px}
  .gbtn.empty{background:var(--surface);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;width:56px}
  .gsub{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px}
  .gsub button{flex:1;background:transparent;border:none;color:var(--muted);border-radius:10px;padding:9px;font-size:13px;font-weight:600;cursor:pointer}
  .gsub button.on{background:var(--surface2);color:var(--text)}

  .gsesshead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .gsesshead .gn{font-weight:600;font-size:18px}
  .gsesshead .gd{color:var(--muted);font-size:12.5px;margin-top:2px}
  .gex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px}
  .gex .gexh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .gex .gexn{font-weight:600;font-size:14.5px}
  .gex .gexpr{margin-left:auto;font-size:11px;color:var(--flame);font-weight:600}
  .gex .gexrm{background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer;padding:0 2px}
  .gex .gexlast{font-size:11px;color:var(--muted2);margin-bottom:9px}
  .gset{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .gset .gsi{width:20px;color:var(--muted2);font-size:12px;font-weight:600;text-align:center;flex:0 0 auto}
  .gcell{flex:1;display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  .gcell input{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;font-weight:600;outline:none;text-align:center}
  .gcell .gu{font-size:11px;color:var(--muted);flex:0 0 auto}
  .gset .grm{background:none;border:none;color:var(--muted2);font-size:18px;cursor:pointer;width:28px;flex:0 0 auto}
  .gaddset{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:3px}
  .gaddex{width:100%;background:var(--surface2);border:1px dashed var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;margin:2px 0 12px}

  .rtimer{position:sticky;bottom:80px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .rtimer.run{border-color:color-mix(in srgb,var(--mind) 50%,var(--line));background:color-mix(in srgb,var(--mind) 10%,var(--surface2))}
  .rtimer .rt{font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;min-width:50px}
  .rtimer .rlbl{color:var(--muted);font-size:12px;margin-right:auto}
  .rtimer button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .gsave{display:flex;gap:10px;margin:14px 0 4px}
  .gsave button{flex:1;border:none;border-radius:12px;padding:14px;font-size:14.5px;font-weight:600;cursor:pointer}

  .ghist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .ghist .ghd{display:flex;align-items:center;gap:8px}
  .ghist .ghn{font-weight:600;font-size:14px}
  .ghist .ghdate{margin-left:auto;color:var(--muted);font-size:12px}
  .ghist .ghx{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;padding:0 2px}
  .ghist .ghsets{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .gprog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
  .gprog .gph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .gprog .gpn{font-weight:600;font-size:14px}
  .gprog .gppr{margin-left:auto;font-size:12.5px;color:var(--flame);font-weight:600}
  .gchart{width:100%;height:56px;display:block;overflow:visible}
  .gempty{color:var(--muted2);font-size:13px;text-align:center;padding:26px 10px}
  .gnote{color:var(--muted2);font-size:11.5px;line-height:1.45;margin:-8px 0 14px;padding:0 2px}
  .gwarn{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:14px;padding:14px;font-size:13px;color:var(--text);line-height:1.5}
  .gpick{display:flex;flex-direction:column;gap:7px}
  .gpick button.pk{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
  .gpick button.pk .pm{margin-left:auto;font-size:11px;color:var(--muted2);font-weight:600}
  .gpick .pglabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 2px 4px}

  /* Gym v2 (build 11) */
  .gresume{background:linear-gradient(160deg,#2a3350,#1b2136);border:1px solid color-mix(in srgb,var(--mind) 45%,var(--line));border-radius:16px;padding:13px 14px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .gresume:active{transform:scale(.99)}
  .gresume .gri{font-size:22px;flex:0 0 auto}
  .gresume .grt{font-weight:600;font-size:14.5px}
  .gresume .grs{font-size:11.5px;color:var(--muted);margin-top:2px}
  .gresume .grgo{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--mind);flex:0 0 auto}
  .gchip{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:999px;
    background:color-mix(in srgb,var(--flame) 16%,var(--surface2));color:var(--flame);border:1px solid color-mix(in srgb,var(--flame) 35%,transparent)}
  .gdetails{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:12px}
  .gdetails .gdrow{display:flex;gap:10px}
  .gdetails .gdrow>div{flex:1;min-width:0}
  .gdetails label{display:block;font-size:11px;color:var(--muted);margin:0 2px 5px}
  .gdetails input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:14px;outline:none;font-family:inherit}
  .gexord{display:flex;gap:3px;margin-left:auto}
  .gexord button{background:var(--surface2);border:none;color:var(--text);width:26px;height:24px;border-radius:7px;font-size:10px;line-height:1;cursor:pointer}
  .gexord button:disabled{opacity:.3;cursor:default}
  .gex .gexpr{margin-left:8px}
  .gexnbtn{background:none;border:none;color:var(--muted2);font-size:14px;cursor:pointer;padding:0 3px}
  .gexnbtn.on{color:var(--mind)}
  .gexnote{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font-size:12.5px;outline:none;font-family:inherit;margin:2px 0 9px;resize:vertical}
  .ghist{cursor:pointer}
  .ghist:active{transform:scale(.995)}
  .ghedit{margin-top:6px;font-size:11px;color:var(--muted2)}

  /* ---- Tasks (build 13) ---- */
  .tkbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .tkchip{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);
    border-radius:14px;padding:11px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tkchip .tkdot{width:9px;height:9px;border-radius:50%;background:var(--muted2);flex:0 0 auto;transition:background .2s}
  .tkchip .tkn{font-size:11.5px;font-weight:600;color:var(--muted2);
    background:var(--bg2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
  .tkchip.on{color:var(--text);border-color:color-mix(in srgb,var(--tkc) 45%,var(--line));
    background:color-mix(in srgb,var(--tkc) 11%,var(--surface))}
  .tkchip.on .tkdot{background:var(--tkc)}
  .tkchip.on .tkn{color:var(--tkc)}
  .tkchip:active{transform:scale(.98)}
  .tkmode{flex:0 0 auto;display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
  .tkmode button{background:transparent;border:none;color:var(--muted);width:38px;height:36px;
    border-radius:10px;font-size:16px;line-height:1;cursor:pointer}
  .tkmode button.on{background:var(--surface2);color:var(--text)}

  .tkadd{width:100%;background:var(--surface2);border:1px dashed var(--line);color:var(--text);
    border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
  .tkadd:active{transform:scale(.99)}

  .tkgroup{margin-bottom:20px}
  .tkgroup h3{display:flex;align-items:center;gap:9px;font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);margin:0 4px 9px;font-weight:600}
  .tkgroup h3 .gc{margin-left:auto;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  .tkgroup.overdue h3{color:var(--danger)}

  .tkitem{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:12px 13px;margin-bottom:8px;transition:border-color .2s,opacity .2s}
  .tkitem.isdone{opacity:.5}
  .tkitem.isover{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .tkbox{flex:0 0 auto;width:28px;height:28px;margin-top:1px;border-radius:9px;border:2px solid var(--muted2);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s;color:transparent;font-size:15px;font-weight:600;line-height:1}
  .tkitem.isdone .tkbox{background:var(--health);border-color:var(--health);color:#0f1220}
  .tkbox:active{transform:scale(.9)}
  .tktime{flex:0 0 auto;width:46px;margin-top:1px;text-align:center;font-variant-numeric:tabular-nums}
  .tktime .th{font-weight:600;font-size:14px;line-height:1.1}
  .tktime .tm{font-size:10.5px;color:var(--muted2);margin-top:2px}
  .tktime .allday{font-size:10px;color:var(--muted2);font-weight:600;letter-spacing:.3px}
  .tkmain{flex:1;min-width:0;cursor:pointer}
  .tktitle{font-weight:600;font-size:15px;line-height:1.25;word-break:break-word}
  .tkitem.isdone .tktitle{text-decoration:line-through;text-decoration-color:var(--muted2)}
  .tkmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
  .tkmeta .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted2)}
  .tkmeta .tag.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .tkmeta .tag.soon{color:var(--flame);border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
  .tknote{font-size:12px;color:var(--muted2);margin-top:5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .tkempty{color:var(--muted2);font-size:13.5px;text-align:center;padding:40px 16px;line-height:1.55}
  .tkdonehead{width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:12px;padding:10px;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:4px}

  /* calendar mode */
  .tkcal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 12px;margin-bottom:16px}
  .tkcalhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .tkcalhead .cmn{flex:1;text-align:center;font-weight:600;font-size:15px}
  .tkcalhead button{background:var(--surface2);border:none;color:var(--text);width:34px;height:34px;
    border-radius:10px;font-size:17px;cursor:pointer;flex:0 0 auto}
  .tkdow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
  .tkdow span{text-align:center;font-size:10.5px;color:var(--muted2);font-weight:600;letter-spacing:.3px}
  .tkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .tkday{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:transparent;
    color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;padding:0;font-family:inherit}
  .tkday.out{color:var(--muted2);opacity:.4}
  .tkday.today{border-color:color-mix(in srgb,var(--mind) 55%,transparent);color:var(--mind)}
  .tkday.sel{background:var(--surface2);border-color:var(--line)}
  .tkday .dots{display:flex;gap:2px;height:5px;align-items:center}
  .tkday .dots i{width:5px;height:5px;border-radius:50%;display:block}
  .tkday.hasover{color:var(--danger)}
  .tkdaytitle{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin:0 4px 10px;font-weight:600;display:flex;align-items:center}
  .tkdaytitle .dc{margin-left:auto;font-size:11.5px;color:var(--muted2);letter-spacing:.4px}
  .tktray{margin-top:18px}

  /* today-view agenda strip */
  .tkstrip{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:11px 13px;margin-bottom:18px;cursor:pointer}
  .tkstrip:active{transform:scale(.995)}
  .tkstriph{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;
    letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:9px}
  .tkstriph .go{margin-left:auto;text-transform:none;letter-spacing:.2px;font-size:12px;color:var(--mind);font-weight:600}
  .tkline{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:4px 0}
  .tkline .lt{flex:0 0 auto;font-weight:600;font-size:12px;color:var(--work);
    font-variant-numeric:tabular-nums;min-width:38px}
  .tkline .lt.todo{color:var(--health)}
  .tkline .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tkline .lx{flex:0 0 auto;font-size:10.5px;color:var(--danger);font-weight:600}
  .tkmore{font-size:11.5px;color:var(--muted2);margin-top:6px}

  /* ---- Reminders (build 14) ---- */
  .remrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .remrow.off{opacity:.55}
  .remrow .ric{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;font-size:17px}
  .remrow .rmid{flex:1;min-width:0}
  .remrow .rn{font-weight:600;font-size:14.5px}
  .remrow .rd{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.3}
  .remrow input[type=time]{background:var(--bg2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 9px;font-size:14px;font-family:inherit;outline:none;flex:0 0 auto;
    color-scheme:dark}
  .remrow .sw{width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;
    transition:background .2s;flex:0 0 auto;cursor:pointer}
  .remrow .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:transform .2s}
  .remrow.on .sw{background:var(--mind)}
  .remrow.on .sw::after{transform:translateX(18px)}
  .remchip{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;
    border-radius:999px;margin-left:6px;border:1px solid transparent}
  .remchip.ok{background:color-mix(in srgb,var(--health) 16%,var(--surface2));color:var(--health);
    border-color:color-mix(in srgb,var(--health) 35%,transparent)}
  .remchip.warn{background:color-mix(in srgb,var(--flame) 16%,var(--surface2));color:var(--flame);
    border-color:color-mix(in srgb,var(--flame) 35%,transparent)}
  .remchip.off{background:var(--surface2);color:var(--muted2)}
  .rempv{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 16px}
  .rempv .pvh{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:9px}
  .rempv .pvitem{padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
  .rempv .pvitem:first-of-type{border-top:none;padding-top:0}
  .rempv .pvslot{font-weight:600;font-size:12px;color:var(--text)}
  .rempv .pvtext{color:var(--muted);margin-top:2px}
  .rempv .pvquiet{color:var(--muted2);font-style:italic}
  .remnote{color:var(--muted2);font-size:11.5px;line-height:1.5;margin:0 2px 14px}
  .remperm{background:color-mix(in srgb,var(--flame) 9%,var(--surface));
    border:1px solid color-mix(in srgb,var(--flame) 32%,var(--line));border-radius:14px;padding:13px 14px;
    margin-bottom:14px;font-size:13px;line-height:1.55}
  .remperm b{color:var(--flame)}
  .remperm ol{margin:8px 0 0;padding-left:20px}
  .remperm li{margin-bottom:3px}
  .rembtn{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:8px}
  .rembtn:active{transform:scale(.98)}
  .rembtn:disabled{opacity:.45;cursor:default}
  .rembtn.primary{background:var(--mind);color:#12101f;border-color:transparent}

  /* Overlays */
  .overlay{position:fixed;inset:0;background:rgba(8,10,18,.86);backdrop-filter:blur(4px);z-index:60;
    display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}
  .overlay.show{display:block}
  .sheet{max-width:600px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px}
  .sheet h2{margin:2px 0 14px;font-size:18px;display:flex;align-items:center}
  .sheet h2 .x{margin-left:auto;background:var(--surface2);border:none;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
  .addbtn{width:100%;background:var(--surface2);border:1px dashed var(--line);color:var(--text);border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
  .egroup{margin-bottom:16px}
  .egroup .glabel{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
  .erow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .erow.inactive{opacity:.5}
  .erow .en{flex:1;min-width:0}
  .erow .en .n{font-weight:600;font-size:14.5px}
  .erow .en .c{font-size:11.5px;color:var(--muted);margin-top:2px}
  .erow .ord{display:flex;flex-direction:column;gap:2px}
  .erow .ord button,.erow .ib{background:var(--surface2);border:none;color:var(--text);border-radius:8px;cursor:pointer}
  .erow .ord button{width:26px;height:20px;font-size:11px;line-height:1}
  .erow .ib{width:34px;height:34px;font-size:15px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 6px}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],
  .field input[type=date],.field input[type=time],.field select,.field textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:11px 12px;font-size:15px;outline:none;font-family:inherit}
  /* native date/time pickers follow the dark theme instead of rendering white */
  .field input[type=date],.field input[type=time]{color-scheme:dark;min-height:45px}
  .field input[type=date]::-webkit-calendar-picker-indicator,
  .field input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.75);cursor:pointer}
  .field textarea{resize:vertical}
  .field.rowly{display:flex;gap:10px}
  .field.rowly > div{flex:1}
  .toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
  .toggle .sw{width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s;flex:0 0 auto}
  .toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle.on .sw{background:var(--mind)}
  .toggle.on .sw::after{transform:translateX(18px)}
  .formbtns{display:flex;gap:10px;margin-top:16px}
  .formbtns button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer}
  .btn-save{background:var(--mind);color:#12101f}
  .btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
  .btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 auto!important;padding:13px 16px!important}
  .hidden{display:none!important}

  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
    display:flex;gap:3px;background:rgba(26,30,46,.92);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:16px;padding:5px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100vw - 16px)}
  .navbtn{background:transparent;border:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:9px 11px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .navbtn.active{background:var(--surface2);color:var(--text)}
  .navbtn .nlbl{display:inline}
  /* 5 items don't fit small phones at full size — step down, then to icons only */
  @media (max-width:430px){ .navbtn{font-size:12px;padding:9px 8px;gap:4px} .nav{gap:2px;padding:4px} }
  @media (max-width:365px){ .navbtn .nlbl{display:none} .navbtn{font-size:17px;padding:9px 12px} }

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(120px);
    background:#222741;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:12px;
    font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s;z-index:80;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger)}
  .toast.level{border-color:var(--flame);background:#2a2418;font-weight:600}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  .foot{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:26px}
  .confetti{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:70}

  /* ===== build 16: Raster x current app ===== */
  /* section labels: quiet lowercase instead of tracked caps */
  .rewh,.tkgroup h3,.egroup .glabel,.tkdaytitle,.qhead,.tkstriph,.rempv .pvh,.gpick .pglabel{text-transform:none!important;letter-spacing:0!important;font-size:13px!important;font-weight:500!important}
  .rewh{margin:24px 2px 10px}

  /* sheets slide up from the bottom; backdrop fades */
  .overlay{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;
    padding:calc(env(safe-area-inset-top) + 24px) 0 0;background:rgba(5,7,14,.6);backdrop-filter:none;-webkit-backdrop-filter:none;
    visibility:hidden;opacity:0;transition:opacity .2s var(--ease),visibility 0s linear .26s}
  .overlay.show{display:flex;visibility:visible;opacity:1;transition:opacity .2s var(--ease)}
  .overlay .sheet{width:100%;max-width:600px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;margin:0;
    border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;background:#171b2b;
    padding:10px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .24s var(--sheet)}
  .overlay.show .sheet{transform:none;transition-duration:.38s}
  .overlay .sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 12px}

const AUTH = SUPABASE_URL + '/auth/v1/';
let session = null;
function loadSession(){ try{ const s=localStorage.getItem('lo_session'); if(s) session=JSON.parse(s); }catch(e){} }
function saveSession(s){ session=s; try{ localStorage.setItem('lo_session', JSON.stringify(s)); }catch(e){} }
function clearSession(){ session=null; try{ localStorage.removeItem('lo_session'); }catch(e){} }
async function signIn(email,password){
  const res=await fetch(AUTH+'token?grant_type=password',{method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Sign-in failed');
  saveSession({access_token:data.access_token, refresh_token:data.refresh_token});
  return true;
}
async function refreshSession(){
  if(!session||!session.refresh_token) return false;
  try{
    const res=await fetch(AUTH+'token?grant_type=refresh_token',{method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!res.ok){ clearSession(); return false; }
    const data=await res.json(); saveSession({access_token:data.access_token, refresh_token:data.refresh_token}); return true;
  }catch(e){ return false; }
}

async function rest(method, path, opts, _retry){
  opts = opts || {};
  const headers = { 'apikey': SUPABASE_KEY, 'Content-Type':'application/json' };
  if(session && session.access_token) headers['Authorization'] = 'Bearer '+session.access_token;

function urlB64ToU8(s){
  const pad='='.repeat((4 - s.length % 4) % 4);
  const b64=(s+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);

}

  const reg=await swReg(); if(!reg||!reg.pushManager){ remSub=null; return null; }
  try{ remSub = await reg.pushManager.getSubscription(); }catch(e){ remSub=null; }
  return remSub;
}
async function saveSub(sub){
  if(!sub) return;
  const j=sub.toJSON();
  const body={ endpoint:sub.endpoint, p256dh:j.keys&&j.keys.p256dh, auth:j.keys&&j.keys.auth,
    user_agent:navigator.userAgent.slice(0,300), last_seen:new Date().toISOString() };
  // Without both keys the server cannot encrypt to this device. Swallowing either
  // failure would leave the screen reading "on" with no endpoint to send to — exactly
  // the silent non-delivery this build exists to avoid.
  if(!body.p256dh || !body.auth) throw new Error('This device returned an incomplete push subscription.');
  await rest('POST','push_subscriptions?on_conflict=endpoint',
    { body, prefer:'resolution=merge-duplicates' });
}
async function enablePush(){
  if(!notifSupported()) throw new Error('This browser cannot do web push.');
  if(isIOS() && !isStandalone()) throw new Error('On iPhone, add the app to your Home Screen first.');
  const perm = await Notification.requestPermission();
  if(perm!=='granted') throw new Error(perm==='denied'
    ? 'Notifications are blocked — turn them back on in your device settings.'
    : 'Permission was not granted.');
  const reg=await swReg(); if(!reg) throw new Error('The service worker is not running yet — reload and try again.');
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToU8(VAPID_PUBLIC) });
  await saveSub(sub);   // only claim this device is subscribed once the row is stored
  remSub=sub;
  return sub;
}

async function remCall(payload){
  const headers={ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY };
  if(session&&session.access_token) headers['Authorization']='Bearer '+session.access_token;
  const res=await fetch(FN_REMINDERS,{ method:'POST', headers, body:JSON.stringify(payload) });
  const txt=await res.text();
  if(!res.ok) throw new Error('HTTP '+res.status+' '+txt.slice(0,200));
  return txt?JSON.parse(txt):null;
}
function remStatus(){
  if(!remReady) return { cls:'warn', label:'setup needed' };
  if(!remSettings || !remSettings.enabled) return { cls:'off', label:'off' };
  if(!notifSupported()) return { cls:'off', label:'unsupported' };
  if(isIOS() && !isStandalone()) return { cls:'warn', label:'add to home screen' };
  const p=notifPerm();
  if(p!=='granted') return { cls:'warn', label:'needs permission' };
  if(!remSub) return { cls:'warn', label:'not subscribed' };
  const anyOn=REM_SLOTS.some(s=>remSettings[s.key+'_on']);
  return anyOn ? { cls:'ok', label:'on' } : { cls:'off', label:'no slots on' };

async function setLog(routine, ds, on, value, completed, note){
  if(on){
    const cur = getLog(routine.id, ds) || {};
    const payload={ routine_id:routine.id, log_date:ds, completed: completed===undefined?true:completed };
    if(value!==undefined && value!==null && value!=='') payload.value=Number(value);
    else if(cur.value!=null) payload.value=cur.value;
    if(note!==undefined) payload.note = note || null;
    else if(cur.note!=null) payload.note = cur.note;
    const rows = await rest('POST','routine_logs?on_conflict=routine_id,log_date',
      { body:payload, prefer:'resolution=merge-duplicates,return=representation' });
    const data = Array.isArray(rows) ? rows[0] : rows;
    if(!logs.has(routine.id)) logs.set(routine.id,new Map());
    logs.get(routine.id).set(ds, data || payload);
  } else {
    await rest('DELETE','routine_logs?routine_id=eq.'+routine.id+'&log_date=eq.'+ds);

}

function streak(rid){
  let n=0, d=new Date(today), guard=0;
  if(!isDone(rid,ymd(d)) && !isRest(ymd(d))) d=addDays(d,-1);
  while(guard++ < 600){ const ds=ymd(d);
    if(isDone(rid,ds)){ n++; d=addDays(d,-1); }
    else if(isRest(ds)){ d=addDays(d,-1); }
    else break;
  }
  return n;
}
function lastDone(rid){ const m=logs.get(rid); if(!m) return null; let best=null; for(const [ds,l] of m){ if(l.completed && (!best||ds>best)) best=ds; } return best; }
function weekKey(d){ const dt=new Date(d); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off); return ymd(dt); }
function countWeek(rid,ref){ const wk=weekKey(ref); let c=0; const m=logs.get(rid); if(!m)return 0; for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===wk) c++; } return c; }
function periodicStatus(routine){
  const cad=CADENCE[routine.cadence];
  if(cad.weekly){ const c=countWeek(routine.id,selected); return { due:c<cad.weekly, text:`${c}/${cad.weekly} this week` }; }
  const ld=lastDone(routine.id);
  if(!ld) return { due:true, text:'Not done yet' };
  const days=Math.round((today-parseYmd(ld))/86400000);
  if(days>=cad.interval) return { due:true, text:days===0?'Done today':`Last ${days}d ago` };
  return { due:false, text:`Next in ${cad.interval-days}d` };
}
function valueDone(routine, num){ if(num===null||num===undefined||num==='') return false; const t = routine.target_value!=null ? Number(routine.target_value) : null; return t ? Number(num) >= t : Number(num) > 0; }

function levelInfo(xp){ let lvl=1, acc=0, need=100; while(xp >= acc+need){ acc+=need; lvl++; need=100+(lvl-1)*50; } return { level:lvl, into:xp-acc, need, total:xp }; }

  const a=completedDates(rid); if(!a.length) return 0;

}

function ringSvg(ds){
  ds = ds || ymd(today);
  const daily=routines.filter(r=>!CADENCE[r.cadence].periodic);
  const n=daily.length, el=$('ring');
  const Rr=27, C=2*Math.PI*Rr, gap=n>1?3:0, seg=n?C/n-gap:0;
  const key=daily.map(r=>r.id).join(',');
  let done=0;
  if(el.dataset.key!==key){
    el.dataset.key=key;
    el.innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${Rr}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>${
      daily.map((r,i)=>`<circle class="seg" data-seg="${r.id}" cx="32" cy="32" r="${Rr}" fill="none" stroke-width="6" stroke="${RAWCOLOR[r.category]||'#9aa0b4'}" stroke-dasharray="${isDone(r.id,ds)?seg:0} ${C}" stroke-dashoffset="${-i*(seg+gap)}"/>`).join('')}</svg><div class="pct"></div>`;
  }
  el.querySelectorAll('.seg').forEach(c=>{ const on=isDone(c.dataset.seg,ds); if(on) done++;
    c.classList.toggle('off',!on); c.setAttribute('stroke-dasharray',`${on?seg:0} ${C}`); });
  el.querySelector('.pct').textContent=`${done}/${n}`;
  el.classList.toggle('perfect', n>0 && done===n);
  el.setAttribute('role','img'); el.setAttribute('aria-label',`${done} of ${n} daily routines done`);
}

  const pe=document.querySelector('[data-cnt="periodic"]'); if(pe) pe.textContent=`${periodicDueCount(ds)} due`;
  if(wasPerfect===false && isPerfect(ds)) celebratePerfect();
}
function celebratePerfect(){
  const ring=$('ring'); if(!ring) return;
  setTimeout(()=>{
    if(!RM){ ring.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.16,1,.3,1)'});
      const r=ring.getBoundingClientRect(); spawnConfetti(r.left+r.width/2, r.top+r.height/2, 22, 90); }

// ---- the tick: optimistic, animated in place, saved in the background ----
const pending=new Set();
function localSet(rid,ds,row){ if(!logs.has(rid)) logs.set(rid,new Map()); logs.get(rid).set(ds,row); }
function restoreLocal(rid,ds,prev){ if(prev) localSet(rid,ds,prev); else logs.get(rid)?.delete(ds); }
function findRoutineEl(rid,ds){
  if(view!=='today' || ymd(selected)!==ds) return null;
  return document.querySelector(`[data-tile="${rid}"],[data-ptile="${rid}"]`);
}
function paintRoutine(el,r,ds,o={}){
  if(!el || !el.isConnected) return;
  if(el.classList.contains('pcard')){ el.outerHTML=pcardHtml(r,ds); return; }
  const done=isDone(r.id,ds), fill=el.querySelector('.fill');
  const oldN=Number(el.dataset.s||0), n=streak(r.id); el.dataset.s=n;
  el.classList.toggle('done',done); el.setAttribute('aria-pressed',done); el.setAttribute('aria-label',tileLabel(r,ds));
  el.querySelectorAll('.lay').forEach(l=>{ const s=l.querySelector('.s'); if(s) s.outerHTML=streakHtml(n);
    const tv=l.querySelector('.tv'); if(tv) tv.innerHTML=tileVal(r,ds);
    const nf=l.querySelector('.nf'); const log=getLog(r.id,ds); if(nf && !(log&&log.note)) nf.remove(); });
  if(n!==oldN && n && !RM) el.querySelectorAll('.v').forEach(v=>v.animate(
    [{transform:`translateY(${n>oldN?60:-60}%)`,opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.16,1,.3,1)'}));
  if(!fill) return;
  fill.getAnimations().forEach(a=>a.cancel());
  if(o.flood && done){
    if(RM){ fill.animate([{opacity:0},{opacity:1}],{duration:150}); return; }
    const rect=el.getBoundingClientRect(), x=o.pt?o.pt.x:rect.width/2, y=o.pt?o.pt.y:rect.height/2;
    const rad=Math.hypot(Math.max(x,rect.width-x),Math.max(y,rect.height-y))+2;   // same speed from any tap point
    fill.animate([{clipPath:`circle(0px at ${x}px ${y}px)`,opacity:1},{clipPath:`circle(${rad}px at ${x}px ${y}px)`,opacity:1}],
      {duration:420,easing:'cubic-bezier(.16,1,.3,1)'});
  } else if(o.unflood && !done){
    fill.animate([{opacity:1,clipPath:'circle(150% at 50% 50%)'},{opacity:0,clipPath:'circle(150% at 50% 50%)'}],{duration:180,easing:'ease-out'});
  }
}
async function tickRoutine(r,ds,el,pt){
  if(pending.has(r.id) || isDone(r.id,ds)) return;
  const prev=getLog(r.id,ds);
  const preLevel=levelInfo(totalXp()).level, preTiers=completedTierCount(), preQuests=completedQuestIds(ds), wasPerfect=isPerfect(ds);
  localSet(r.id,ds,{...(prev||{}), routine_id:r.id, log_date:ds, completed:true});
  pending.add(r.id);
  paintRoutine(el,r,ds,{flood:true,pt});
  haptic(); if(navigator.vibrate) navigator.vibrate(12);
  if(el && el.isConnected) floatXp(el, xpOfRoutine(r), pt);
  syncTodayChrome(ds, wasPerfect);
  try{
    await setLog(r, ds, true, undefined, true);
    checkQuests(preQuests, ds);
    if(!checkSetComplete(preTiers)) checkLevelUp(preLevel);
  }catch(e){
    restoreLocal(r.id,ds,prev); paintRoutine(findRoutineEl(r.id,ds),r,ds,{unflood:true}); syncTodayChrome(ds);
    toast('Could not save · check your connection', true); console.error(e);
  }
  pending.delete(r.id);
}
async function untickRoutine(r,ds,el){
  if(pending.has(r.id) || !isDone(r.id,ds)) return;
  const prev=getLog(r.id,ds);
  // A value or note is real data: keep the row and just clear the tick.
  const keep = prev && (prev.value!=null || prev.note);
  if(keep) localSet(r.id,ds,{...prev, completed:false}); else logs.get(r.id)?.delete(ds);
  pending.add(r.id);
  paintRoutine(el,r,ds,{unflood:true});
  syncTodayChrome(ds);
  toast(`${r.name} unticked`, false, false, ()=>{
    const redo=()=>{ if(pending.has(r.id)) return setTimeout(redo,150); tickRoutine(r,ds,findRoutineEl(r.id,ds),null); };
    redo();
  });
  try{
    if(keep) await setLog(r, ds, true, undefined, false); else await setLog(r, ds, false);
  }catch(e){
    restoreLocal(r.id,ds,prev); paintRoutine(findRoutineEl(r.id,ds),r,ds,{flood:true}); syncTodayChrome(ds);
    toast('Could not save · check your connection', true); console.error(e);
  }
  pending.delete(r.id);
}
function onTile(el,e){
  const r=routines.find(x=>x.id===el.dataset.tile); if(!r) return;
  const ds=ymd(selected);
  if(r.track_value){ openValueSheet(r); return; }
  const rect=el.getBoundingClientRect();
  const pt = e && e.detail ? {x:e.clientX-rect.left, y:e.clientY-rect.top} : null;
  if(isDone(r.id,ds)) untickRoutine(r,ds,el); else tickRoutine(r,ds,el,pt);
}
function onPcard(el){
  const r=routines.find(x=>x.id===el.dataset.ptile); if(!r) return;
  if(el.dataset.gymcard){ view='gym'; render(); return; }
  const ds=ymd(selected);
  if(isDone(r.id,ds)) untickRoutine(r,ds,el); else tickRoutine(r,ds,el,null);
}

function quickSteps(t){ if(t==null) return []; if(t>=100) return [20,30,40]; if(t>=30) return [5,10,15]; if(t>=10) return [2,5,10]; return [1,2,5]; }
function openValueSheet(r){
  const ds=ymd(selected), l=getLog(r.id,ds), c=RAWCOLOR[r.category];
  const t=r.target_value!=null?Number(r.target_value):null, u=escapeHtml(r.unit||'');
  const cur=l&&l.value!=null?Number(l.value):null;
  const steps=quickSteps(t);
  $('detailSheet').innerHTML=`
    <div class="vsn" style="--c:${c}"><span class="i">${ic(routineIcon(r))}</span>${escapeHtml(r.name)}<span class="vt">${t!=null?'target '+fmtW(t)+(u?' '+u:''):'any value ticks it'}</span></div>
    <label class="bigin" style="--c:${c}"><input id="vs-in" type="text" inputmode="decimal" autocomplete="off" value="${cur!=null?fmtW(cur):''}" placeholder="0" aria-label="${escapeHtml(r.name)}${u?' in '+u:''}"><span>${u}${t!=null?' / '+fmtW(t):''}</span></label>
    ${t!=null?`<div class="tbar" style="--c:${c}"><i id="vs-bar" style="transform:scaleX(${Math.min(1,(cur||0)/t)})"></i></div>`:''}
    ${steps.length?`<div class="quick">${steps.map(q=>`<button data-q="${q}">+${q}</button>`).join('')}</div>`:''}
    <div class="formbtns"><button class="btn-cancel" id="vs-note">${l&&l.note?'Edit note':'Add note'}</button><button class="btn-save" id="vs-save">Save</button></div>
    ${isDone(r.id,ds)?`<div class="formbtns" style="margin-top:8px"><button class="btn-cancel" id="vs-untick">Mark not done</button></div>`:''}`;
  $('detail').classList.add('show');
  const inp=$('vs-in'), bar=$('vs-bar');
  const num=()=>{ const v=inp.value.trim().replace(',','.'); return v===''?null:Number(v); };
  const upd=()=>{ if(bar){ const v=num(); bar.style.transform=`scaleX(${Math.min(1,Math.max(0,(v||0)/t))})`; } };
  inp.oninput=upd;
  inp.onkeydown=(e)=>{ if(e.key==='Enter') $('vs-save').click(); };
  $('detailSheet').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const v=num()||0; inp.value=fmtW(v+Number(b.dataset.q)); upd(); });
  $('vs-save').onclick=()=>saveValue(r, ds, inp.value);
  $('vs-note').onclick=()=>openDetail(r.id);
  const un=$('vs-untick'); if(un) un.onclick=()=>{ $('detail').classList.remove('show'); untickRoutine(r,ds,findRoutineEl(r.id,ds)); };
}
async function saveValue(r, ds, raw){
  const v=String(raw).trim().replace(',','.');
  if(v!=='' && isNaN(Number(v))){ toast('That is not a number', true); return; }
  $('detail').classList.remove('show');
  const prev=getLog(r.id,ds), wasDone=isDone(r.id,ds);
  const preLevel=levelInfo(totalXp()).level, preTiers=completedTierCount(), preQuests=completedQuestIds(ds), wasPerfect=isPerfect(ds);
  const done = v==='' ? false : valueDone(r, v);
  if(v===''){ if(prev&&prev.note) localSet(r.id,ds,{...prev, completed:false}); else logs.get(r.id)?.delete(ds); }
  else localSet(r.id,ds,{...(prev||{}), routine_id:r.id, log_date:ds, value:Number(v), completed:done});
  pending.add(r.id);
  const el=findRoutineEl(r.id,ds);
  // Let the sheet get out of the way first, so the flood is actually seen.
  setTimeout(()=>{ paintRoutine(el,r,ds,{flood:done&&!wasDone, unflood:!done&&wasDone});
    if(done&&!wasDone && el && el.isConnected) floatXp(el, xpOfRoutine(r)); syncTodayChrome(ds, wasPerfect); }, RM?0:200);
  if(done&&!wasDone){ haptic(); if(navigator.vibrate) navigator.vibrate(12); }
  try{
    if(v===''){ if(prev&&prev.note) await setLog(r,ds,true,null,false); else await setLog(r,ds,false); }
    else await setLog(r, ds, true, v, done);
    if(done && !wasDone){ checkQuests(preQuests, ds); if(!checkSetComplete(preTiers)) checkLevelUp(preLevel); }
    paintRoutine(findRoutineEl(r.id,ds),r,ds);
  }catch(e){
    restoreLocal(r.id,ds,prev); paintRoutine(findRoutineEl(r.id,ds),r,ds,{unflood:done&&!wasDone}); syncTodayChrome(ds);
    toast('Could not save value', true); console.error(e);
  }
  pending.delete(r.id);
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- HISTORY ----
const HDAYS = 28;
function dayState(r, ds){
  const created = r.created_at ? ymd(new Date(r.created_at)) : null;
  if(created && ds < created) return 'na';
  if(isRest(ds)) return 'rest';
  const log = getLog(r.id, ds);
  if(CADENCE[r.cadence].periodic){ return (log && log.completed) ? 'done' : 'na'; }
  if(log && log.completed) return 'done';
  if(log && log.value!=null) return 'partial';
  return 'miss';
}
function sqColor(state, raw){
  if(state==='done') return raw;
  if(state==='partial') return 'color-mix(in srgb,'+raw+' 42%, transparent)';
  if(state==='miss') return 'rgba(255,255,255,.06)';
  if(state==='rest') return 'repeating-linear-gradient(135deg,rgba(255,255,255,.24) 0 1px,transparent 1px 3px)';
  return 'rgba(255,255,255,.03)';
}
function renderHistory(){
  const dsToday = ymd(today);
  const daily = routines.filter(r=>!CADENCE[r.cadence].periodic);
  ringSvg(dsToday);
  $('subtitle').textContent = `Last ${HDAYS/7} weeks`;
  const wkStart = parseYmd(weekKey(today));
  const elapsed = Math.round((today - wkStart)/86400000) + 1;
  let possible=0, done=0, checkoffs=0;
  for(const r of daily){ for(let i=0;i<elapsed;i++){ const d=ymd(addDays(wkStart,i)); if(d>dsToday) break; const st=dayState(r,d); if(st!=='na' && st!=='rest'){ possible++; if(isDone(r.id,d)) done++; } } }
  for(const [,m] of logs){ for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===weekKey(today)) checkoffs++; } }
  const pct = possible? Math.round(done/possible*100):0;
  const best = daily.reduce((m,r)=>Math.max(m,streak(r.id)),0);
  let html = `<div class="tiles">
      <div class="tile"><div class="big num" style="color:var(--health)">${pct}%</div><div class="lbl">This week</div></div>
      <div class="tile"><div class="big num" style="color:var(--flame)">${best}${FLAME_SVG}</div><div class="lbl">Best streak</div></div>
      <div class="tile"><div class="big num">${checkoffs}</div><div class="lbl">Check-offs</div></div>
    </div>
    <div class="legend"><span><i style="background:#34d399"></i>Done</span>
      <span><i style="background:color-mix(in srgb,#34d399 42%,transparent)"></i>Partial</span>
      <span><i style="background:rgba(255,255,255,.06)"></i>Missed</span>
      <span><i style="background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 1px,transparent 1px 3px)"></i>Rest day</span></div>`;
  if(!routines.length){ $('app').innerHTML = html + '<div class="loading">No routines yet.</div>'; return; }
  const wi = weighInPoints();
  if(wi && wi.pts.length){
    const pts=wi.pts, latest=pts[pts.length-1], first=pts[0];
    const unit=escapeHtml(wi.r.unit||'kg');
    const delta = latest.top-first.top;
    const sub = pts.length>1
      ? `${fmtW(latest.top)} ${unit} · <span style="color:var(--muted2)">${delta>0?'+':''}${fmtW(delta)} since ${fmtDate(first.date)}</span>`
      : `${fmtW(latest.top)} ${unit}`;
    html += `<div class="hcard"><div class="top"><span class="n">${escapeHtml(wi.r.name)}</span><span class="s">${sub}</span></div>${chartSvg(pts,{empty:'Log 2+ weigh-ins to see the trend.'})}</div>`;
  }
  const days=[]; for(let i=HDAYS-1;i>=0;i--) days.push(ymd(addDays(today,-i)));
  for(const cat of CATEGORIES){
    const items = routines.filter(r=>r.category===cat.key); if(!items.length) continue;
    html += `<div class="cat"><h2><span class="dot" style="background:${cat.color}"></span>${cat.label}</h2>`;
    for(const r of items){
      const raw = RAWCOLOR[r.category];
      const per = CADENCE[r.cadence].periodic;
      const sk=streak(r.id);
      const sub = per ? CADENCE[r.cadence].label : (sk>0?`${FLAME_SVG}${sk}`:'no active streak');
      const sq = days.map(d=>`<div class="sq" style="background:${sqColor(dayState(r,d),raw)}"></div>`).join('');
      html += `<div class="hcard"><div class="top"><span class="n">${escapeHtml(r.name)}</span><span class="s${!per&&sk>0?' on':''}">${sub}</span></div><div class="hstrip">${sq}</div></div>`;
    }
    html += `</div>`;
  }
  $('app').innerHTML = html;
}

// ---- GYM ----
function exName(id){ const e=gymExercises.find(x=>x.id===id); return e?e.name:'Exercise'; }
function fmtW(w){ w=Number(w)||0; return Number.isInteger(w)?String(w):w.toFixed(1); }
function fmtDate(ds){ try{ return parseYmd(ds).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }catch(e){ return ds; } }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function isTodayDate(ds){ return ds===ymd(today); }
// local gymSets mirror maintenance (keeps derived PR/XP/charts correct without refetch)
function gsAdd(row){ gymSets.push(row); }
function gsPatch(id,f){ const s=gymSets.find(x=>x.id===id); if(s) Object.assign(s,f); }
function gsDel(id){ const i=gymSets.findIndex(x=>x.id===id); if(i>=0) gymSets.splice(i,1); }
function exercisePR(id){ let m=0; for(const s of gymSets){ if(s.exercise_id===id && s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function historicalTop(exId,exclWid){ let m=0; for(const s of gymSets){ if(s.exercise_id!==exId||s.workout_id===exclWid) continue; if(s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function workoutTop(exId,wid){ let m=0; for(const s of gymSets){ if(s.exercise_id===exId&&s.workout_id===wid&&s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function exerciseLastSets(id, excludeWid){
  for(const w of gymWorkouts){ if(w.id===excludeWid) continue;
    const ss=gymSets.filter(s=>s.workout_id===w.id && s.exercise_id===id).sort((a,b)=>a.set_no-b.set_no);
    if(ss.length) return {date:w.workout_date, sets:ss}; }
  return null;
}
function gymChartData(id){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const top={};
  for(const s of gymSets){ if(s.exercise_id!==id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    top[w.workout_date]=Math.max(top[w.workout_date]||0, Number(s.weight)||0); }
  return Object.keys(top).sort().map(d=>({date:d, top:top[d]}));
}
function gymPrEvents(){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const perEx={};
  for(const s of gymSets){ if(!s.exercise_id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    const e=(perEx[s.exercise_id]=perEx[s.exercise_id]||{}); e[w.workout_date]=Math.max(e[w.workout_date]||0, Number(s.weight)||0); }
  let events=0;
  for(const id in perEx){ const days=Object.keys(perEx[id]).sort(); let mx=-1; days.forEach((d,i)=>{ const v=perEx[id][d]; if(i===0) mx=v; else if(v>mx){ mx=v; events++; } }); }
  return events;
}
function gymBonusXp(){ return gymReady ? gymPrEvents()*15 : 0; }
function chartSvg(pts, opt){
  opt = opt||{}; const color = opt.color||'var(--fitness)';
  if(pts.length<2) return `<div class="gempty" style="padding:8px 0">${opt.empty||'Log 2+ sessions to see the trend.'}</div>`;
  const W=300,H=56,pad=8; const ws=pts.map(p=>p.top); const mn=Math.min(...ws), mx=Math.max(...ws); const rng=(mx-mn)||1;
  const xs=i=> pad + (i/(pts.length-1))*(W-2*pad);
  const ys=v=> (H-pad) - ((v-mn)/rng)*(H-2*pad);
  let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.top).toFixed(1)+' '; });
  const dots = pts.length>40 ? '' : pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.top).toFixed(1)}" r="2.4" fill="${color}"/>`).join('');
  return `<svg class="gchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
// ---- Estimated 1RM (Epley) ----
function e1rm(w,reps){ w=Number(w)||0; reps=Number(reps)||0; if(w<=0||reps<=0) return 0; if(reps===1) return w; return w*(1+reps/30); }
function exerciseE1RM(id){ let m=0; for(const s of gymSets){ if(s.exercise_id===id) m=Math.max(m, e1rm(s.weight,s.reps)); } return m; }
function gymE1rmChartData(id){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const top={};
  for(const s of gymSets){ if(s.exercise_id!==id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    top[w.workout_date]=Math.max(top[w.workout_date]||0, e1rm(s.weight,s.reps)); }
  return Object.keys(top).sort().map(d=>({date:d, top:top[d]}));
}
// ---- Body-weight trend (from the weigh-in routine's logged values) ----
// `role` is the stable handle (build 15); the name regexes stay as a fallback for a
// database where routines-role.sql has not run yet, and for a routine created before
// the editor offered the field. Rename-proof once the role is set.
function roleRoutine(role){ return routines.find(r=>r.role===role) || null; }
function weighInRoutine(){ return roleRoutine('weigh') || routines.find(r=>r.track_value && /weigh/i.test(r.name)) || routines.find(r=>/weigh/i.test(r.name)) || null; }
function weighInPoints(){
  const r=weighInRoutine(); if(!r) return null;
  const m=logs.get(r.id); const pts=[];
  if(m){ for(const [ds,l] of m){ const v=Number(l.value); if(l.value!=null && l.value!=='' && !isNaN(v)) pts.push({date:ds, top:v}); } }
  pts.sort((a,b)=> a.date<b.date?-1:1);
  return {r, pts};
}

// ---- session lifecycle ----
async function startSession(kind){
  if(busy||!gymReady) return;
  let label, exIds;
  if(kind==='A'||kind==='B'){ label='Full Body '+kind; exIds=gymExercises.filter(e=>e.in_template===kind).sort((a,b)=>a.sort_order-b.sort_order).map(e=>e.id); }
  else { label='Workout'; exIds=[]; }
  busy=true;
  const ds=ymd(today);
  try{
    const wk=await rest('POST','gym_workouts',{body:{workout_date:ds, label, finished:false, ex_order:exIds, ex_notes:{}}, prefer:'return=representation'});
    const w=Array.isArray(wk)?wk[0]:wk;
    gymWorkouts.unshift(w);
    gymSession={ id:w.id, label, date:ds, note:'', ex_order:exIds.slice(), ex_notes:{},
      exercises: exIds.map(id=>({exId:id, note:'', sets:[{weight:'',reps:''}]})),
      finished:false, tickedRoutine:false,
      preLevel:levelInfo(totalXp()).level, preTiers:completedTierCount(), prToasted:new Set() };
    gymTab='log'; stopRest(); renderGym();
  }catch(e){ toast('Could not start workout — did the SQL run?', true); console.error(e); }
  busy=false;
}
function buildExercisesFromWorkout(w){
  const sets=gymSets.filter(s=>s.workout_id===w.id);
  const present=[...new Set(sets.map(s=>s.exercise_id))];
  let order = Array.isArray(w.ex_order)&&w.ex_order.length ? w.ex_order.slice() : null;
  if(!order){
    order = present.slice().sort((a,b)=>{ const ea=gymExercises.find(x=>x.id===a),eb=gymExercises.find(x=>x.id===b); return (ea?ea.sort_order:0)-(eb?eb.sort_order:0); });
  } else {
    present.forEach(id=>{ if(!order.includes(id)) order.push(id); });
    order = order.filter(id=>gymExercises.some(x=>x.id===id));
  }
  const notes = (w.ex_notes && typeof w.ex_notes==='object') ? w.ex_notes : {};
  return order.map(id=>{
    const ss=sets.filter(s=>s.exercise_id===id).sort((a,b)=>(a.set_no||0)-(b.set_no||0))
       .map(s=>({id:s.id, set_no:s.set_no, weight:s.weight, reps:s.reps}));
    if(!ss.length) ss.push({weight:'',reps:''});
    return { exId:id, note: notes[id]||'', sets: ss };
  });
}
function openWorkout(wid){
  if(busy) return;
  const w=gymWorkouts.find(x=>String(x.id)===String(wid)); if(!w) return;
  gymSession={ id:w.id, label:w.label||'Workout', date:w.workout_date, note:w.note||'',
    ex_order:Array.isArray(w.ex_order)?w.ex_order.slice():null, ex_notes:(w.ex_notes&&typeof w.ex_notes==='object')?w.ex_notes:{},
    exercises: buildExercisesFromWorkout(w),
    finished: w.finished!==false,
    tickedRoutine: gymSets.some(s=>s.workout_id===w.id),
    preLevel:levelInfo(totalXp()).level, preTiers:completedTierCount(), prToasted:new Set() };
  gymTab='log'; stopRest(); renderGym();
}
function nextSetNo(ex){ let m=0; ex.sets.forEach(s=>{ if(s.set_no) m=Math.max(m,s.set_no); }); return m+1; }
async function persistSet(i,j){
  if(!gymSession) return;
  const ex=gymSession.exercises[i]; if(!ex) return; const st=ex.sets[j]; if(!st||st._saving) return;
  const reps=parseInt(st.reps,10);
  const weight=(st.weight===''||st.weight==null)?0:Number(st.weight);
  if(!(reps>0) || isNaN(weight)){
    if(st.id){ st._saving=true; try{ await rest('DELETE','gym_sets?id=eq.'+st.id); gsDel(st.id); }catch(e){} st.id=null; st._saving=false; }
    return;
  }
  st._saving=true;
  try{
    if(st.id){
      await rest('PATCH','gym_sets?id=eq.'+st.id,{body:{weight,reps},prefer:'return=minimal'});
      gsPatch(st.id,{weight,reps});
    } else {
      const wasFirst = !gymSets.some(s=>s.workout_id===gymSession.id);
      const set_no = nextSetNo(ex);
      const r=await rest('POST','gym_sets',{body:{workout_id:gymSession.id, exercise_id:ex.exId, set_no, weight, reps}, prefer:'return=representation'});
      const ns=Array.isArray(r)?r[0]:r;
      if(ns){ st.id=ns.id; st.set_no=(ns.set_no!=null?ns.set_no:set_no); gsAdd({id:ns.id, workout_id:gymSession.id, exercise_id:ex.exId, set_no:st.set_no, weight, reps}); }
      if(wasFirst && !gymSession.tickedRoutine && isTodayDate(gymSession.date)){ gymSession.tickedRoutine=true; completeGymRoutine(gymSession.date); }
    }
    maybePR(ex.exId);
    markSavedStat();
  }catch(e){ toast('Set not saved — check connection', true); console.error(e); }
  st._saving=false;
}
function maybePR(exId){
  if(!gymSession || gymSession.prToasted.has(exId)) return;
  const hasHist=gymSets.some(s=>s.exercise_id===exId && s.workout_id!==gymSession.id);
  if(!hasHist) return; // first-ever log = baseline, no PR
  const cur=workoutTop(exId,gymSession.id), hist=historicalTop(exId,gymSession.id);
  if(cur>0 && cur>hist){ gymSession.prToasted.add(exId); prFeedback(exName(exId),cur); updatePrChip(exId); }
}
function prFeedback(name,val){ if(navigator.vibrate) navigator.vibrate([40,50,40]); bigBurst();
  haptic(); toast('New PR · '+name+' '+fmtW(val)+' kg', false, true); }
function updatePrChip(exId){ const el=document.querySelector('[data-prchip="'+String(exId).replace(/"/g,'')+'"]'); if(el){ const pr=exercisePR(exId); el.textContent=pr?'PR '+fmtW(pr)+'kg':''; } }
function markSavedStat(){ const el=$('gsavestat'); if(!el) return; const d=new Date();
  const p=n=>String(n).padStart(2,'0'); el.textContent='Auto-saved '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
// live set-save scheduling
const gsetTimers={};
function scheduleSetSave(i,j){ const k=i+':'+j; clearTimeout(gsetTimers[k]); gsetTimers[k]=setTimeout(()=>{ delete gsetTimers[k]; persistSet(i,j); }, 700); }
function flushSetSave(i,j){ const k=i+':'+j; if(gsetTimers[k]){ clearTimeout(gsetTimers[k]); delete gsetTimers[k]; } persistSet(i,j); }
function flushAllSets(){ Object.keys(gsetTimers).forEach(k=>{ const p=k.split(':'); flushSetSave(+p[0],+p[1]); }); }

function gAddSet(i){ const ex=gymSession.exercises[i]; const last=ex.sets[ex.sets.length-1]; ex.sets.push({weight:last?last.weight:'', reps:''}); startRest(); renderGym(); }
async function gRmSet(i,j){ const ex=gymSession.exercises[i]; if(!ex) return; const st=ex.sets[j]; ex.sets.splice(j,1);
  if(st&&st.id){ try{ await rest('DELETE','gym_sets?id=eq.'+st.id); gsDel(st.id); }catch(e){ toast('Could not remove set', true); } }
  if(!ex.sets.length) ex.sets.push({weight:'',reps:''}); renderGym(); }
function gMoveEx(i,dir){ const a=gymSession.exercises; const j=i+dir; if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; persistExOrder(); renderGym(); }
function persistExOrder(){ if(!gymSession) return; const order=gymSession.exercises.map(e=>e.exId); gymSession.ex_order=order;
  const w=gymWorkouts.find(x=>x.id===gymSession.id); if(w) w.ex_order=order;
  rest('PATCH','gym_workouts?id=eq.'+gymSession.id,{body:{ex_order:order},prefer:'return=minimal'}).then(markSavedStat).catch(()=>toast('Order not saved',true)); }
function persistExNotes(){ if(!gymSession) return; const notes={}; gymSession.exercises.forEach(e=>{ if(e.note&&e.note.trim()) notes[e.exId]=e.note.trim(); }); gymSession.ex_notes=notes;
  const w=gymWorkouts.find(x=>x.id===gymSession.id); if(w) w.ex_notes=notes;
  rest('PATCH','gym_workouts?id=eq.'+gymSession.id,{body:{ex_notes:notes},prefer:'return=minimal'}).then(markSavedStat).catch(()=>toast('Note not saved',true)); }
function persistMeta(){ if(!gymSession) return;

// Full Body A and B used to be fixed in GYM_SEED, so changing the split meant changing

let tplTab = 'A';
function tplMembers(tab){

async function tplPatch(id, body){
  const e=gymExercises.find(x=>String(x.id)===String(id)); if(!e) return false;
  const prev={...e};
  Object.assign(e, body);          // optimistic: the sheet redraws immediately
  renderTemplates();
  try{ await rest('PATCH','gym_exercises?id=eq.'+id,{body,prefer:'return=minimal'}); return true; }
  catch(err){ Object.assign(e, prev); renderTemplates(); toast('Could not save that', true); console.error(err); return false; }
}
function tplAdd(id){
  // Append: a new exercise belongs at the end of the session, not wherever its global
  // sort_order happens to put it.
  const last=tplMembers(tplTab).slice(-1)[0];
  const order=(last?(last.sort_order||0):0)+1;
  return tplPatch(id, { in_template: tplTab, sort_order: order });
}
function tplSet(id, tab){ return tplPatch(id, { in_template: tab }); }
async function tplMove(id, dir){
  const members=tplMembers(tplTab);
  const i=members.findIndex(e=>String(e.id)===String(id));
  const j=dir==='up'?i-1:i+1;
  if(i<0||j<0||j>=members.length) return;
  const a=members[i], b=members[j];
  // sort_order is global across the library, so swap the two values rather than
  // renumbering — that keeps the other template's order untouched.
  const av=a.sort_order||0, bv=b.sort_order||0;
  const prevA=av, prevB=bv;
  a.sort_order=bv; b.sort_order=av;
  renderTemplates();
  try{
    await rest('PATCH','gym_exercises?id=eq.'+a.id,{body:{sort_order:bv},prefer:'return=minimal'});
    await rest('PATCH','gym_exercises?id=eq.'+b.id,{body:{sort_order:av},prefer:'return=minimal'});
  }catch(e){
    a.sort_order=prevA; b.sort_order=prevB; renderTemplates();
    toast('Could not reorder', true); console.error(e);
  }
}

// rest timer (distinct from rest-DAY toggle)
// Counts against the wall clock, not interval ticks: iOS pauses intervals while the
// phone is locked, so a tick-counting timer drifts exactly when it matters.
let restT=null, restLeft=0, restDur=90, restEnd=0, restTotal=0;
function restRemaining(){ return Math.max(0, Math.ceil((restEnd-Date.now())/1000)); }
function startRest(){ if(restT) clearInterval(restT); restTotal=restDur; restEnd=Date.now()+restDur*1000; restLeft=restDur;
  restT=setInterval(()=>{ restLeft=restRemaining(); if(restLeft<=0){ clearInterval(restT); restT=null; haptic(); if(navigator.vibrate) navigator.vibrate([60,40,60]); toast('Rest over · next set');
      const b=$('rtimer'); if(b && !RM){ b.classList.remove('ding'); void b.offsetWidth; b.classList.add('ding'); } } renderRest(); }, 250);
  renderRest(); }
function stopRest(){ if(restT){ clearInterval(restT); restT=null; } restLeft=0; }
function restTimerToggle(){ if(restT){ clearInterval(restT); restT=null; restLeft=0; } else { startRest(); } renderGym(); }
function adjustRest(delta){ restDur=Math.max(15, restDur+delta);
  if(restT){ restEnd=Math.max(Date.now()+1000, restEnd+delta*1000); restTotal=Math.max(15, restTotal+delta); restLeft=restRemaining(); }
  renderRest(true); }
let restAnim=null;
function renderRest(rebar){ const v=$('rtimerval'); if(v) v.textContent=fmtTime(restT?restLeft:restDur); const bar=$('rtimer'); if(!bar) return; bar.classList.toggle('run', !!restT);
  const pb=$('rpb'); if(!pb) return;
  if(!restT){ if(restAnim){ restAnim.cancel(); restAnim=null; } pb.style.transform='scaleX(0)'; return; }
  if(restAnim && !rebar && restAnim.effect && restAnim.effect.target===pb) return;
  if(restAnim) restAnim.cancel();
  const total=restTotal*1000, rem=Math.max(0,restEnd-Date.now());
  restAnim=pb.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:total,easing:'linear',fill:'forwards'});
  restAnim.currentTime=total-rem; }
