<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Life Organiser</title>
<meta name="theme-color" content="#0f1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life OS" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0f1220; --bg2:#12141c; --surface:#1a1e2e; --surface2:#222741;
    --line:rgba(255,255,255,.08); --text:#e7e9f0; --muted:#9aa0b4; --muted2:#6b7186;
    --health:#34d399; --fitness:#fb923c; --mind:#a78bfa; --work:#38bdf8;
    --flame:#fbbf24; --danger:#f87171; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1b2036 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 110px}

  header{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .ring{position:relative;width:60px;height:60px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .htitle{flex:1;min-width:0}
  .htitle h1{margin:0;font-size:19px;letter-spacing:.2px}
  .htitle .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .mng{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
  .mng:active{transform:scale(.96)}

  .levelbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;cursor:pointer}
  .levelbar .lbtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
  .levelbar .lv{font-weight:800}
  .levelbar .rank{color:var(--mind);font-weight:600}
  .levelbar .xpn{margin-left:auto;color:var(--muted);font-size:12px}
  .xpbar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--mind),var(--health));border-radius:8px;transition:width .5s ease}
  .xpbar.big{height:12px}
  .xpfloat{position:fixed;transform:translateX(-50%);color:var(--flame);font-weight:800;font-size:15px;pointer-events:none;z-index:75;text-shadow:0 2px 8px rgba(0,0,0,.5)}

  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:18px}
  .datebar button{background:var(--surface2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
  .datebar button:disabled{opacity:.35;cursor:default}
  .datebar .lbl{font-weight:600;font-size:15px;text-align:center}
  .datebar .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .restrow{margin:-8px 0 18px}
  .restbtn{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .restbtn.on{color:#7dd3fc;border-color:color-mix(in srgb,#38bdf8 40%,var(--line));background:color-mix(in srgb,#38bdf8 8%,var(--surface))}

  .cat{margin-bottom:22px}
  .cat h2{display:flex;align-items:center;gap:9px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 4px 10px}
  .cat h2 .dot{width:9px;height:9px;border-radius:50%}
  .cat h2 .cnt{margin-left:auto;font-size:12px;color:var(--muted2);letter-spacing:.5px}

  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;transition:transform .12s ease,border-color .2s}
  .row.done{border-color:var(--acc);background:linear-gradient(0deg,color-mix(in srgb,var(--acc) 9%,var(--surface)),var(--surface))}
  .row .info{flex:1;min-width:0;cursor:pointer}
  .row .name{font-weight:600;font-size:15.5px;line-height:1.2;display:flex;align-items:center;gap:6px}
  .row .name .noteflag{font-size:12px;opacity:.8}
  .row .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .flame{color:var(--flame);font-weight:700}
  .tgt{color:var(--muted)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.due{color:#0f1220;background:var(--acc);border-color:transparent;font-weight:700}
  .badge.cad{background:var(--surface2)}
  .pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.09);margin-top:8px;overflow:hidden}
  .pbar > i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .35s ease}

  .val{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:5px 8px}
  .val input{width:52px;background:transparent;border:none;color:var(--text);font-size:15px;text-align:right;outline:none;font-weight:600}
  .val .unit{font-size:12px;color:var(--muted)}

  .check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--muted2);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
  .check svg{width:20px;height:20px;stroke:#0f1220;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .18s}
  .row.done .check{background:var(--acc);border-color:var(--acc)}
  .row.done .check svg{opacity:1;transform:scale(1)}
  .check.log{width:auto;height:34px;border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;color:var(--muted);border-color:var(--line)}
  .row.done .check.log{color:#0f1220;background:var(--acc);border-color:var(--acc)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .check.pop{animation:pop .32s ease}

  /* History */
  .tiles{display:flex;gap:10px;margin-bottom:16px}
  .tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
  .tile .big{font-size:24px;font-weight:800;line-height:1}
  .tile .lbl{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
  .legend{display:flex;gap:14px;justify-content:center;margin:0 0 18px;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
  .hcard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hcard .top .n{font-weight:600;font-size:14.5px}
  .hcard .top .s{margin-left:auto;font-size:12px;color:var(--muted)}
  .hstrip{display:flex;gap:3px}
  .hstrip .sq{flex:1;min-width:0;height:14px;border-radius:3px;background:rgba(255,255,255,.05)}

  /* Rewards */
  .lvlcard{background:linear-gradient(160deg,#242a44,#191d2c);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;margin-bottom:6px}
  .lvlbig{font-size:44px;font-weight:800;line-height:1}
  .lvlrank{color:var(--mind);font-weight:700;letter-spacing:.5px;margin:4px 0 16px}
  .lvlmeta{color:var(--muted);font-size:12.5px;margin-top:10px}
  .rewh{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 12px}
  .catlv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
  .catlv-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:14px}
  .catlv-top .dot{width:9px;height:9px;border-radius:50%}
  .catlv-top .tn{font-weight:600}
  .catlv-top .cl{margin-left:auto;color:var(--muted);font-weight:700}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .badge2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;opacity:.45;filter:grayscale(.7)}
  .badge2.got{opacity:1;filter:none;border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
  .badge2 .bi{font-size:26px}
  .badge2 .bn{font-weight:700;font-size:12.5px;margin-top:5px}
  .badge2 .bd{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .rewnote{color:var(--muted2);font-size:11.5px;text-align:center;margin-top:18px}

  /* Daily quests */
  .quests{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:18px}
  .qhead{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 11px}
  .qhead .qsum{margin-left:auto;letter-spacing:.3px;text-transform:none;font-size:12px;color:var(--muted2)}
  .qhead .qsum b{color:var(--flame)}
  .quest{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line)}
  .quest:first-of-type{border-top:none;padding-top:2px}
  .quest .qic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
  .quest.done .qic{background:color-mix(in srgb,var(--flame) 22%,var(--surface2));box-shadow:0 0 0 1px color-mix(in srgb,var(--flame) 45%,transparent)}
  .quest .qmid{flex:1;min-width:0}
  .quest .qn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .quest .qn .qtick{color:var(--flame)}
  .quest .qd{font-size:11.5px;color:var(--muted);margin-top:1px}
  .quest .qbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
  .quest .qbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mind),var(--flame));transition:width .4s ease}
  .quest.done .qbar > i{background:var(--flame)}
  .quest .qxp{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--muted2);min-width:42px;text-align:right}
  .quest.done .qxp{color:var(--flame)}
  .qfoot{color:var(--muted2);font-size:11px;text-align:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
  .setnote{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--flame) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--flame) 30%,var(--line));border-radius:12px;padding:10px 13px;margin-bottom:9px;font-size:12.5px;color:var(--text)}
  .setnote b{color:var(--flame)}

  /* Badge progress on tiles */
  .badge2{cursor:pointer;position:relative}
  .badge2:active{transform:scale(.97)}
  .badge2 .bprog{height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px}
  .badge2 .bprog > i{display:block;height:100%;border-radius:4px;background:var(--muted);transition:width .4s ease}
  .badge2.got .bprog{display:none}
  .badge2 .bcount{font-size:10px;color:var(--muted2);margin-top:4px}
  .badge2 .bgot{position:absolute;top:7px;right:8px;font-size:12px;color:var(--flame)}
  /* Badge detail sheet */
  .bdhero{text-align:center;padding:8px 0 4px}
  .bdhero .bdi{font-size:60px;line-height:1}
  .bdhero .bdn{font-weight:800;font-size:20px;margin-top:8px}
  .bdhero .bds{color:var(--muted);font-size:13.5px;margin-top:4px}
  .bdstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
  .bdstat .bl{display:flex;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .bdstat .bl b{margin-left:auto;color:var(--text);font-size:14px}
  .bdstat .xpbar{height:10px}
  .bdunlocked{text-align:center;color:var(--flame);font-weight:700;font-size:14px;margin-top:18px}

  /* Level-up moment */
  .lvlup{background:radial-gradient(900px 500px at 50% 30%, rgba(251,191,36,.18), rgba(8,10,18,.92) 60%)!important}
  .lucard{max-width:400px;margin:16vh auto 0;text-align:center;padding:20px}
  .lucard .luspark{font-size:52px;animation:luspin 2.4s linear infinite;display:inline-block}
  @keyframes luspin{to{transform:rotate(360deg)}}
  .lucard .lulabel{margin-top:6px;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--flame);font-weight:800}
  .lucard .lubig{font-size:74px;font-weight:800;line-height:1;margin:6px 0 2px;
    background:linear-gradient(180deg,#fff,var(--flame));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lucard .lurank{font-size:17px;font-weight:700;color:var(--mind)}
  .lucard .lurankup{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--flame);background:color-mix(in srgb,var(--flame) 14%,transparent);border:1px solid color-mix(in srgb,var(--flame) 45%,transparent)}
  .lucard .lunext{color:var(--muted);font-size:13px;margin-top:16px}
  .lucard .lugo{margin-top:22px;width:100%;background:var(--flame);color:#2a1e02;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
  .lucard .lugo:active{transform:scale(.97)}
  @keyframes lupop{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .lvlup.show .lucard{animation:lupop .5s cubic-bezier(.2,.8,.3,1.2)}

  /* Overlays */
  .overlay{position:fixed;inset:0;background:rgba(8,10,18,.86);backdrop-filter:blur(4px);z-index:60;
    display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}
  .overlay.show{display:block}
  .sheet{max-width:600px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px}
  .sheet h2{margin:2px 0 14px;font-size:18px;display:flex;align-items:center}
  .sheet h2 .x{margin-left:auto;background:var(--surface2);border:none;color:var(--text);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
  .addbtn{width:100%;background:var(--surface2);border:1px dashed var(--line);color:var(--text);border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
  .egroup{margin-bottom:16px}
  .egroup .glabel{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 2px 8px;display:flex;align-items:center;gap:8px}
  .erow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .erow.inactive{opacity:.5}
  .erow .en{flex:1;min-width:0}
  .erow .en .n{font-weight:600;font-size:14.5px}
  .erow .en .c{font-size:11.5px;color:var(--muted);margin-top:2px}
  .erow .ord{display:flex;flex-direction:column;gap:2px}
  .erow .ord button,.erow .ib{background:var(--surface2);border:none;color:var(--text);border-radius:8px;cursor:pointer}
  .erow .ord button{width:26px;height:20px;font-size:11px;line-height:1}
  .erow .ib{width:34px;height:34px;font-size:15px}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin:0 2px 6px}
  .field input[type=text],.field input[type=email],.field input[type=password],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:11px 12px;font-size:15px;outline:none;font-family:inherit}
  .field textarea{resize:vertical}
  .field.rowly{display:flex;gap:10px}
  .field.rowly > div{flex:1}
  .toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
  .toggle .sw{width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s;flex:0 0 auto}
  .toggle .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
  .toggle.on .sw{background:var(--mind)}
  .toggle.on .sw::after{transform:translateX(18px)}
  .formbtns{display:flex;gap:10px;margin-top:16px}
  .formbtns button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer}
  .btn-save{background:var(--mind);color:#12101f}
  .btn-cancel{background:var(--surface2);color:var(--text)}
  .btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 auto!important;padding:13px 16px!important}
  .hidden{display:none!important}

  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);
    display:flex;gap:4px;background:rgba(26,30,46,.92);backdrop-filter:blur(10px);border:1px solid var(--line);
    border-radius:16px;padding:5px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .navbtn{background:transparent;border:none;color:var(--muted);font-size:13.5px;font-weight:600;
    padding:9px 18px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .navbtn.active{background:var(--surface2);color:var(--text)}

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(120px);
    background:#222741;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:12px;
    font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s;z-index:80;max-width:90%;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger)}
  .toast.level{border-color:var(--flame);background:#2a2418;font-weight:700}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  .foot{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:26px}
  .confetti{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:70}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ring" id="ring"></div>
    <div class="htitle">
      <h1>Life Organiser</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <button class="mng" id="manageBtn">⚙︎ Manage</button>
  </header>

  <div class="levelbar" id="levelbar"></div>

  <div class="datebar" id="datebar">
    <button id="prevDay" aria-label="Previous day">‹</button>
    <div class="lbl" id="dateLbl">—<small></small></div>
    <button id="nextDay" aria-label="Next day">›</button>
  </div>
  <div class="restrow" id="restrow"></div>

  <main id="app"><div class="loading">Connecting to your dashboard…</div></main>
  <div class="foot">Life Organiser · build 9</div>
</div>

<nav class="nav">
  <button class="navbtn active" data-view="today">◉ Today</button>
  <button class="navbtn" data-view="history">▦ History</button>
  <button class="navbtn" data-view="rewards">✦ Rewards</button>
</nav>

<div class="overlay" id="editor">
  <div class="sheet">
    <h2 id="editorTitle">Manage routines <button class="x" id="closeEditor">×</button></h2>
    <div id="editorBody"></div>
  </div>
</div>
<div class="overlay" id="detail"><div class="sheet" id="detailSheet"></div></div>
<div class="overlay lvlup" id="levelup"><div class="lucard" id="lucard"></div></div>

<div class="overlay" id="login">
  <div class="sheet" style="max-width:380px;margin-top:12vh">
    <h2 style="justify-content:center">Life Organiser</h2>
    <div style="text-align:center;color:var(--muted);font-size:13px;margin:-8px 0 18px">Sign in to your dashboard</div>
    <div class="field"><label>Email</label><input type="email" id="l-email" autocomplete="username" inputmode="email"></div>

async function setLog(routine, ds, on, value, completed, note){

// metrics
function streak(rid){
  let n=0, d=new Date(today), guard=0;
  if(!isDone(rid,ymd(d)) && !isRest(ymd(d))) d=addDays(d,-1);
  while(guard++ < 600){ const ds=ymd(d);
    if(isDone(rid,ds)){ n++; d=addDays(d,-1); }
    else if(isRest(ds)){ d=addDays(d,-1); }
    else break;
  }
  return n;
}
function lastDone(rid){ const m=logs.get(rid); if(!m) return null; let best=null; for(const [ds,l] of m){ if(l.completed && (!best||ds>best)) best=ds; } return best; }
function weekKey(d){ const dt=new Date(d); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off); return ymd(dt); }
function countWeek(rid,ref){ const wk=weekKey(ref); let c=0; const m=logs.get(rid); if(!m)return 0; for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===wk) c++; } return c; }
function periodicStatus(routine){
  const cad=CADENCE[routine.cadence];
  if(cad.weekly){ const c=countWeek(routine.id,selected); return { due:c<cad.weekly, text:`${c}/${cad.weekly} this week` }; }
  const ld=lastDone(routine.id);
  if(!ld) return { due:true, text:'Not done yet' };
  const days=Math.round((today-parseYmd(ld))/86400000);
  if(days>=cad.interval) return { due:true, text:days===0?'Done today':`Last ${days}d ago` };
  return { due:false, text:`Next in ${cad.interval-days}d` };
}

function weekIndex(ds){ const monday=parseYmd(weekKey(parseYmd(ds))); const epoch=new Date(2024,0,1); return Math.round((monday-epoch)/604800000); }
function questsForDate(ds){
  const avail=QUEST_POOL.filter(q=>q.applies()); const n=avail.length; if(!n) return [];
  const start=(((weekIndex(ds)%n)+n)%n); const picks=[];
  for(let k=0;k<n && picks.length<4;k++) picks.push(avail[(start+k)%n]);
  return picks;
}

function totalQuestXp(){

function ringSvg(done,total){
  const pct = total? done/total : 0;
  const R=25, C=2*Math.PI*R, off=C*(1-pct);
  const col = pct>=1? 'var(--health)' : 'var(--mind)';
  $('ring').innerHTML =
    `<svg width="60" height="60" viewBox="0 0 60 60">
       <circle cx="30" cy="30" r="${R}" stroke="rgba(255,255,255,.10)" stroke-width="6" fill="none"/>
       <circle cx="30" cy="30" r="${R}" stroke="${col}" stroke-width="6" fill="none"
         stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s ease"/>
     </svg><div class="pct">${done}/${total}</div>`;
}

    const items = routines.filter(r=>r.category===cat.key);
    if(!items.length) continue;
    const section=document.createElement('section'); section.className='cat'; section.style.setProperty('--acc',cat.color);
    const dailyInCat = items.filter(r=>!CADENCE[r.cadence].periodic);
    const doneInCat = dailyInCat.filter(r=>isDone(r.id,ds)).length;
    section.innerHTML = `<h2><span class="dot" style="background:${cat.color}"></span>${cat.label}
      ${dailyInCat.length?`<span class="cnt">${doneInCat}/${dailyInCat.length}</span>`:''}</h2>`;
    for(const r of items) section.appendChild(rowEl(r,cat,ds));
    app.appendChild(section);
  }
}
function questsHtml(ds){
  const qs=questsForDate(ds); if(!qs.length) return '';
  const doneCount=qs.filter(q=>questDone(q,ds)).length;
  const earned=questXpForDay(ds);
  let rows='';
  for(const q of qs){
    const p=q.progress(ds); const done=p.have>=p.need;
    const pct=Math.max(0,Math.min(1, p.need? p.have/p.need : 0))*100;
    rows+=`<div class="quest${done?' done':''}">
      <div class="qic">${done?'✓':q.icon}</div>
      <div class="qmid">
        <div class="qn">${q.name}${done?'<span class="qtick">✦</span>':''}</div>
        <div class="qd">${q.desc} · ${Math.min(p.have,p.need)}/${p.need}</div>
        <div class="qbar"><i style="width:${pct}%"></i></div>
      </div>
      <div class="qxp">+${q.xp}</div>
    </div>`;
  }
  return `<div class="quests"><div class="qhead">◈ Daily Quests
    <span class="qsum">${doneCount}/${qs.length} done · <b>+${earned} XP</b></span></div>${rows}
    <div class="qfoot">Reset daily · fresh set every Monday</div></div>`;
}
function rowEl(r,cat,ds){
  const cad=CADENCE[r.cadence];
  const done=isDone(r.id,ds);
  const log=getLog(r.id,ds);
  const el=document.createElement('div'); el.className='row'+(done?' done':''); el.style.setProperty('--acc',cat.color);
  let meta='';
  if(cad.periodic){
    const st=periodicStatus(r);
    meta += `<span class="badge cad">${cad.label}</span>`;
    meta += st.due ? `<span class="badge due">Due</span>` : `<span class="badge">${st.text}</span>`;
    if(st.due && st.text!=='Due' && st.text!=='Not done yet') meta+=`<span>${st.text}</span>`;
  } else {
    const s=streak(r.id);
    meta += s>0 ? `<span class="flame">🔥 ${s}</span>` : `<span style="color:var(--muted2)">Build a streak</span>`;
  }
  const hasTarget = r.track_value && r.target_value!=null;
  if(hasTarget){ const cur = log && log.value!=null ? log.value : 0; meta += `<span class="tgt">${cur} / ${r.target_value}${r.unit||''}</span>`; }
  let pbar='';
  if(hasTarget){ const cur = log && log.value!=null ? Number(log.value) : 0; const pct = Math.max(0, Math.min(1, cur/Number(r.target_value)))*100; pbar = `<div class="pbar"><i style="width:${pct}%"></i></div>`; }
  const noteFlag = (log && log.note) ? `<span class="noteflag" title="Has a note">📝</span>` : '';
  const valHtml = r.track_value ? `<div class="val"><input type="number" inputmode="decimal" data-val="${r.id}" placeholder="0" value="${log&&log.value!=null?log.value:''}"><span class="unit">${r.unit||''}</span></div>` : '';
  const control = cad.periodic ? `<button class="check log" data-toggle="${r.id}">${done?'Done ✓':'Log'}</button>`
    : `<button class="check" data-toggle="${r.id}" aria-label="Toggle"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></button>`;
  el.innerHTML = `<div class="info" data-detail="${r.id}"><div class="name">${escapeHtml(r.name)} ${noteFlag}</div><div class="meta">${meta}</div>${pbar}</div>${valHtml}${control}`;
  return el;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- HISTORY ----
const HDAYS = 28;
function dayState(r, ds){
  const created = r.created_at ? ymd(new Date(r.created_at)) : null;
  if(created && ds < created) return 'na';
  if(isRest(ds)) return 'rest';
  const log = getLog(r.id, ds);
  if(CADENCE[r.cadence].periodic){ return (log && log.completed) ? 'done' : 'na'; }
  if(log && log.completed) return 'done';
  if(log && log.value!=null) return 'partial';
  return 'miss';
}
function sqColor(state, raw){
  if(state==='done') return raw;
  if(state==='partial') return 'color-mix(in srgb,'+raw+' 42%, transparent)';
  if(state==='miss') return 'rgba(255,255,255,.06)';
  if(state==='rest') return 'rgba(56,189,248,.30)';
  return 'rgba(255,255,255,.03)';
}
function renderHistory(){
  const dsToday = ymd(today);
  const daily = routines.filter(r=>!CADENCE[r.cadence].periodic);
  ringSvg(daily.filter(r=>isDone(r.id,dsToday)).length, daily.length);
  $('subtitle').textContent = `Last ${HDAYS/7} weeks`;
  const wkStart = parseYmd(weekKey(today));
  const elapsed = Math.round((today - wkStart)/86400000) + 1;
  let possible=0, done=0, checkoffs=0;
  for(const r of daily){ for(let i=0;i<elapsed;i++){ const d=ymd(addDays(wkStart,i)); if(d>dsToday) break; const st=dayState(r,d); if(st!=='na' && st!=='rest'){ possible++; if(isDone(r.id,d)) done++; } } }
  for(const [,m] of logs){ for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===weekKey(today)) checkoffs++; } }
  const pct = possible? Math.round(done/possible*100):0;
  const best = daily.reduce((m,r)=>Math.max(m,streak(r.id)),0);
  let html = `<div class="tiles">
      <div class="tile"><div class="big" style="color:var(--health)">${pct}%</div><div class="lbl">This week</div></div>
      <div class="tile"><div class="big" style="color:var(--flame)">🔥 ${best}</div><div class="lbl">Best streak</div></div>
      <div class="tile"><div class="big">${checkoffs}</div><div class="lbl">Check-offs</div></div>
    </div>
    <div class="legend"><span><i style="background:#34d399"></i>Done</span>
      <span><i style="background:color-mix(in srgb,#34d399 42%,transparent)"></i>Partial</span>
      <span><i style="background:rgba(255,255,255,.06)"></i>Missed</span>
      <span><i style="background:rgba(56,189,248,.30)"></i>Rest</span></div>`;
  if(!routines.length){ $('app').innerHTML = html + '<div class="loading">No routines yet.</div>'; return; }
  const days=[]; for(let i=HDAYS-1;i>=0;i--) days.push(ymd(addDays(today,-i)));
  for(const cat of CATEGORIES){
    const items = routines.filter(r=>r.category===cat.key); if(!items.length) continue;
    html += `<div class="cat"><h2><span class="dot" style="background:${cat.color}"></span>${cat.label}</h2>`;
    for(const r of items){
      const raw = RAWCOLOR[r.category];
      const per = CADENCE[r.cadence].periodic;
      const sub = per ? CADENCE[r.cadence].label : (streak(r.id)>0?`🔥 ${streak(r.id)} day streak`:'No active streak');
      const sq = days.map(d=>`<div class="sq" style="background:${sqColor(dayState(r,d),raw)}"></div>`).join('');
      html += `<div class="hcard"><div class="top"><span class="n">${escapeHtml(r.name)}</span><span class="s">${sub}</span></div><div class="hstrip">${sq}</div></div>`;
    }
    html += `</div>`;
  }
  $('app').innerHTML = html;
}

// ---- interactions ----
let busy=false;
async function onToggle(rid, btn){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid); const ds=ymd(selected);
  const currentlyDone=isDone(rid,ds);
  const valInput=document.querySelector(`[data-val="${rid}"]`);
  const val=valInput?valInput.value:undefined;
  const preLevel = levelInfo(totalXp()).level;
  const preTiers = completedTierCount();
  const preQuests = completedQuestIds(ds);
  try{
    await setLog(r, ds, !currentlyDone, val, true);
    if(!currentlyDone){ btn.classList.add('pop'); if(navigator.vibrate) navigator.vibrate(18); burst(btn); floatXp(btn, xpOfRoutine(r)); checkQuests(preQuests, ds);
      if(!checkSetComplete(preTiers)) checkLevelUp(preLevel); }
    render();
  }catch(e){ toast('Could not save — check connection', true); console.error(e); }
  busy=false;
}
async function onValue(rid, input){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid); const ds=ymd(selected);
  const v=input.value.trim();
  const wasDone=isDone(rid,ds);
  const preLevel = levelInfo(totalXp()).level;
  const preTiers = completedTierCount();
  const preQuests = completedQuestIds(ds);
  try{
    if(v===''){ const cur=getLog(rid,ds); if(cur&&cur.note){ await setLog(r,ds,true,null,false); } else { await setLog(r,ds,false); } }
    else { const done=valueDone(r,v); await setLog(r,ds,true,v,done);
      if(done && !wasDone){ if(navigator.vibrate)navigator.vibrate(14); floatXp(input, xpOfRoutine(r)); checkQuests(preQuests, ds);
        if(!checkSetComplete(preTiers)) checkLevelUp(preLevel); } }
    render();
  }catch(e){ toast('Could not save value', true); console.error(e); }
  busy=false;
}
function checkQuests(preIds, ds){
  const post=completedQuestIds(ds);
  const fresh=questsForDate(ds).filter(q=>post.has(q.id) && !preIds.has(q.id));
  if(!fresh.length) return;
  const q=fresh[fresh.length-1];
  if(navigator.vibrate) navigator.vibrate([12,30,12]);
  const extra = fresh.length>1 ? ` (+${fresh.length-1} more)` : '';
  toast(`✦ Quest complete — ${q.name} · +${q.xp} XP${extra}`, false, true);
}
function showLevelUp(level, prevLevel){
  const rank=rankTitle(level), prevRank=rankTitle(prevLevel);
  const info=levelInfo(totalXp());
  const rankUp = rank!==prevRank ? `<div class="lurankup">✦ New rank unlocked — ${rank}</div>` : '';
  $('lucard').innerHTML=`
    <div class="luspark">✦</div>
    <div class="lulabel">Level up</div>
    <div class="lubig">Lv ${level}</div>
    <div class="lurank">${rank}</div>
    ${rankUp}
    <div class="lunext">${Math.max(0,info.need-info.into)} XP to Level ${level+1}</div>
    <button class="lugo" id="lugo">Continue</button>`;
  const ov=$('levelup'); ov.classList.add('show');
  const close=()=>ov.classList.remove('show');
  $('lugo').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  if(navigator.vibrate) navigator.vibrate([30,40,30,40,60]);
  bigBurst(); setTimeout(bigBurst, 260);
}
function checkLevelUp(preLevel){
  const post=levelInfo(totalXp()).level;

}
function showSetComplete(tier){

  $('f-active').onclick = ()=>{ active=!active; $('f-active').classList.toggle('on',active); };
  $('f-cancel').onclick = renderEditorList;
  if(!isNew) $('f-del').onclick = ()=>deleteRoutine(r);
  $('f-save').onclick = async ()=>{
    const name=$('f-name').value.trim(); if(!name){ toast('Give it a name', true); return; }
    const body={ name, category:$('f-cat').value, cadence:$('f-cad').value, track_value:track,
      unit: track?($('f-unit').value.trim()||null):null,
      target_value: track && $('f-target').value!=='' ? Number($('f-target').value) : null, active };
    try{
      if(isNew){ body.sort_order = maxSort(body.category)+1; await rest('POST','routines',{body,prefer:'return=minimal'}); }
      else { await rest('PATCH','routines?id=eq.'+r.id,{body,prefer:'return=minimal'}); }
      toast('Saved'); allRoutines = await loadAll(); await load(); render(); renderEditorList();
    }catch(e){ toast('Could not save routine', true); console.error(e); }
  };
}
function maxSort(cat){ return allRoutines.filter(r=>r.category===cat).reduce((m,r)=>Math.max(m,r.sort_order||0),0); }
async function deleteRoutine(r){
  if(!confirm(`Delete "${r.name}" and all its history? This cannot be undone.\n\nTip: turn Active off to retire it instead.`)) return;
  try{ await rest('DELETE','routines?id=eq.'+r.id); toast('Deleted'); allRoutines = await loadAll(); await load(); render(); renderEditorList(); }
  catch(e){ toast('Could not delete', true); console.error(e); }
}
async function moveRoutine(id, dir){
  const r=allRoutines.find(x=>x.id===id); const group=allRoutines.filter(x=>x.category===r.category);
  const i=group.findIndex(x=>x.id===id), j=dir==='up'?i-1:i+1; if(j<0||j>=group.length) return;
  const a=group[i], b=group[j];
  try{
    await rest('PATCH','routines?id=eq.'+a.id,{body:{sort_order:b.sort_order},prefer:'return=minimal'});
    await rest('PATCH','routines?id=eq.'+b.id,{body:{sort_order:a.sort_order},prefer:'return=minimal'});
    allRoutines = await loadAll(); await load(); render(); renderEditorList();
  }catch(e){ toast('Could not reorder', true); console.error(e); }
}

// confetti + toast + xp
const CONF=['#34d399','#fb923c','#a78bfa','#38bdf8','#fbbf24'];
function spawnConfetti(cx,cy,count,spread){
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.style.background=CONF[i%CONF.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=spread*(0.5+Math.random());
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy+80}px) scale(.3)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}
function burst(anchor){ const r=anchor.getBoundingClientRect(); spawnConfetti(r.left+r.width/2, r.top+r.height/2, 12, 70); }
function bigBurst(){ spawnConfetti(window.innerWidth/2, window.innerHeight*0.32, 46, 200); }
function floatXp(anchor, amt){
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div'); el.className='xpfloat'; el.textContent='+'+amt+' XP';
  el.style.left=(r.left+r.width/2)+'px'; el.style.top=r.top+'px'; document.body.appendChild(el);
  el.animate([{transform:'translateX(-50%) translateY(0)',opacity:0},{transform:'translateX(-50%) translateY(-14px)',opacity:1,offset:.3},
    {transform:'translateX(-50%) translateY(-46px)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>el.remove();
}
let toastT;
function toast(msg,err,level){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':'')+(level?' level':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':'')+(level?' level':''), level?3200:2400); }

// boot
function showLogin(){ $('login').classList.add('show'); }
async function start(){
  $('login').classList.remove('show');
  try{ await load(); render(); }
  catch(e){ console.error(e);
    if(String(e).includes('HTTP 401') || String(e).includes('JWT')){ clearSession(); showLogin(); }
    else { $('app').innerHTML=`<div class="loading">Couldn't connect.<br>Check your internet and refresh.</div>`; toast('Connection failed',true); } }
}
$('l-go').onclick = async ()=>{
  const email=$('l-email').value.trim(), pass=$('l-pass').value;
  $('l-err').textContent=''; $('l-go').textContent='Signing in…';
  try{ await signIn(email,pass); await start(); }
  catch(e){ $('l-err').textContent = String(e.message||e); }
  $('l-go').textContent='Sign in';
};
$('l-pass').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('l-go').click(); });
loadSession();
if(session) start(); else showLogin();
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}
