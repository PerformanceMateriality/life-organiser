<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Life Organiser</title>
<meta name="theme-color" content="#0f1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life OS" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0f1220; --bg2:#12141c; --surface:#1a1e2e; --surface2:#222741;
    --line:rgba(255,255,255,.08); --text:#e7e9f0; --muted:#9aa0b4; --muted2:#6b7186;
    --health:#34d399; --fitness:#fb923c; --mind:#a78bfa; --work:#38bdf8;
    --flame:#fbbf24; --danger:#f87171;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1b2036 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 90px}

  /* Header */
  header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .ring{position:relative;width:66px;height:66px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .htitle{flex:1;min-width:0}
  .htitle h1{margin:0;font-size:20px;letter-spacing:.2px}
  .htitle .sub{color:var(--muted);font-size:13px;margin-top:2px}

  /* Date switcher */
  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:18px}
  .datebar button{background:var(--surface2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
  .datebar button:disabled{opacity:.35;cursor:default}
  .datebar .lbl{font-weight:600;font-size:15px}
  .datebar .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px;text-align:center}

  /* Category */
  .cat{margin-bottom:22px}
  .cat h2{display:flex;align-items:center;gap:9px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 4px 10px}
  .cat h2 .dot{width:9px;height:9px;border-radius:50%}
  .cat h2 .cnt{margin-left:auto;font-size:12px;color:var(--muted2);letter-spacing:.5px}

  /* Row */
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;transition:transform .12s ease,border-color .2s}
  .row.done{border-color:var(--acc);background:linear-gradient(0deg,color-mix(in srgb,var(--acc) 9%,var(--surface)),var(--surface))}
  .row .info{flex:1;min-width:0}
  .row .name{font-weight:600;font-size:15.5px;line-height:1.2}
  .row.done .name{color:var(--text)}
  .row .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .flame{color:var(--flame);font-weight:700}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.due{color:#0f1220;background:var(--acc);border-color:transparent;font-weight:700}
  .badge.cad{background:var(--surface2)}

  .val{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:5px 8px}
  .val input{width:56px;background:transparent;border:none;color:var(--text);font-size:15px;text-align:right;outline:none;font-weight:600}
  .val .unit{font-size:12px;color:var(--muted)}

  /* Check control */
  .check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--muted2);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
  .check svg{width:20px;height:20px;stroke:#0f1220;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .18s}
  .row.done .check{background:var(--acc);border-color:var(--acc)}
  .row.done .check svg{opacity:1;transform:scale(1)}
  .check.log{width:auto;height:34px;border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;color:var(--muted);border-color:var(--line)}
  .row.done .check.log{color:#0f1220;background:var(--acc);border-color:var(--acc)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .check.pop{animation:pop .32s ease}

  /* Toast + status */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);
    background:#222741;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:12px;
    font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s;z-index:50;max-width:90%}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger)}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  .foot{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:26px}
  .confetti{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:40}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ring" id="ring"></div>
    <div class="htitle">
      <h1>Life Organiser</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
  </header>

  <div class="datebar">
    <button id="prevDay" aria-label="Previous day">‹</button>
    <div class="lbl" id="dateLbl">—<small></small></div>
    <button id="nextDay" aria-label="Next day">›</button>
  </div>

  <main id="app"><div class="loading">Connecting to your dashboard…</div></main>

  <div class="foot">Life Organiser · Phase 1 · saves to your private cloud</div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://ncxictnhhmnexhmvqvhd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeGljdG5oaG1uZXhobXZxdmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MzI4MzQsImV4cCI6MjEwMTUwODgzNH0.Md3Y3HeeUyAuObOxWjFTAqEj-UsBBAuZrNvbhbyscRc';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIES = [
  { key:'health',  label:'Health & Supplements', color:'var(--health)' },
  { key:'fitness', label:'Fitness & Movement',    color:'var(--fitness)' },
  { key:'mind',    label:'Mind & Wellbeing',        color:'var(--mind)' },
  { key:'work',    label:'Work & Life Admin',       color:'var(--work)' },
];
const CADENCE = {
  daily:           { label:'Daily',           periodic:false },
  every_other_day: { label:'Every other day', periodic:true, interval:2 },
  weekly_3x:       { label:'3× / week',        periodic:true, weekly:3 },
  biweekly:        { label:'Every 2 weeks',    periodic:true, interval:14 },
  monthly:         { label:'Monthly',          periodic:true, interval:30 },
  quarterly:       { label:'Quarterly',        periodic:true, interval:90 },
};

// ---------- date helpers (local time) ----------
const ymd = (d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd = (s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays = (d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const today = new Date(); today.setHours(0,0,0,0);
let selected = new Date(today);

// ---------- state ----------
let routines = [];
let logs = new Map(); // routine_id -> Map(dateStr -> row)

const $ = (id)=>document.getElementById(id);

function getLog(rid,ds){ return logs.get(rid)?.get(ds); }
function isDone(rid,ds){ const l=getLog(rid,ds); return !!(l && l.completed); }

async function load(){
  const { data:r, error:er } = await supabase.from('routines').select('*')
    .eq('active',true).order('category',{ascending:true}).order('sort_order',{ascending:true});
  if(er) throw er;
  routines = r || [];
  const since = ymd(addDays(today,-160));
  const { data:lg, error:el } = await supabase.from('routine_logs').select('*').gte('log_date',since);
  if(el) throw el;
  logs = new Map();
  for(const row of (lg||[])){
    if(!logs.has(row.routine_id)) logs.set(row.routine_id,new Map());
    logs.get(row.routine_id).set(row.log_date,row);
  }
}

async function setLog(routine, ds, on, value){
  if(on){
    const payload={ routine_id:routine.id, log_date:ds, completed:true };
    if(value!==undefined && value!==null && value!=='') payload.value=Number(value);
    const { data, error } = await supabase.from('routine_logs')
      .upsert(payload,{ onConflict:'routine_id,log_date' }).select().single();
    if(error) throw error;
    if(!logs.has(routine.id)) logs.set(routine.id,new Map());
    logs.get(routine.id).set(ds,data);
  } else {
    const { error } = await supabase.from('routine_logs').delete().eq('routine_id',routine.id).eq('log_date',ds);
    if(error) throw error;
    logs.get(routine.id)?.delete(ds);
  }
}

// ---------- metrics ----------
function streak(rid){
  let n=0, d=new Date(today);
  if(!isDone(rid,ymd(d))) d=addDays(d,-1);
  while(isDone(rid,ymd(d))){ n++; d=addDays(d,-1); }
  return n;
}
function lastDone(rid){
  const m=logs.get(rid); if(!m) return null;
  let best=null;
  for(const [ds,l] of m){ if(l.completed && (!best||ds>best)) best=ds; }
  return best;
}
function weekKey(d){ const dt=new Date(d); const off=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-off); return ymd(dt); }
function countWeek(rid,ref){ const wk=weekKey(ref); let c=0; const m=logs.get(rid); if(!m)return 0;
  for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===wk) c++; } return c; }
function periodicStatus(routine){
  const cad=CADENCE[routine.cadence];
  if(cad.weekly){ const c=countWeek(routine.id,selected); return { due:c<cad.weekly, text:`${c}/${cad.weekly} this week` }; }
  const ld=lastDone(routine.id);
  if(!ld) return { due:true, text:'Not done yet' };
  const days=Math.round((today-parseYmd(ld))/86400000);
  if(days>=cad.interval) return { due:true, text:days===0?'Done today':`Last ${days}d ago` };
  return { due:false, text:`Next in ${cad.interval-days}d` };
}

// ---------- rendering ----------
function ringSvg(done,total){
  const pct = total? done/total : 0;
  const R=28, C=2*Math.PI*R, off=C*(1-pct);
  const col = pct>=1? 'var(--health)' : 'var(--mind)';
  $('ring').innerHTML =
    `<svg width="66" height="66" viewBox="0 0 66 66">
       <circle cx="33" cy="33" r="${R}" stroke="rgba(255,255,255,.10)" stroke-width="6" fill="none"/>
       <circle cx="33" cy="33" r="${R}" stroke="${col}" stroke-width="6" fill="none"
         stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
         style="transition:stroke-dashoffset .5s ease"/>
     </svg><div class="pct">${done}/${total}</div>`;
}

function dateLabel(){
  const diff=Math.round((selected-today)/86400000);
  let word = diff===0?'Today':diff===-1?'Yesterday':diff===1?'Tomorrow':'';
  const dstr = selected.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  $('dateLbl').innerHTML = `${word||dstr}<small>${word?dstr:''}</small>`;
  $('nextDay').disabled = ymd(selected)>=ymd(today);
}

function render(){
  const ds = ymd(selected);
  dateLabel();

  const daily = routines.filter(r=>!CADENCE[r.cadence].periodic);
  const dailyDone = daily.filter(r=>isDone(r.id,ds)).length;
  ringSvg(dailyDone, daily.length);
  const duePeriodic = routines.filter(r=>CADENCE[r.cadence].periodic && periodicStatus(r).due).length;
  $('subtitle').textContent = `${dailyDone}/${daily.length} daily done` + (duePeriodic?` · ${duePeriodic} periodic due`:'');

  const app=$('app'); app.innerHTML='';
  for(const cat of CATEGORIES){
    const items = routines.filter(r=>r.category===cat.key);
    if(!items.length) continue;
    const section=document.createElement('section');
    section.className='cat'; section.style.setProperty('--acc',cat.color);
    const dailyInCat = items.filter(r=>!CADENCE[r.cadence].periodic);
    const doneInCat = dailyInCat.filter(r=>isDone(r.id,ds)).length;
    section.innerHTML = `<h2><span class="dot" style="background:${cat.color}"></span>${cat.label}
      ${dailyInCat.length?`<span class="cnt">${doneInCat}/${dailyInCat.length}</span>`:''}</h2>`;
    for(const r of items) section.appendChild(rowEl(r,cat,ds));
    app.appendChild(section);
  }
}

function rowEl(r,cat,ds){
  const cad=CADENCE[r.cadence];
  const done=isDone(r.id,ds);
  const el=document.createElement('div');
  el.className='row'+(done?' done':''); el.style.setProperty('--acc',cat.color);

  // meta line
  let meta='';
  if(cad.periodic){
    const st=periodicStatus(r);
    meta += `<span class="badge cad">${cad.label}</span>`;
    meta += st.due ? `<span class="badge due">Due</span>` : `<span class="badge">${st.text}</span>`;
    if(!st.due && st.text.startsWith('Next')) {} else if(st.due && st.text!=='Due') meta+=`<span>${st.text}</span>`;
  } else {
    const s=streak(r.id);
    if(s>0) meta += `<span class="flame">🔥 ${s}</span>`;
    else meta += `<span style="color:var(--muted2)">Build a streak</span>`;
  }

  // value input
  const log=getLog(r.id,ds);
  const valHtml = r.track_value
    ? `<div class="val"><input type="number" inputmode="decimal" data-val="${r.id}" placeholder="0"
         value="${log&&log.value!=null?log.value:''}"><span class="unit">${r.unit||''}</span></div>` : '';

  const control = cad.periodic
    ? `<button class="check log" data-toggle="${r.id}">${done?'Done ✓':'Log'}</button>`
    : `<button class="check" data-toggle="${r.id}" aria-label="Toggle">
         <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></button>`;

  el.innerHTML = `<div class="info"><div class="name">${r.name}</div><div class="meta">${meta}</div></div>
    ${valHtml}${control}`;
  return el;
}

// ---------- interactions ----------
let busy=false;
async function onToggle(rid, btn){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid);
  const ds=ymd(selected);
  const currentlyDone=isDone(rid,ds);
  const valInput=document.querySelector(`[data-val="${rid}"]`);
  const val=valInput?valInput.value:undefined;
  try{
    await setLog(r, ds, !currentlyDone, val);
    if(!currentlyDone){ btn.classList.add('pop'); if(navigator.vibrate) navigator.vibrate(18); burst(btn); }
    render();
  }catch(e){ toast('Could not save — check connection', true); console.error(e); }
  busy=false;
}
async function onValue(rid, input){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid);
  const ds=ymd(selected);
  const v=input.value.trim();
  try{
    if(v==='' ) { await setLog(r,ds,false); }
    else { await setLog(r,ds,true,v); if(navigator.vibrate)navigator.vibrate(12); }
    render();
  }catch(e){ toast('Could not save value', true); console.error(e); }
  busy=false;
}

document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-toggle]');
  if(t){ onToggle(t.getAttribute('data-toggle'), t); }
});
document.addEventListener('change',(e)=>{
  const v=e.target.closest('[data-val]');
  if(v){ onValue(v.getAttribute('data-val'), v); }
});
$('prevDay').onclick=()=>{ selected=addDays(selected,-1); render(); };
$('nextDay').onclick=()=>{ if(ymd(selected)<ymd(today)){ selected=addDays(selected,1); render(); } };

// confetti burst
const CONF=['#34d399','#fb923c','#a78bfa','#38bdf8','#fbbf24'];
function burst(anchor){
  const rect=anchor.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let i=0;i<12;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.style.background=CONF[i%CONF.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*46;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy+70}px) scale(.3)`,opacity:0}],
      {duration:650+Math.random()*300,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}

let toastT;
function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':''),2600); }

// ---------- boot ----------
(async ()=>{
  try{ await load(); render(); }
  catch(e){ console.error(e);
    $('app').innerHTML=`<div class="loading">Couldn't connect to the database.<br>
      Check your internet and refresh.</div>`; toast('Connection failed',true); }
})();

// Service worker disabled during active development to avoid stale caches.
// Actively unregister any previously-installed worker and clear its caches.
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}
</script>
</body>
</html>
