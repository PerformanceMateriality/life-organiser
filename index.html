// ================= TASKS (build 13) =================
// To-dos and appointments. Deliberately OUTSIDE the game layer:
// nothing here grants XP, moves a streak, or touches a quest.

const TK_TODO_C = 'var(--health)';
const TK_APPT_C = 'var(--work)';

function tkIsAppt(t){ return t.kind==='appt'; }
function tkVisible(t){ return tkIsAppt(t) ? tkShowAppts : tkShowTodos; }
function tkOpen(){ return tasks.filter(t=>!t.done); }
// The chip count must match what turning the filter on actually reveals,
// so past appointments (hidden from the list) don't count.
function tkCountOpen(kind){ return tasks.filter(t=>!t.done && t.kind===kind && !tkStale(t)).length; }

// Appointments "pass" rather than get ticked: once their moment is gone they're history.
function tkPast(t){
  if(!t.due_date) return false;
  const ds=ymd(today);
  if(t.due_date < ds) return true;
  if(t.due_date > ds) return false;
  if(!t.due_time) return false;
  const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return t.due_time.slice(0,5) < hhmm;
}
function tkOverdue(t){
  if(t.done) return false;
  if(tkIsAppt(t)) return false;          // an appointment isn't "overdue", it just passed
  return !!t.due_date && t.due_date < ymd(today);
}
// An appointment on a past day is history, not an open item: it drops out of the
// list entirely and stays visible in calendar mode. To-dos never go stale — an
// undone to-do from last week is exactly what "Overdue" is for.
function tkStale(t){ return tkIsAppt(t) && !!t.due_date && t.due_date < ymd(today); }
function tkFmtTime(s){ return s ? s.slice(0,5) : ''; }
function tkFmtDay(ds){
  const diff=Math.round((parseYmd(ds)-today)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  return parseYmd(ds).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function tkSortKey(t){
  return (t.due_date||'9999-12-31')+' '+(t.due_time?t.due_time.slice(0,5):(tkIsAppt(t)?'00:00':'99:99'));
}
function tkSorted(list){ return list.slice().sort((a,b)=>tkSortKey(a).localeCompare(tkSortKey(b))); }

// ---- buckets for list mode ----
function tkBuckets(){
  const ds=ymd(today);
  const endOfWeek=ymd(addDays(today, 7-((today.getDay()+6)%7) - 1)); // this ISO week's Sunday
  const g={ overdue:[], today:[], tomorrow:[], week:[], later:[], someday:[] };
  for(const t of tasks){
    if(t.done || !tkVisible(t) || tkStale(t)) continue;
    if(!t.due_date){ g.someday.push(t); continue; }
    if(t.due_date < ds){ g.overdue.push(t); continue; }
    if(t.due_date === ds){ g.today.push(t); continue; }
    if(t.due_date === ymd(addDays(today,1))){ g.tomorrow.push(t); continue; }
    if(t.due_date <= endOfWeek){ g.week.push(t); continue; }
    g.later.push(t);
  }
  for(const k in g) g[k]=tkSorted(g[k]);
  return g;
}

// ---- item markup ----
// hideDate: the surrounding group header already names the day, so repeating it is noise
function tkItemHtml(t, hideDate){
  const appt=tkIsAppt(t);
  const over=tkOverdue(t);
  const passed=appt && tkPast(t) && !t.done;
  let lead;
  if(appt){
    lead = `<div class="tktime">${t.due_time
      ? `<div class="th">${tkFmtTime(t.due_time)}</div>${t.end_time?`<div class="tm">${tkFmtTime(t.end_time)}</div>`:''}`
      : `<div class="allday">ALL<br>DAY</div>`}</div>`;
  } else {
    lead = `<button class="tkbox" data-tktoggle="${t.id}" aria-label="${t.done?'Mark not done':'Mark done'}">${t.done?ic('check'):''}</button>`;
  }
  const bits=[];
  if(t.due_date && !hideDate) bits.push(tkFmtDay(t.due_date));
  if(!appt && t.due_time) bits.push(tkFmtTime(t.due_time));
  if(t.location) bits.push(escapeHtml(t.location));
  let tags='';
  if(over) tags+=`<span class="tag late">overdue</span>`;
  if(passed) tags+=`<span class="tag">passed</span>`;
  return `<div class="tkitem ${appt?'appt':'todo'}${t.done?' isdone':''}${over?' isover':''}">
    ${lead}
    <div class="tkmain" data-tkedit="${t.id}">
      <div class="tktitle">${escapeHtml(t.title)}</div>
      ${(bits.length||tags)?`<div class="tkmeta">${bits.map(b=>`<span>${b}</span>`).join('<span style="opacity:.4">·</span>')}${tags}</div>`:''}
      ${t.note?`<div class="tknote">${escapeHtml(t.note)}</div>`:''}
    </div>
  </div>`;
}
function tkGroupHtml(label, list, cls, hideDate){
  if(!list.length) return '';
  return `<div class="tkgroup ${cls||''}"><h3>${label}<span class="gc">${list.length}</span></h3>
    ${list.map(t=>tkItemHtml(t,hideDate)).join('')}</div>`;
}

// ---- list mode ----
function tkListHtml(){
  const g=tkBuckets();
  const any = Object.values(g).some(a=>a.length);
  let html='';
  if(!any){
    const noFilter = !tkShowTodos && !tkShowAppts;
    html += `<div class="tkempty">${noFilter
      ? 'Both filters are off — turn on <b>To-dos</b> or <b>Appointments</b> to see anything.'
      : 'Nothing on the list.<br>Tap <b>Add</b> to put something here.'}</div>`;
  } else {
    html += tkGroupHtml('Overdue', g.overdue, 'overdue');
    html += tkGroupHtml('Today',     g.today,    '', true);
    html += tkGroupHtml('Tomorrow',  g.tomorrow, '', true);
    html += tkGroupHtml('This week', g.week);
    html += tkGroupHtml('Later',     g.later);
    html += tkGroupHtml('Someday',   g.someday,  '', true);
  }
  const done=tkSorted(tasks.filter(t=>t.done && tkVisible(t))).reverse();
  if(done.length){
    html += `<button class="tkdonehead" id="tkDoneToggle">${tkShowDone?'▾':'▸'} Completed · ${done.length}</button>`;
    if(tkShowDone) html += `<div class="tkgroup" style="margin-top:10px">${done.slice(0,50).map(t=>tkItemHtml(t,false)).join('')}</div>`;
  }
  return html;
}

// ---- calendar mode ----
function tkMonthStart(){
  if(!tkCalMonth) tkCalMonth=new Date(today.getFullYear(), today.getMonth(), 1);
  return tkCalMonth;
}
function tkByDay(){
  const m=new Map();
  for(const t of tasks){
    if(!t.due_date || !tkVisible(t)) continue;
    if(!m.has(t.due_date)) m.set(t.due_date,[]);
    m.get(t.due_date).push(t);
  }
  return m;
}
function tkCalHtml(){
  const start=tkMonthStart();
  const byDay=tkByDay();
  const y=start.getFullYear(), mo=start.getMonth();
  const first=new Date(y,mo,1);
  const lead=(first.getDay()+6)%7;                 // Monday-first
  const gridStart=addDays(first,-lead);
  const dsToday=ymd(today);
  const sel=tkCalSel||dsToday;
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), ds=ymd(d);
    const out = d.getMonth()!==mo;
    const items=(byDay.get(ds)||[]).filter(t=>!t.done);
    const hasOver=items.some(tkOverdue);
    let dots='';
    if(items.length){
      const kinds=[...new Set(items.map(t=>t.kind))];
      dots=kinds.slice(0,2).map(k=>`<i style="background:${k==='appt'?TK_APPT_C:TK_TODO_C}"></i>`).join('');
      if(items.length>2) dots+=`<i style="background:var(--muted2)"></i>`;
    }
    cells+=`<button class="tkday${out?' out':''}${ds===dsToday?' today':''}${ds===sel?' sel':''}${hasOver?' hasover':''}"
      data-tkday="${ds}"><span>${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const monthName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayItems=tkSorted((byDay.get(sel)||[]));
  const undated=tkSorted(tasks.filter(t=>!t.done && !t.due_date && tkVisible(t)));
  return `<div class="tkcal">
      <div class="tkcalhead"><button data-tkmo="-1" aria-label="Previous month">${ic('left')}</button>
        <div class="cmn">${monthName}</div>
        <button data-tkmo="1" aria-label="Next month">${ic('right')}</button></div>
      <div class="tkdow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="tkgrid">${cells}</div>
    </div>
    <div class="tkdaytitle">${tkFmtDay(sel)}<span class="dc">${dayItems.length||'nothing'}${dayItems.length?' item'+(dayItems.length>1?'s':''):''}</span></div>
    ${dayItems.length ? dayItems.map(t=>tkItemHtml(t,true)).join('')
      : `<div class="tkempty" style="padding:26px 12px">Nothing on this day.</div>`}
    ${undated.length ? `<div class="tktray">${tkGroupHtml('Someday · no date', undated, '', true)}</div>` : ''}`;
}

// tkPast() is evaluated at render time, so an appointment whose time passes while the
// tab is open keeps looking upcoming. Re-render on the minute, and when the app comes
// back to the foreground — which on a phone is the common case, since the screen was
// off while the time passed.
let tkTick=null;
function tkStartTicking(){
  if(tkTick) clearInterval(tkTick);
  tkTick=setInterval(()=>{
    if(view!=='tasks'){ clearInterval(tkTick); tkTick=null; return; }
    if(document.visibilityState==='visible') renderTasks();
  }, 60000);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && view==='tasks' && tasksReady) renderTasks();
});
function bindTasks(){
  const app=$('app');
  tkStartTicking();
  const fa=$('tkFa'), fb=$('tkFb'), add=$('tkAdd');
  if(fa) fa.onclick=()=>{ tkShowTodos=!tkShowTodos; tkSavePrefs(); renderTasks(); };
  if(fb) fb.onclick=()=>{ tkShowAppts=!tkShowAppts; tkSavePrefs(); renderTasks(); };
  if(add) add.onclick=()=>openTaskForm(null);
  const dt=$('tkDoneToggle'); if(dt) dt.onclick=()=>{ tkShowDone=!tkShowDone; renderTasks(); };
  app.querySelectorAll('[data-tkmode]').forEach(b=>b.onclick=()=>{
    tkMode=b.getAttribute('data-tkmode'); tkSavePrefs(); renderTasks(); });
  app.querySelectorAll('[data-tktoggle]').forEach(b=>b.onclick=()=>toggleTask(b.getAttribute('data-tktoggle'), b));
  app.querySelectorAll('[data-tkedit]').forEach(b=>b.onclick=()=>openTaskForm(tasks.find(t=>t.id===b.getAttribute('data-tkedit'))));
  app.querySelectorAll('[data-tkmo]').forEach(b=>b.onclick=()=>{
    const s=tkMonthStart(); tkCalMonth=new Date(s.getFullYear(), s.getMonth()+Number(b.getAttribute('data-tkmo')), 1);
    renderTasks(); });
  app.querySelectorAll('[data-tkday]').forEach(b=>b.onclick=()=>{ tkCalSel=b.getAttribute('data-tkday'); renderTasks(); });
}

// ---- mutations ----
let tkBusy=false;
async function toggleTask(id, btn){
  if(tkBusy) return;
  const t=tasks.find(x=>x.id===id); if(!t) return;
  const next=!t.done;
  tkBusy=true;
  try{
    const body={ done:next, done_at: next? new Date().toISOString() : null };
    await rest('PATCH','tasks?id=eq.'+id,{body,prefer:'return=minimal'});
    Object.assign(t, body);
    if(next && btn){ haptic(); if(navigator.vibrate) navigator.vibrate(16); }
    renderTasks();
  }catch(e){ toast('Could not update that task', true); console.error(e); }
  tkBusy=false;
}

      <div class="field rowly">
        <div><label>Ends (optional)</label><input type="time" id="tk-end" value="${d.end_time?d.end_time.slice(0,5):''}"></div>

      </div>
    </div>
    <div class="field"><label>Note (optional)</label>
      <textarea id="tk-note" rows="3" placeholder="Anything worth remembering…">${escapeHtml(d.note||'')}</textarea></div>
    <div id="tk-hint" style="color:var(--muted2);font-size:11.5px;margin:-4px 2px 4px"></div>

  const paint=()=>{
    $('tk-kt').classList.toggle('on', k==='todo');

      await loadTasks(); close(); toast('Saved');

// ---- compact agenda strip on the Today view ----
function tkTodayStripHtml(){
  if(!tasksReady) return '';
  const ds=ymd(today);
  const items=tkSorted(tasks.filter(t=>!t.done && t.due_date && t.due_date<=ds && !tkStale(t)));
  if(!items.length) return '';
  const shown=items.slice(0,3);
  const lines=shown.map(t=>{
    const appt=tkIsAppt(t);
    const lead=appt ? (t.due_time?tkFmtTime(t.due_time):'all-day') : 'to-do';
    return `<div class="tkline"><span class="lt${appt?'':' todo'}">${lead}</span>
      <span class="ln">${escapeHtml(t.title)}</span>
      ${tkOverdue(t)?'<span class="lx">overdue</span>':''}</div>`;
  }).join('');
  const extra=items.length-shown.length;
  return `<div class="tkstrip" id="tkStrip">
    <div class="tkstriph">On today<span class="go">Open</span></div>
    ${lines}${extra?`<div class="tkmore">+${extra} more</div>`:''}</div>`;
}

function renderReminders(){
  if(!remReady){
    $('editorBody').innerHTML = `<div class="gwarn"><b>Reminders need a one-time setup.</b><br>

  const s=remSettings, on=!!s.enabled;
  let html='';

  // --- permission / platform state ---
  const perm=notifPerm();
  if(!notifSupported()){
    html += `<div class="remperm">This browser can't do web push. Reminders will still save here, but
      nothing will arrive until you open the app on a device that supports notifications.</div>`;
  } else if(isIOS() && !isStandalone()){
    html += `<div class="remperm"><b>Add to Home Screen first.</b> On iPhone, notifications only work

  } else if(perm!=='granted'){
    html += `<div class="remperm"><b>One tap to allow notifications.</b> Nothing is sent until you do.</div>

        <div class="rd">${on?'Sent from the server, so they arrive with the app closed.':'Nothing will be sent.'}</div></div>
      <div class="sw" data-remmaster="1"></div></div>`;

  // --- slots ---

    html += `<div class="glabel" style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 2px 8px">When</div>`;
    for(const slot of REM_SLOTS){

        <div class="ric">${ic({morning:'sun',cadence:'pin',evening:'moon',sweep:'glass'}[slot.key]||'bell')}</div>

    }
    const sk=!!s.skip_on_rest;
    html += `<div class="remrow ${sk?'on':'off'}" style="margin-top:14px">
        <div class="ric">${ic('snow')}</div>
        <div class="rmid"><div class="rn">Quiet on rest days</div>

        <div class="sw" data-remrest="1"></div></div>`;
    html += `<div class="remnote">A slot only fires if it has something to say — no "well done, nothing to do"

    html += `<div class="rempv" id="rem-preview"><div class="pvh">Right now it would say…</div>
      <div class="pvitem"><div class="pvtext">Checking…</div></div></div>`;
  }

  html += `<button class="rembtn" id="rem-test-local">Show a test notification on this device</button>`;

  const allow=$('rem-allow');
  if(allow) allow.onclick = async ()=>{
    allow.disabled=true; allow.textContent='Asking…';
    try{ await enablePush(); toast('Notifications on'); renderReminders(); loadPreview(); }
    catch(e){ toast(String(e.message||e), true); renderReminders(); }
  };
  const master=body.querySelector('[data-remmaster]');
  if(master) master.onclick = ()=>patchRem({ enabled: !remSettings.enabled });
  body.querySelectorAll('[data-remslot]').forEach(el=>{
    const k=el.getAttribute('data-remslot');
    el.onclick = ()=>patchRem({ [k+'_on']: !remSettings[k+'_on'] });
  });
  body.querySelectorAll('[data-remtime]').forEach(el=>{
    const k=el.getAttribute('data-remtime');
    el.onchange = ()=>{ if(el.value) patchRem({ [k+'_time']: el.value }); };
  });
  const restSw=body.querySelector('[data-remrest]');
  if(restSw) restSw.onclick = ()=>patchRem({ skip_on_rest: !remSettings.skip_on_rest });
  $('rem-test-local').onclick = testLocal;
  $('rem-test-push').onclick = testPush;
  const un=$('rem-unsub');
  if(un) un.onclick = async ()=>{ await disablePush(); toast('This device unsubscribed'); renderReminders(); };
  $('rem-back').onclick = renderEditorList;
}
async function patchRem(patch){
  if(remBusy) return; remBusy=true;
  const prev={...remSettings};
  Object.assign(remSettings, patch);
  renderReminders();
  try{
    await rest('PATCH','reminder_settings?id=eq.default',
      { body:{...patch, updated_at:new Date().toISOString()}, prefer:'return=minimal' });
    loadPreview();
  }catch(e){
    remSettings=prev; renderReminders();
    toast('Could not save that setting', true); console.error(e);
  }
  remBusy=false;
}
async function loadPreview(){
  const box=$('rem-preview'); if(!box) return;
  try{
    const r=await remCall({ mode:'preview' });
    const slots=(r&&r.slots)||[];
    let h=`<div class="pvh">Right now it would say…</div>`;
    if(!slots.length) h+=`<div class="pvitem"><div class="pvtext pvquiet">No slots are switched on.</div></div>`;
    for(const s of slots){
      const def=REM_SLOTS.find(x=>x.key===s.key);
      const body = s.text
        ? `<div class="pvtext">${escapeHtml(s.text)}</div>`
        : `<div class="pvtext pvquiet">${escapeHtml(s.reason||'Nothing to say — it would stay silent.')}</div>`;
      h+=`<div class="pvitem"><div class="pvslot">${def?def.name:s.key} · ${(s.time||'').slice(0,5)}</div>${body}</div>`;
    }
    box.innerHTML=h;
  }catch(e){
    box.innerHTML=`<div class="pvh">Right now it would say…</div>
      <div class="pvitem"><div class="pvtext pvquiet">Can't reach the reminder service yet — deploy the
      <code>reminders</code> Edge Function and this fills in.</div></div>`;
  }
}
async function testLocal(){
  try{
    if(notifPerm()!=='granted'){ toast('Allow notifications first', true); return; }
    const reg=await swReg();
    if(reg&&reg.showNotification){
      await reg.showNotification('Life Organiser', { body:'Test notification — this is what a nudge looks like.',
        icon:'icon-192.png', badge:'icon-192.png', tag:'lo-test' });
    } else if(typeof Notification!=='undefined'){
      new Notification('Life Organiser', { body:'Test notification — this is what a nudge looks like.' });
    } else { toast('Not supported here', true); return; }
    toast('Sent — check your notifications');
  }catch(e){ toast('Could not show it: '+(e.message||e), true); }
}
async function testPush(){
  const b=$('rem-test-push'); if(b){ b.disabled=true; b.textContent='Sending…'; }
  try{
    const r=await remCall({ mode:'test' });
    const n=(r&&r.sent)||0;
    toast(n?`Pushed to ${n} device${n>1?'s':''}`:'No subscribed devices yet');
  }catch(e){ toast('Push failed — is the Edge Function deployed?', true); console.error(e); }
  if(b){ b.disabled=false; b.textContent='Send a real test push (end-to-end)'; }
}

function openForm(routine){
  const isNew = !routine;
  $('editorTitle').firstChild.textContent = isNew ? 'Add routine ' : 'Edit routine ';
  const r = routine || { name:'', category:'health', cadence:'daily', track_value:false, unit:'', target_value:null, active:true };
  const catOpts = CATEGORIES.map(c=>`<option value="${c.key}" ${r.category===c.key?'selected':''}>${c.label}</option>`).join('');
  const cadOpts = Object.entries(CADENCE).map(([k,v])=>`<option value="${k}" ${r.cadence===k?'selected':''}>${v.label}</option>`).join('');
  $('editorBody').innerHTML = `
    <div class="field"><label>Name</label><input type="text" id="f-name" value="${escapeHtml(r.name)}" placeholder="e.g. Vitamin D"></div>
    <div class="field rowly"><div><label>Category</label><select id="f-cat">${catOpts}</select></div>
      <div><label>Cadence</label><select id="f-cad">${cadOpts}</select></div></div>
    <div class="field"><div class="toggle ${r.track_value?'on':''}" id="f-track"><div class="sw"></div>
      <div><div style="font-weight:600;font-size:14px">Track a number</div>
      <div style="font-size:12px;color:var(--muted)">e.g. grams, kg, minutes — not just a checkmark</div></div></div></div>
    <div class="field rowly ${r.track_value?'':'hidden'}" id="f-numwrap">
      <div><label>Unit</label><input type="text" id="f-unit" value="${escapeHtml(r.unit||'')}" placeholder="g, kg, min"></div>
      <div><label>Daily target (optional)</label><input type="number" id="f-target" value="${r.target_value!=null?r.target_value:''}" placeholder="e.g. 150"></div></div>
    <div class="field"><label>Linked feature (optional)</label>
      <select id="f-role">
        <option value=""${!r.role?' selected':''}>Nothing — a plain routine</option>
        <option value="gym"${r.role==='gym'?' selected':''}>Gym tracker — ticks when a set is logged</option>
        <option value="weigh"${r.role==='weigh'?' selected':''}>Weigh-in — feeds the body-weight trend</option>
      </select>
      <div style="font-size:12px;color:var(--muted2);margin:6px 2px 0">Set this and the link survives a rename.</div></div>
    <div class="field"><div class="toggle ${r.active?'on':''}" id="f-active"><div class="sw"></div>
      <div style="font-weight:600;font-size:14px">Active</div></div></div>
    <div class="formbtns">${isNew?'':'<button class="btn-del" id="f-del">Delete</button>'}
      <button class="btn-cancel" id="f-cancel">Cancel</button><button class="btn-save" id="f-save">Save</button></div>`;
  let track = r.track_value, active = r.active;
  $('f-track').onclick = ()=>{ track=!track; $('f-track').classList.toggle('on',track); $('f-numwrap').classList.toggle('hidden',!track); };
  $('f-active').onclick = ()=>{ active=!active; $('f-active').classList.toggle('on',active); };
  $('f-cancel').onclick = renderEditorList;
  if(!isNew) $('f-del').onclick = ()=>deleteRoutine(r);
  $('f-save').onclick = async ()=>{
    const name=$('f-name').value.trim(); if(!name){ toast('Give it a name', true); return; }
    const role=$('f-role').value||null;
    const body={ name, category:$('f-cat').value, cadence:$('f-cad').value, track_value:track,
      unit: track?($('f-unit').value.trim()||null):null,
      target_value: track && $('f-target').value!=='' ? Number($('f-target').value) : null, active, role };
    try{
      // A role is unique in the database, so hand it over rather than failing the save:
      // the person picking it here is stating where the link belongs.
      if(role){
        const holder=allRoutines.find(x=>x.role===role && x.id!==r.id);
        if(holder) await rest('PATCH','routines?id=eq.'+holder.id,{body:{role:null},prefer:'return=minimal'});
      }
      if(isNew){ body.sort_order = maxSort(body.category)+1; await rest('POST','routines',{body,prefer:'return=minimal'}); }
      else { await rest('PATCH','routines?id=eq.'+r.id,{body,prefer:'return=minimal'}); }
      toast('Saved'); allRoutines = await loadAll(); await load(); render(); renderEditorList();
    }catch(e){ toast('Could not save routine', true); console.error(e); }
  };
}
function maxSort(cat){ return allRoutines.filter(r=>r.category===cat).reduce((m,r)=>Math.max(m,r.sort_order||0),0); }
async function deleteRoutine(r){
  if(!confirm(`Delete "${r.name}" and all its history? This cannot be undone.\n\nTip: turn Active off to retire it instead.`)) return;
  try{ await rest('DELETE','routines?id=eq.'+r.id); toast('Deleted'); allRoutines = await loadAll(); await load(); render(); renderEditorList(); }
  catch(e){ toast('Could not delete', true); console.error(e); }
}
async function moveRoutine(id, dir){
  const r=allRoutines.find(x=>x.id===id); const group=allRoutines.filter(x=>x.category===r.category);
  const i=group.findIndex(x=>x.id===id), j=dir==='up'?i-1:i+1; if(j<0||j>=group.length) return;
  const a=group[i], b=group[j];
  try{
    await rest('PATCH','routines?id=eq.'+a.id,{body:{sort_order:b.sort_order},prefer:'return=minimal'});
    await rest('PATCH','routines?id=eq.'+b.id,{body:{sort_order:a.sort_order},prefer:'return=minimal'});
    allRoutines = await loadAll(); await load(); render(); renderEditorList();
  }catch(e){ toast('Could not reorder', true); console.error(e); }
}

// confetti + toast + xp
const CONF=['#34d399','#fb923c','#a78bfa','#38bdf8','#fbbf24'];
function spawnConfetti(cx,cy,count,spread){
  if(RM) return;
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.style.background=CONF[i%CONF.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=spread*(0.5+Math.random());
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy+80}px) scale(.3)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}
function burst(anchor){ const r=anchor.getBoundingClientRect(); spawnConfetti(r.left+r.width/2, r.top+r.height/2, 12, 70); }
function bigBurst(){ spawnConfetti(window.innerWidth/2, window.innerHeight*0.32, 46, 200); }
function floatXp(anchor, amt, pt){
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div'); el.className='xpfloat'; el.textContent='+'+amt+' xp';
  el.style.left=(pt? r.left+pt.x : r.left+r.width/2)+'px'; el.style.top=(pt? r.top+pt.y-14 : r.top+8)+'px'; document.body.appendChild(el);
  const a = RM
    ? el.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.8},{opacity:0}],{duration:1000})
    : el.animate([{transform:'translateX(-50%) translateY(0) scale(.9)',opacity:0},{transform:'translateX(-50%) translateY(-14px) scale(1)',opacity:1,offset:.2},
        {transform:'translateX(-50%) translateY(-56px)',opacity:0}],{duration:1000,easing:'cubic-bezier(.16,1,.3,1)'});
  a.onfinish=()=>el.remove();
}
let toastT;
function toast(msg,err,level,undo){
  const t=$('toast'); t.innerHTML=''; const m=document.createElement('span'); m.className='tmsg'; m.textContent=msg; t.appendChild(m);
  if(undo){ const b=document.createElement('button'); b.className='undo'; b.textContent='undo';
    b.onclick=()=>{ clearTimeout(toastT); t.className='toast'; undo(); }; t.appendChild(b); }
  t.className='toast show'+(err?' err':'')+(level?' level':'');
  t.setAttribute('role', err?'alert':'status');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':'')+(level?' level':''), undo?4000:level?3200:2400); }

// boot
function showLogin(){ $('login').classList.add('show'); }
async function start(){
  $('login').classList.remove('show');
  try{ await load(); render(); }
  catch(e){ console.error(e);
    if(String(e).includes('HTTP 401') || String(e).includes('JWT')){ clearSession(); showLogin(); }
    else { $('app').innerHTML=`<div class="loading">Couldn't connect.<br>Check your internet and refresh.</div>`; toast('Connection failed',true); } }
}
$('l-go').onclick = async ()=>{
  const email=$('l-email').value.trim(), pass=$('l-pass').value;
  $('l-err').textContent=''; $('l-go').textContent='Signing in…';
  try{ await signIn(email,pass); await start(); }
  catch(e){ $('l-err').textContent = String(e.message||e); }
  $('l-go').textContent='Sign in';
};
$('l-pass').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('l-go').click(); });
loadSession();
if(session) start(); else showLogin();
// Push needs a registered worker, so the self-destroying-worker era ends here. sw.js
// has no fetch handler, so this does not reintroduce the stale-build caching that made
// the old worker necessary; it sweeps the leftover caches once on activate instead.
// updateViaCache:'none' stops the browser's HTTP cache serving an old sw.js.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js?v=16', { updateViaCache:'none' })
    .catch(e=>console.warn('service worker registration failed', e));
}
