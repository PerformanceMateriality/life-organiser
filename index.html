<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Life Organiser</title>
<meta name="theme-color" content="#0f1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life OS" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<style>
  :root{
    --bg:#0f1220; --bg2:#12141c; --surface:#1a1e2e; --surface2:#222741;
    --line:rgba(255,255,255,.08); --text:#e7e9f0; --muted:#9aa0b4; --muted2:#6b7186;
    --health:#34d399; --fitness:#fb923c; --mind:#a78bfa; --work:#38bdf8;
    --flame:#fbbf24; --danger:#f87171; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1b2036 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:600px;margin:0 auto;padding:18px 16px 110px}

  header{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .ring{position:relative;width:60px;height:60px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .htitle{flex:1;min-width:0}
  .htitle h1{margin:0;font-size:19px;letter-spacing:.2px}
  .htitle .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .mng{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
  .mng:active{transform:scale(.96)}

  .levelbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;cursor:pointer}
  .levelbar .lbtop{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
  .levelbar .lv{font-weight:800}
  .levelbar .rank{color:var(--mind);font-weight:600}
  .levelbar .xpn{margin-left:auto;color:var(--muted);font-size:12px}
  .xpbar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
  .xpbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--mind),var(--health));border-radius:8px;transition:width .5s ease}
  .xpbar.big{height:12px}
  .xpfloat{position:fixed;transform:translateX(-50%);color:var(--flame);font-weight:800;font-size:15px;pointer-events:none;z-index:75;text-shadow:0 2px 8px rgba(0,0,0,.5)}

  .datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:18px}
  .datebar button{background:var(--surface2);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
  .datebar button:disabled{opacity:.35;cursor:default}
  .datebar .lbl{font-weight:600;font-size:15px;text-align:center}
  .datebar .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .restrow{margin:-8px 0 18px}
  .restbtn{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .restbtn.on{color:#7dd3fc;border-color:color-mix(in srgb,#38bdf8 40%,var(--line));background:color-mix(in srgb,#38bdf8 8%,var(--surface))}

  .cat{margin-bottom:22px}
  .cat h2{display:flex;align-items:center;gap:9px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 4px 10px}
  .cat h2 .dot{width:9px;height:9px;border-radius:50%}
  .cat h2 .cnt{margin-left:auto;font-size:12px;color:var(--muted2);letter-spacing:.5px}

  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;transition:transform .12s ease,border-color .2s}
  .row.done{border-color:var(--acc);background:linear-gradient(0deg,color-mix(in srgb,var(--acc) 9%,var(--surface)),var(--surface))}
  .row .info{flex:1;min-width:0;cursor:pointer}
  .row .name{font-weight:600;font-size:15.5px;line-height:1.2;display:flex;align-items:center;gap:6px}
  .row .name .noteflag{font-size:12px;opacity:.8}
  .row .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .flame{color:var(--flame);font-weight:700}
  .tgt{color:var(--muted)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.due{color:#0f1220;background:var(--acc);border-color:transparent;font-weight:700}
  .badge.cad{background:var(--surface2)}
  .pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.09);margin-top:8px;overflow:hidden}
  .pbar > i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .35s ease}

  .val{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:5px 8px}
  .val input{width:52px;background:transparent;border:none;color:var(--text);font-size:15px;text-align:right;outline:none;font-weight:600}
  .val .unit{font-size:12px;color:var(--muted)}

  .check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--muted2);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
  .check svg{width:20px;height:20px;stroke:#0f1220;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .18s}
  .row.done .check{background:var(--acc);border-color:var(--acc)}
  .row.done .check svg{opacity:1;transform:scale(1)}
  .check.log{width:auto;height:34px;border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;color:var(--muted);border-color:var(--line)}
  .row.done .check.log{color:#0f1220;background:var(--acc);border-color:var(--acc)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
  .check.pop{animation:pop .32s ease}

  /* History */
  .tiles{display:flex;gap:10px;margin-bottom:16px}
  .tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center}
  .tile .big{font-size:24px;font-weight:800;line-height:1}
  .tile .lbl{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
  .legend{display:flex;gap:14px;justify-content:center;margin:0 0 18px;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
  .hcard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .hcard .top .n{font-weight:600;font-size:14.5px}
  .hcard .top .s{margin-left:auto;font-size:12px;color:var(--muted)}
  .hstrip{display:flex;gap:3px}
  .hstrip .sq{flex:1;min-width:0;height:14px;border-radius:3px;background:rgba(255,255,255,.05)}

  /* Rewards */
  .lvlcard{background:linear-gradient(160deg,#242a44,#191d2c);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;margin-bottom:6px}
  .lvlbig{font-size:44px;font-weight:800;line-height:1}
  .lvlrank{color:var(--mind);font-weight:700;letter-spacing:.5px;margin:4px 0 16px}
  .lvlmeta{color:var(--muted);font-size:12.5px;margin-top:10px}
  .rewh{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 12px}
  .catlv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
  .catlv-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:14px}
  .catlv-top .dot{width:9px;height:9px;border-radius:50%}
  .catlv-top .tn{font-weight:600}
  .catlv-top .cl{margin-left:auto;color:var(--muted);font-weight:700}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .badge2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;opacity:.45;filter:grayscale(.7)}
  .badge2.got{opacity:1;filter:none;border-color:color-mix(in srgb,var(--flame) 40%,var(--line))}
  .badge2 .bi{font-size:26px}
  .badge2 .bn{font-weight:700;font-size:12.5px;margin-top:5px}
  .badge2 .bd{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .rewnote{color:var(--muted2);font-size:11.5px;text-align:center;margin-top:18px}

  /* Daily quests */
  .quests{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:18px}
  .qhead{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 11px}
  .qhead .qsum{margin-left:auto;letter-spacing:.3px;text-transform:none;font-size:12px;color:var(--muted2)}
  .qhead .qsum b{color:var(--flame)}
  .quest{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line)}
  .quest:first-of-type{border-top:none;padding-top:2px}
  .quest .qic{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
  .quest.done .qic{background:color-mix(in srgb,var(--flame) 22%,var(--surface2));box-shadow:0 0 0 1px color-mix(in srgb,var(--flame) 45%,transparent)}
  .quest .qmid{flex:1;min-width:0}
  .quest .qn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
  .quest .qn .qtick{color:var(--flame)}
  .quest .qd{font-size:11.5px;color:var(--muted);margin-top:1px}
  .quest .qbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
  .quest .qbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mind),var(--flame));transition:width .4s ease}
  .quest.done .qbar > i{background:var(--flame)}
  .quest .qxp{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--muted2);min-width:42px;text-align:right}
  .quest.done .qxp{color:var(--flame)}
  .qfoot{color:var(--muted2);font-size:11px;text-align:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
  .setnote{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--flame) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--flame) 30%,var(--line));border-radius:12px;padding:10px 13px;margin-bottom:9px;font-size:12.5px;color:var(--text)}
  .setnote b{color:var(--flame)}

  /* Badge progress on tiles */
  .badge2{cursor:pointer;position:relative}
  .badge2:active{transform:scale(.97)}
  .badge2 .bprog{height:4px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px}
  .badge2 .bprog > i{display:block;height:100%;border-radius:4px;background:var(--muted);transition:width .4s ease}
  .badge2.got .bprog{display:none}
  .badge2 .bcount{font-size:10px;color:var(--muted2);margin-top:4px}
  .badge2 .bgot{position:absolute;top:7px;right:8px;font-size:12px;color:var(--flame)}
  /* Badge detail sheet */
  .bdhero{text-align:center;padding:8px 0 4px}
  .bdhero .bdi{font-size:60px;line-height:1}
  .bdhero .bdn{font-weight:800;font-size:20px;margin-top:8px}
  .bdhero .bds{color:var(--muted);font-size:13.5px;margin-top:4px}
  .bdstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
  .bdstat .bl{display:flex;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .bdstat .bl b{margin-left:auto;color:var(--text);font-size:14px}
  .bdstat .xpbar{height:10px}
  .bdunlocked{text-align:center;color:var(--flame);font-weight:700;font-size:14px;margin-top:18px}

  /* Level-up moment */
  .lvlup{background:radial-gradient(900px 500px at 50% 30%, rgba(251,191,36,.18), rgba(8,10,18,.92) 60%)!important}
  .lucard{max-width:400px;margin:16vh auto 0;text-align:center;padding:20px}
  .lucard .luspark{font-size:52px;animation:luspin 2.4s linear infinite;display:inline-block}
  @keyframes luspin{to{transform:rotate(360deg)}}
  .lucard .lulabel{margin-top:6px;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--flame);font-weight:800}
  .lucard .lubig{font-size:74px;font-weight:800;line-height:1;margin:6px 0 2px;
    background:linear-gradient(180deg,#fff,var(--flame));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lucard .lurank{font-size:17px;font-weight:700;color:var(--mind)}
  .lucard .lurankup{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--flame);background:color-mix(in srgb,var(--flame) 14%,transparent);border:1px solid color-mix(in srgb,var(--flame) 45%,transparent)}
  .lucard .lunext{color:var(--muted);font-size:13px;margin-top:16px}
  .lucard .lugo{margin-top:22px;width:100%;background:var(--flame);color:#2a1e02;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
  .lucard .lugo:active{transform:scale(.97)}
  @keyframes lupop{0%{transform:scale(.6);opacity:0}55%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .lvlup.show .lucard{animation:lupop .5s cubic-bezier(.2,.8,.3,1.2)}

  /* Gym */
  .gymhero{display:flex;gap:10px;margin-bottom:12px}
  .gbtn{flex:1;background:linear-gradient(160deg,#242a44,#191d2c);border:1px solid var(--line);border-radius:16px;padding:15px 12px;text-align:center;cursor:pointer;color:var(--text)}
  .gbtn:active{transform:scale(.98)}
  .gbtn .gt{font-weight:800;font-size:15px}
  .gbtn .gs{font-size:11px;color:var(--muted);margin-top:3px}
  .gbtn.empty{background:var(--surface);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px;width:56px}
  .gsub{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px}
  .gsub button{flex:1;background:transparent;border:none;color:var(--muted);border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer}
  .gsub button.on{background:var(--surface2);color:var(--text)}

  .gsesshead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .gsesshead .gn{font-weight:800;font-size:18px}
  .gsesshead .gd{color:var(--muted);font-size:12.5px;margin-top:2px}
  .gex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:10px}
  .gex .gexh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .gex .gexn{font-weight:700;font-size:14.5px}
  .gex .gexpr{margin-left:auto;font-size:11px;color:var(--flame);font-weight:700}
  .gex .gexrm{background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer;padding:0 2px}
  .gex .gexlast{font-size:11px;color:var(--muted2);margin-bottom:9px}
  .gset{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .gset .gsi{width:20px;color:var(--muted2);font-size:12px;font-weight:800;text-align:center;flex:0 0 auto}
  .gcell{flex:1;display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  .gcell input{width:100%;background:transparent;border:none;color:var(--text);font-size:16px;font-weight:600;outline:none;text-align:center}
  .gcell .gu{font-size:11px;color:var(--muted);flex:0 0 auto}
  .gset .grm{background:none;border:none;color:var(--muted2);font-size:18px;cursor:pointer;width:28px;flex:0 0 auto}
  .gaddset{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:3px}
  .gaddex{width:100%;background:var(--surface2);border:1px dashed var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;margin:2px 0 12px}

  .rtimer{position:sticky;bottom:80px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .rtimer.run{border-color:color-mix(in srgb,var(--mind) 50%,var(--line));background:color-mix(in srgb,var(--mind) 10%,var(--surface2))}
  .rtimer .rt{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;min-width:50px}
  .rtimer .rlbl{color:var(--muted);font-size:12px;margin-right:auto}
  .rtimer button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:800;cursor:pointer}
  .gsave{display:flex;gap:10px;margin:14px 0 4px}
  .gsave button{flex:1;border:none;border-radius:12px;padding:14px;font-size:14.5px;font-weight:800;cursor:pointer}

  .ghist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
  .ghist .ghd{display:flex;align-items:center;gap:8px}
  .ghist .ghn{font-weight:700;font-size:14px}
  .ghist .ghdate{margin-left:auto;color:var(--muted);font-size:12px}
  .ghist .ghx{background:none;border:none;color:var(--muted2);font-size:15px;cursor:pointer;padding:0 2px}
  .ghist .ghsets{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .gprog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
  .gprog .gph{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .gprog .gpn{font-weight:700;font-size:14px}
  .gprog .gppr{margin-left:auto;font-size:12.5px;color:var(--flame);font-weight:800}
  .gchart{width:100%;height:56px;display:block;overflow:visible}
  .gempty{color:var(--muted2);font-size:13px;text-align:center;padding:26px 10px}
  .gnote{color:var(--muted2);font-size:11.5px;line-height:1.45;margin:-8px 0 14px;padding:0 2px}
  .gwarn{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:14px;padding:14px;font-size:13px;color:var(--text);line-height:1.5}
  .gpick{display:flex;flex-direction:column;gap:7px}
  .gpick button.pk{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
  .gpick button.pk .pm{margin-left:auto;font-size:11px;color:var(--muted2);font-weight:600}
  .gpick .pglabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 2px 4px}

  /* Gym v2 (build 11) */
  .gresume{background:linear-gradient(160deg,#2a3350,#1b2136);border:1px solid color-mix(in srgb,var(--mind) 45%,var(--line));border-radius:16px;padding:13px 14px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:12px}
  .gresume:active{transform:scale(.99)}
  .gresume .gri{font-size:22px;flex:0 0 auto}
  .gresume .grt{font-weight:800;font-size:14.5px}
  .gresume .grs{font-size:11.5px;color:var(--muted);margin-top:2px}
  .gresume .grgo{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--mind);flex:0 0 auto}

<script type="module">
const SUPABASE_URL = 'https://ncxictnhhmnexhmvqvhd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iIeb5avDs70-9OJX0yJLzw_bfWR_ReZ';
const REST = SUPABASE_URL + '/rest/v1/';
const AUTH = SUPABASE_URL + '/auth/v1/';
let session = null;
function loadSession(){ try{ const s=localStorage.getItem('lo_session'); if(s) session=JSON.parse(s); }catch(e){} }
function saveSession(s){ session=s; try{ localStorage.setItem('lo_session', JSON.stringify(s)); }catch(e){} }
function clearSession(){ session=null; try{ localStorage.removeItem('lo_session'); }catch(e){} }
async function signIn(email,password){
  const res=await fetch(AUTH+'token?grant_type=password',{method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Sign-in failed');
  saveSession({access_token:data.access_token, refresh_token:data.refresh_token});
  return true;
}
async function refreshSession(){

function urlB64ToU8(s){
  const pad='='.repeat((4 - s.length % 4) % 4);
  const b64=(s+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);

  return remSub;

async function saveSub(sub){
  if(!sub) return;
  const j=sub.toJSON();
  const body={ endpoint:sub.endpoint, p256dh:j.keys&&j.keys.p256dh, auth:j.keys&&j.keys.auth,
    user_agent:navigator.userAgent.slice(0,300), last_seen:new Date().toISOString() };
  // Without both keys the server cannot encrypt to this device. Swallowing either
  // failure would leave the screen reading "on" with no endpoint to send to — exactly
  // the silent non-delivery this build exists to avoid.
  if(!body.p256dh || !body.auth) throw new Error('This device returned an incomplete push subscription.');
  await rest('POST','push_subscriptions?on_conflict=endpoint',
    { body, prefer:'resolution=merge-duplicates' });

async function enablePush(){

  if(isIOS() && !isStandalone()) throw new Error('On iPhone, add the app to your Home Screen first.');
  const perm = await Notification.requestPermission();
  if(perm!=='granted') throw new Error(perm==='denied'
    ? 'Notifications are blocked — turn them back on in your device settings.'
    : 'Permission was not granted.');
  const reg=await swReg(); if(!reg) throw new Error('The service worker is not running yet — reload and try again.');
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64ToU8(VAPID_PUBLIC) });
  await saveSub(sub);   // only claim this device is subscribed once the row is stored
  remSub=sub;
  return sub;
}

function roman(n){ const R=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII']; return R[n]||('×'+n); }
function tierBadges(tier){
  const s=badgeStats();
  const defs = tier<=1 ? TIER1 : TIER2;
  const scale = tier<=1 ? 1 : (tier-1);
  return defs.map(t=>{
    const goal = t.goal*scale;
    const cur = s[t.stat];
    return { icon:t.icon, name: tier>2 ? t.name+' '+roman(tier-1) : t.name,
             desc: t.d.replace('{g}', goal), cur, goal, unit:t.unit, got: cur>=goal };
  });
}
function tierComplete(tier){ return tierBadges(tier).every(b=>b.got); }
function completedTierCount(){ let n=0; while(n<40 && tierComplete(n+1)) n++; return n; }
function setBonus(tier){ return 250*tier; }
function setBonusXp(){ let x=0; const n=completedTierCount(); for(let t=1;t<=n;t++) x+=setBonus(t); return x; }
function activeTier(){ return completedTierCount()+1; }
function activeBadges(){ return tierBadges(activeTier()); }

function countCompletedOn(ds){ let c=0; for(const r of routines){ if(isDone(r.id,ds)) c++; } return c; }
function countCatCompletedOn(cat,ds){ let c=0; for(const r of routines){ if(r.category===cat && isDone(r.id,ds)) c++; } return c; }
function countTargetsHitOn(ds){ let c=0; for(const r of routines){ if(!(r.track_value && r.target_value!=null)) continue; const l=getLog(r.id,ds); if(l && l.completed && l.value!=null && Number(l.value)>=Number(r.target_value)) c++; } return c; }
function countAreasOn(ds){ const s=new Set(); for(const r of routines){ if(isDone(r.id,ds)) s.add(r.category); } return s.size; }
function dailyRoutines(){ return routines.filter(r=>!CADENCE[r.cadence].periodic); }
const QUEST_POOL = [
  { id:'momentum3', icon:'⚡', name:'Momentum',         desc:'Complete any 3 habits',       xp:10, applies:()=>routines.length>=3,                                  progress:(ds)=>({have:countCompletedOn(ds), need:3}) },

  { id:'health2',   icon:'💊', name:'Fuel up',           desc:'Complete 2 Health habits',    xp:15, applies:()=>routines.filter(r=>r.category==='health').length>=2, progress:(ds)=>({have:countCatCompletedOn('health',ds), need:2}) },

  { id:'fit1',      icon:'🏃', name:'Get moving',        desc:'Complete a Fitness habit',    xp:10, applies:()=>routines.some(r=>r.category==='fitness'),            progress:(ds)=>({have:countCatCompletedOn('fitness',ds), need:1}) },

  { id:'flawless',  icon:'✨', name:'Flawless day',      desc:'Complete all daily habits',   xp:25, applies:()=>dailyRoutines().length>0,                            progress:(ds)=>{ const d=dailyRoutines(); return {have:d.filter(r=>isDone(r.id,ds)).length, need:d.length}; } },
];
function weekIndex(ds){ const monday=parseYmd(weekKey(parseYmd(ds))); const epoch=new Date(2024,0,1); return Math.round((monday-epoch)/604800000); }
function questsForDate(ds){
  const avail=QUEST_POOL.filter(q=>q.applies()); const n=avail.length; if(!n) return [];
  const start=(((weekIndex(ds)%n)+n)%n); const picks=[];
  for(let k=0;k<n && picks.length<4;k++) picks.push(avail[(start+k)%n]);
  return picks;
}
function activeQuests(){ return questsForDate(ymd(today)); }
function questDone(q,ds){ const p=q.progress(ds); return p.have>=p.need; }
function completedQuestIds(ds){ const s=new Set(); for(const q of questsForDate(ds)) if(questDone(q,ds)) s.add(q.id); return s; }
function questXpForDay(ds){ let x=0; for(const q of questsForDate(ds)) if(questDone(q,ds)) x+=q.xp; return x; }
function totalQuestXp(){
  const dates=new Set(); for(const [,m] of logs) for(const [ds,l] of m) if(l.completed) dates.add(ds);
  let x=0; for(const ds of dates) x+=questXpForDay(ds); return x;
}

// ---- top-level view switch ----
function ringSvg(done,total){
  const pct = total? done/total : 0;
  const R=25, C=2*Math.PI*R, off=C*(1-pct);
  const col = pct>=1? 'var(--health)' : 'var(--mind)';
  $('ring').innerHTML =
    `<svg width="60" height="60" viewBox="0 0 60 60">
       <circle cx="30" cy="30" r="${R}" stroke="rgba(255,255,255,.10)" stroke-width="6" fill="none"/>
       <circle cx="30" cy="30" r="${R}" stroke="${col}" stroke-width="6" fill="none"
         stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .5s ease"/>
     </svg><div class="pct">${done}/${total}</div>`;
}
function renderLevelBar(){

function render(){

function questsHtml(ds){
  const qs=questsForDate(ds); if(!qs.length) return '';

function rowEl(r,cat,ds){
  const cad=CADENCE[r.cadence];
  const done=isDone(r.id,ds);
  const log=getLog(r.id,ds);
  const el=document.createElement('div'); el.className='row'+(done?' done':''); el.style.setProperty('--acc',cat.color);
  let meta='';
  if(cad.periodic){
    const st=periodicStatus(r);
    meta += `<span class="badge cad">${cad.label}</span>`;
    meta += st.due ? `<span class="badge due">Due</span>` : `<span class="badge">${st.text}</span>`;
    if(st.due && st.text!=='Due' && st.text!=='Not done yet') meta+=`<span>${st.text}</span>`;
  } else {
    const s=streak(r.id);
    meta += s>0 ? `<span class="flame">🔥 ${s}</span>` : `<span style="color:var(--muted2)">Build a streak</span>`;
  }
  const hasTarget = r.track_value && r.target_value!=null;
  if(hasTarget){ const cur = log && log.value!=null ? log.value : 0; meta += `<span class="tgt">${cur} / ${r.target_value}${r.unit||''}</span>`; }
  let pbar='';
  if(hasTarget){ const cur = log && log.value!=null ? Number(log.value) : 0; const pct = Math.max(0, Math.min(1, cur/Number(r.target_value)))*100; pbar = `<div class="pbar"><i style="width:${pct}%"></i></div>`; }

  const control = cad.periodic ? `<button class="check log" data-toggle="${r.id}">${done?'Done ✓':'Log'}</button>`
    : `<button class="check" data-toggle="${r.id}" aria-label="Toggle"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></button>`;
  el.innerHTML = `<div class="info" data-detail="${r.id}"><div class="name">${escapeHtml(r.name)} ${noteFlag}</div><div class="meta">${meta}</div>${pbar}</div>${valHtml}${control}`;
  return el;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- HISTORY ----
const HDAYS = 28;
function dayState(r, ds){
  const created = r.created_at ? ymd(new Date(r.created_at)) : null;
  if(created && ds < created) return 'na';
  if(isRest(ds)) return 'rest';
  const log = getLog(r.id, ds);
  if(CADENCE[r.cadence].periodic){ return (log && log.completed) ? 'done' : 'na'; }
  if(log && log.completed) return 'done';
  if(log && log.value!=null) return 'partial';
  return 'miss';
}
function sqColor(state, raw){
  if(state==='done') return raw;
  if(state==='partial') return 'color-mix(in srgb,'+raw+' 42%, transparent)';
  if(state==='miss') return 'rgba(255,255,255,.06)';
  if(state==='rest') return 'rgba(56,189,248,.30)';
  return 'rgba(255,255,255,.03)';
}
function renderHistory(){
  const dsToday = ymd(today);
  const daily = routines.filter(r=>!CADENCE[r.cadence].periodic);
  ringSvg(daily.filter(r=>isDone(r.id,dsToday)).length, daily.length);
  $('subtitle').textContent = `Last ${HDAYS/7} weeks`;
  const wkStart = parseYmd(weekKey(today));
  const elapsed = Math.round((today - wkStart)/86400000) + 1;
  let possible=0, done=0, checkoffs=0;
  for(const r of daily){ for(let i=0;i<elapsed;i++){ const d=ymd(addDays(wkStart,i)); if(d>dsToday) break; const st=dayState(r,d); if(st!=='na' && st!=='rest'){ possible++; if(isDone(r.id,d)) done++; } } }
  for(const [,m] of logs){ for(const [ds,l] of m){ if(l.completed && weekKey(parseYmd(ds))===weekKey(today)) checkoffs++; } }
  const pct = possible? Math.round(done/possible*100):0;
  const best = daily.reduce((m,r)=>Math.max(m,streak(r.id)),0);
  let html = `<div class="tiles">
      <div class="tile"><div class="big" style="color:var(--health)">${pct}%</div><div class="lbl">This week</div></div>
      <div class="tile"><div class="big" style="color:var(--flame)">🔥 ${best}</div><div class="lbl">Best streak</div></div>
      <div class="tile"><div class="big">${checkoffs}</div><div class="lbl">Check-offs</div></div>
    </div>
    <div class="legend"><span><i style="background:#34d399"></i>Done</span>
      <span><i style="background:color-mix(in srgb,#34d399 42%,transparent)"></i>Partial</span>
      <span><i style="background:rgba(255,255,255,.06)"></i>Missed</span>
      <span><i style="background:rgba(56,189,248,.30)"></i>Rest</span></div>`;
  if(!routines.length){ $('app').innerHTML = html + '<div class="loading">No routines yet.</div>'; return; }
  const wi = weighInPoints();
  if(wi && wi.pts.length){
    const pts=wi.pts, latest=pts[pts.length-1], first=pts[0];
    const unit=escapeHtml(wi.r.unit||'kg');
    const delta = latest.top-first.top;
    const sub = pts.length>1
      ? `${fmtW(latest.top)} ${unit} · <span style="color:var(--muted2)">${delta>0?'+':''}${fmtW(delta)} since ${fmtDate(first.date)}</span>`
      : `${fmtW(latest.top)} ${unit}`;
    html += `<div class="hcard"><div class="top"><span class="n">⚖️ ${escapeHtml(wi.r.name)}</span><span class="s">${sub}</span></div>${chartSvg(pts,{empty:'Log 2+ weigh-ins to see the trend.'})}</div>`;
  }
  const days=[]; for(let i=HDAYS-1;i>=0;i--) days.push(ymd(addDays(today,-i)));
  for(const cat of CATEGORIES){
    const items = routines.filter(r=>r.category===cat.key); if(!items.length) continue;
    html += `<div class="cat"><h2><span class="dot" style="background:${cat.color}"></span>${cat.label}</h2>`;
    for(const r of items){
      const raw = RAWCOLOR[r.category];
      const per = CADENCE[r.cadence].periodic;
      const sub = per ? CADENCE[r.cadence].label : (streak(r.id)>0?`🔥 ${streak(r.id)} day streak`:'No active streak');
      const sq = days.map(d=>`<div class="sq" style="background:${sqColor(dayState(r,d),raw)}"></div>`).join('');
      html += `<div class="hcard"><div class="top"><span class="n">${escapeHtml(r.name)}</span><span class="s">${sub}</span></div><div class="hstrip">${sq}</div></div>`;
    }
    html += `</div>`;
  }
  $('app').innerHTML = html;
}

function exName(id){ const e=gymExercises.find(x=>x.id===id); return e?e.name:'Exercise'; }
function fmtW(w){ w=Number(w)||0; return Number.isInteger(w)?String(w):w.toFixed(1); }
function fmtDate(ds){ try{ return parseYmd(ds).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }catch(e){ return ds; } }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function isTodayDate(ds){ return ds===ymd(today); }
// local gymSets mirror maintenance (keeps derived PR/XP/charts correct without refetch)
function gsAdd(row){ gymSets.push(row); }
function gsPatch(id,f){ const s=gymSets.find(x=>x.id===id); if(s) Object.assign(s,f); }
function gsDel(id){ const i=gymSets.findIndex(x=>x.id===id); if(i>=0) gymSets.splice(i,1); }
function exercisePR(id){ let m=0; for(const s of gymSets){ if(s.exercise_id===id && s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function historicalTop(exId,exclWid){ let m=0; for(const s of gymSets){ if(s.exercise_id!==exId||s.workout_id===exclWid) continue; if(s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function workoutTop(exId,wid){ let m=0; for(const s of gymSets){ if(s.exercise_id===exId&&s.workout_id===wid&&s.weight!=null) m=Math.max(m,Number(s.weight)); } return m; }
function exerciseLastSets(id, excludeWid){
  for(const w of gymWorkouts){ if(w.id===excludeWid) continue;
    const ss=gymSets.filter(s=>s.workout_id===w.id && s.exercise_id===id).sort((a,b)=>a.set_no-b.set_no);
    if(ss.length) return {date:w.workout_date, sets:ss}; }
  return null;
}
function gymChartData(id){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const top={};
  for(const s of gymSets){ if(s.exercise_id!==id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    top[w.workout_date]=Math.max(top[w.workout_date]||0, Number(s.weight)||0); }
  return Object.keys(top).sort().map(d=>({date:d, top:top[d]}));
}
function gymPrEvents(){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const perEx={};
  for(const s of gymSets){ if(!s.exercise_id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    const e=(perEx[s.exercise_id]=perEx[s.exercise_id]||{}); e[w.workout_date]=Math.max(e[w.workout_date]||0, Number(s.weight)||0); }
  let events=0;
  for(const id in perEx){ const days=Object.keys(perEx[id]).sort(); let mx=-1; days.forEach((d,i)=>{ const v=perEx[id][d]; if(i===0) mx=v; else if(v>mx){ mx=v; events++; } }); }
  return events;
}
function gymBonusXp(){ return gymReady ? gymPrEvents()*15 : 0; }
function chartSvg(pts, opt){
  opt = opt||{}; const color = opt.color||'var(--fitness)';
  if(pts.length<2) return `<div class="gempty" style="padding:8px 0">${opt.empty||'Log 2+ sessions to see the trend.'}</div>`;
  const W=300,H=56,pad=8; const ws=pts.map(p=>p.top); const mn=Math.min(...ws), mx=Math.max(...ws); const rng=(mx-mn)||1;
  const xs=i=> pad + (i/(pts.length-1))*(W-2*pad);
  const ys=v=> (H-pad) - ((v-mn)/rng)*(H-2*pad);
  let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.top).toFixed(1)+' '; });
  const dots = pts.length>40 ? '' : pts.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.top).toFixed(1)}" r="2.4" fill="${color}"/>`).join('');
  return `<svg class="gchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
// ---- Estimated 1RM (Epley) ----
function e1rm(w,reps){ w=Number(w)||0; reps=Number(reps)||0; if(w<=0||reps<=0) return 0; if(reps===1) return w; return w*(1+reps/30); }
function exerciseE1RM(id){ let m=0; for(const s of gymSets){ if(s.exercise_id===id) m=Math.max(m, e1rm(s.weight,s.reps)); } return m; }
function gymE1rmChartData(id){
  const byW=new Map(gymWorkouts.map(w=>[w.id,w])); const top={};
  for(const s of gymSets){ if(s.exercise_id!==id) continue; const w=byW.get(s.workout_id); if(!w) continue;
    top[w.workout_date]=Math.max(top[w.workout_date]||0, e1rm(s.weight,s.reps)); }
  return Object.keys(top).sort().map(d=>({date:d, top:top[d]}));
}
// ---- Body-weight trend (from the weigh-in routine's logged values) ----
function weighInRoutine(){ return routines.find(r=>r.track_value && /weigh/i.test(r.name)) || routines.find(r=>/weigh/i.test(r.name)) || null; }
function weighInPoints(){
  const r=weighInRoutine(); if(!r) return null;
  const m=logs.get(r.id); const pts=[];
  if(m){ for(const [ds,l] of m){ const v=Number(l.value); if(l.value!=null && l.value!=='' && !isNaN(v)) pts.push({date:ds, top:v}); } }
  pts.sort((a,b)=> a.date<b.date?-1:1);
  return {r, pts};
}

  let html=`<div class="gsub">

}
function noteOpen(e){ return e._noteOpen===true || (e._noteOpen==null && !!(e.note&&e.note.trim())); }

    </div>
    ${ex}
    <button class="gaddex" data-gaddex="1">＋ Add exercise</button>
    <div class="rtimer ${running?'run':''}" id="rtimer">
      <span class="rt" id="rtimerval">${fmtTime(running?restLeft:restDur)}</span><span class="rlbl">Rest</span>
      <button data-radj="-15">−15</button><button data-radj="15">+15</button>
      <button data-rtoggle="1">${running?'Skip':'Start'}</button></div>
    <div class="gsave"><button class="btn-del" data-gdiscard="1" style="flex:0 0 auto">Discard</button>

  if(!shown.length) return `<div class="gempty">No workouts logged yet. Head to the Log tab to start one.</div>`;

    const summary=[...byEx.entries()].map(([n,c])=>`${escapeHtml(n)} ×${c}`).join(' · ');

function gymProgressHtml(){
  const logged=gymExercises.filter(e=>gymSets.some(s=>s.exercise_id===e.id));

}

// ---- session lifecycle ----
async function startSession(kind){
  if(busy||!gymReady) return;
  let label, exIds;
  if(kind==='A'||kind==='B'){ label='Full Body '+kind; exIds=gymExercises.filter(e=>e.in_template===kind).sort((a,b)=>a.sort_order-b.sort_order).map(e=>e.id); }
  else { label='Workout'; exIds=[]; }
  busy=true;
  const ds=ymd(today);
  try{
    const wk=await rest('POST','gym_workouts',{body:{workout_date:ds, label, finished:false, ex_order:exIds, ex_notes:{}}, prefer:'return=representation'});
    const w=Array.isArray(wk)?wk[0]:wk;
    gymWorkouts.unshift(w);
    gymSession={ id:w.id, label, date:ds, note:'', ex_order:exIds.slice(), ex_notes:{},
      exercises: exIds.map(id=>({exId:id, note:'', sets:[{weight:'',reps:''}]})),
      finished:false, tickedRoutine:false,
      preLevel:levelInfo(totalXp()).level, preTiers:completedTierCount(), prToasted:new Set() };
    gymTab='log'; stopRest(); renderGym();
  }catch(e){ toast('Could not start workout — did the SQL run?', true); console.error(e); }
  busy=false;
}
function buildExercisesFromWorkout(w){
  const sets=gymSets.filter(s=>s.workout_id===w.id);
  const present=[...new Set(sets.map(s=>s.exercise_id))];
  let order = Array.isArray(w.ex_order)&&w.ex_order.length ? w.ex_order.slice() : null;
  if(!order){
    order = present.slice().sort((a,b)=>{ const ea=gymExercises.find(x=>x.id===a),eb=gymExercises.find(x=>x.id===b); return (ea?ea.sort_order:0)-(eb?eb.sort_order:0); });
  } else {
    present.forEach(id=>{ if(!order.includes(id)) order.push(id); });
    order = order.filter(id=>gymExercises.some(x=>x.id===id));
  }
  const notes = (w.ex_notes && typeof w.ex_notes==='object') ? w.ex_notes : {};
  return order.map(id=>{
    const ss=sets.filter(s=>s.exercise_id===id).sort((a,b)=>(a.set_no||0)-(b.set_no||0))
       .map(s=>({id:s.id, set_no:s.set_no, weight:s.weight, reps:s.reps}));
    if(!ss.length) ss.push({weight:'',reps:''});
    return { exId:id, note: notes[id]||'', sets: ss };
  });
}
function openWorkout(wid){
  if(busy) return;
  const w=gymWorkouts.find(x=>String(x.id)===String(wid)); if(!w) return;
  gymSession={ id:w.id, label:w.label||'Workout', date:w.workout_date, note:w.note||'',
    ex_order:Array.isArray(w.ex_order)?w.ex_order.slice():null, ex_notes:(w.ex_notes&&typeof w.ex_notes==='object')?w.ex_notes:{},
    exercises: buildExercisesFromWorkout(w),
    finished: w.finished!==false,
    tickedRoutine: gymSets.some(s=>s.workout_id===w.id),
    preLevel:levelInfo(totalXp()).level, preTiers:completedTierCount(), prToasted:new Set() };
  gymTab='log'; stopRest(); renderGym();
}
function nextSetNo(ex){ let m=0; ex.sets.forEach(s=>{ if(s.set_no) m=Math.max(m,s.set_no); }); return m+1; }
async function persistSet(i,j){
  if(!gymSession) return;
  const ex=gymSession.exercises[i]; if(!ex) return; const st=ex.sets[j]; if(!st||st._saving) return;
  const reps=parseInt(st.reps,10);
  const weight=(st.weight===''||st.weight==null)?0:Number(st.weight);
  if(!(reps>0) || isNaN(weight)){
    if(st.id){ st._saving=true; try{ await rest('DELETE','gym_sets?id=eq.'+st.id); gsDel(st.id); }catch(e){} st.id=null; st._saving=false; }
    return;
  }
  st._saving=true;
  try{
    if(st.id){
      await rest('PATCH','gym_sets?id=eq.'+st.id,{body:{weight,reps},prefer:'return=minimal'});
      gsPatch(st.id,{weight,reps});
    } else {
      const wasFirst = !gymSets.some(s=>s.workout_id===gymSession.id);
      const set_no = nextSetNo(ex);
      const r=await rest('POST','gym_sets',{body:{workout_id:gymSession.id, exercise_id:ex.exId, set_no, weight, reps}, prefer:'return=representation'});
      const ns=Array.isArray(r)?r[0]:r;
      if(ns){ st.id=ns.id; st.set_no=(ns.set_no!=null?ns.set_no:set_no); gsAdd({id:ns.id, workout_id:gymSession.id, exercise_id:ex.exId, set_no:st.set_no, weight, reps}); }
      if(wasFirst && !gymSession.tickedRoutine && isTodayDate(gymSession.date)){ gymSession.tickedRoutine=true; completeGymRoutine(gymSession.date); }
    }
    maybePR(ex.exId);
    markSavedStat();
  }catch(e){ toast('Set not saved — check connection', true); console.error(e); }
  st._saving=false;
}
function maybePR(exId){
  if(!gymSession || gymSession.prToasted.has(exId)) return;
  const hasHist=gymSets.some(s=>s.exercise_id===exId && s.workout_id!==gymSession.id);
  if(!hasHist) return; // first-ever log = baseline, no PR
  const cur=workoutTop(exId,gymSession.id), hist=historicalTop(exId,gymSession.id);
  if(cur>0 && cur>hist){ gymSession.prToasted.add(exId); prFeedback(exName(exId),cur); updatePrChip(exId); }
}
function prFeedback(name,val){ if(navigator.vibrate) navigator.vibrate([40,50,40]); bigBurst();
  toast('🏆 New PR — '+name+' '+fmtW(val)+'kg', false, true); }
function updatePrChip(exId){ const el=document.querySelector('[data-prchip="'+String(exId).replace(/"/g,'')+'"]'); if(el){ const pr=exercisePR(exId); el.textContent=pr?'PR '+fmtW(pr)+'kg':''; } }
function markSavedStat(){ const el=$('gsavestat'); if(!el) return; const d=new Date();
  const p=n=>String(n).padStart(2,'0'); el.textContent='Auto-saved ✓ '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
// live set-save scheduling
const gsetTimers={};
function scheduleSetSave(i,j){ const k=i+':'+j; clearTimeout(gsetTimers[k]); gsetTimers[k]=setTimeout(()=>{ delete gsetTimers[k]; persistSet(i,j); }, 700); }
function flushSetSave(i,j){ const k=i+':'+j; if(gsetTimers[k]){ clearTimeout(gsetTimers[k]); delete gsetTimers[k]; } persistSet(i,j); }
function flushAllSets(){ Object.keys(gsetTimers).forEach(k=>{ const p=k.split(':'); flushSetSave(+p[0],+p[1]); }); }

function gAddSet(i){ const ex=gymSession.exercises[i]; const last=ex.sets[ex.sets.length-1]; ex.sets.push({weight:last?last.weight:'', reps:''}); startRest(); renderGym(); }
async function gRmSet(i,j){ const ex=gymSession.exercises[i]; if(!ex) return; const st=ex.sets[j]; ex.sets.splice(j,1);
  if(st&&st.id){ try{ await rest('DELETE','gym_sets?id=eq.'+st.id); gsDel(st.id); }catch(e){ toast('Could not remove set', true); } }
  if(!ex.sets.length) ex.sets.push({weight:'',reps:''}); renderGym(); }
function gMoveEx(i,dir){ const a=gymSession.exercises; const j=i+dir; if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; persistExOrder(); renderGym(); }
function persistExOrder(){ if(!gymSession) return; const order=gymSession.exercises.map(e=>e.exId); gymSession.ex_order=order;
  const w=gymWorkouts.find(x=>x.id===gymSession.id); if(w) w.ex_order=order;
  rest('PATCH','gym_workouts?id=eq.'+gymSession.id,{body:{ex_order:order},prefer:'return=minimal'}).then(markSavedStat).catch(()=>toast('Order not saved',true)); }
function persistExNotes(){ if(!gymSession) return; const notes={}; gymSession.exercises.forEach(e=>{ if(e.note&&e.note.trim()) notes[e.exId]=e.note.trim(); }); gymSession.ex_notes=notes;
  const w=gymWorkouts.find(x=>x.id===gymSession.id); if(w) w.ex_notes=notes;
  rest('PATCH','gym_workouts?id=eq.'+gymSession.id,{body:{ex_notes:notes},prefer:'return=minimal'}).then(markSavedStat).catch(()=>toast('Note not saved',true)); }
function persistMeta(){ if(!gymSession) return;
  const label=(($('g-label')&&$('g-label').value)||'').trim()||'Workout';
  const date=($('g-date')&&$('g-date').value)||gymSession.date;

  rest('PATCH','gym_workouts?id=eq.'+gymSession.id,{body:{label, workout_date:date, note:note||null},prefer:'return=minimal'}).then(markSavedStat).catch(()=>toast('Details not saved',true)); }
async function gRmExercise(i){ const ex=gymSession.exercises[i]; if(!ex) return;
  if(ex.sets.some(s=>s.id) && !confirm('Remove '+exName(ex.exId)+' and its logged sets?')) return;
  gymSession.exercises.splice(i,1); const wid=gymSession.id;
  try{ await rest('DELETE','gym_sets?workout_id=eq.'+wid+'&exercise_id=eq.'+ex.exId); gymSets=gymSets.filter(s=>!(s.workout_id===wid&&s.exercise_id===ex.exId)); }catch(e){ toast('Could not remove exercise', true); }
  persistExOrder(); persistExNotes(); renderGym(); }
function gAddExercise(id){ if(!gymSession) return;
  if(gymSession.exercises.some(e=>String(e.exId)===String(id))){ toast('Already in this workout'); return; }
  gymSession.exercises.push({exId:id, note:'', sets:[{weight:'',reps:''}]}); persistExOrder(); renderGym(); }
async function completeGymRoutine(ds){
  const g=routines.find(r=>/gym/i.test(r.name||'')); if(!g) return;
  try{ await setLog(g, ds, true, undefined, true); }catch(e){ console.warn('link gym routine failed', e); }
}
async function gFinish(){
  if(!gymSession || busy) return; busy=true;
  flushAllSets();
  const wid=gymSession.id;
  const preLevel=gymSession.preLevel, preTiers=gymSession.preTiers;
  try{
    const nSets=gymSets.filter(s=>s.workout_id===wid).length;
    if(nSets===0){
      await rest('DELETE','gym_workouts?id=eq.'+wid).catch(()=>{});
      gymWorkouts=gymWorkouts.filter(w=>w.id!==wid);
      gymSession=null; stopRest(); gymTab='log'; render(); renderGym(); busy=false; return;
    }
    await rest('PATCH','gym_workouts?id=eq.'+wid,{body:{finished:true},prefer:'return=minimal'});
    const w=gymWorkouts.find(x=>x.id===wid); if(w) w.finished=true;
    stopRest(); gymSession=null; gymTab='history';
    await loadGym(); await load(); render();
    toast('Workout saved 💪');
    if(!checkSetComplete(preTiers)) checkLevelUp(preLevel);
  }catch(e){ toast('Could not finish — check connection', true); console.error(e); }
  busy=false;
}
async function gDiscard(){
  if(!gymSession || busy) return;
  const wid=gymSession.id;
  const nSets=gymSets.filter(s=>s.workout_id===wid).length;
  if(nSets>0 && !confirm('Discard this whole workout and its '+nSets+' set'+(nSets>1?'s':'')+'? This cannot be undone.')) return;
  busy=true; flushAllSets();
  try{
    await rest('DELETE','gym_sets?workout_id=eq.'+wid).catch(()=>{});
    await rest('DELETE','gym_workouts?id=eq.'+wid);
    gymSets=gymSets.filter(s=>s.workout_id!==wid); gymWorkouts=gymWorkouts.filter(w=>w.id!==wid);
    gymSession=null; stopRest(); gymTab='log';
    await load(); render(); renderGym();
    toast(nSets>0?'Workout discarded':'Session cleared');
  }catch(e){ toast('Could not discard', true); console.error(e); }
  busy=false;
}

function renderRest(){ const v=$('rtimerval'); if(v) v.textContent=fmtTime(restT?restLeft:restDur); const bar=$('rtimer'); if(bar) bar.classList.toggle('run', !!restT); }

// ================= TASKS (build 13) =================
// To-dos and appointments. Deliberately OUTSIDE the game layer:
// nothing here grants XP, moves a streak, or touches a quest.

const TK_TODO_C = 'var(--health)';
const TK_APPT_C = 'var(--work)';

function tkIsAppt(t){ return t.kind==='appt'; }
function tkVisible(t){ return tkIsAppt(t) ? tkShowAppts : tkShowTodos; }
function tkOpen(){ return tasks.filter(t=>!t.done); }
// The chip count must match what turning the filter on actually reveals,
// so past appointments (hidden from the list) don't count.
function tkCountOpen(kind){ return tasks.filter(t=>!t.done && t.kind===kind && !tkStale(t)).length; }

// Appointments "pass" rather than get ticked: once their moment is gone they're history.
function tkPast(t){
  if(!t.due_date) return false;
  const ds=ymd(today);
  if(t.due_date < ds) return true;
  if(t.due_date > ds) return false;
  if(!t.due_time) return false;
  const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return t.due_time.slice(0,5) < hhmm;
}
function tkOverdue(t){
  if(t.done) return false;
  if(tkIsAppt(t)) return false;          // an appointment isn't "overdue", it just passed
  return !!t.due_date && t.due_date < ymd(today);
}
// An appointment on a past day is history, not an open item: it drops out of the
// list entirely and stays visible in calendar mode. To-dos never go stale — an
// undone to-do from last week is exactly what "Overdue" is for.
function tkStale(t){ return tkIsAppt(t) && !!t.due_date && t.due_date < ymd(today); }
function tkFmtTime(s){ return s ? s.slice(0,5) : ''; }
function tkFmtDay(ds){
  const diff=Math.round((parseYmd(ds)-today)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  return parseYmd(ds).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function tkSortKey(t){
  return (t.due_date||'9999-12-31')+' '+(t.due_time?t.due_time.slice(0,5):(tkIsAppt(t)?'00:00':'99:99'));
}
function tkSorted(list){ return list.slice().sort((a,b)=>tkSortKey(a).localeCompare(tkSortKey(b))); }

// ---- buckets for list mode ----
function tkBuckets(){
  const ds=ymd(today);
  const endOfWeek=ymd(addDays(today, 7-((today.getDay()+6)%7) - 1)); // this ISO week's Sunday
  const g={ overdue:[], today:[], tomorrow:[], week:[], later:[], someday:[] };
  for(const t of tasks){
    if(t.done || !tkVisible(t) || tkStale(t)) continue;
    if(!t.due_date){ g.someday.push(t); continue; }
    if(t.due_date < ds){ g.overdue.push(t); continue; }
    if(t.due_date === ds){ g.today.push(t); continue; }
    if(t.due_date === ymd(addDays(today,1))){ g.tomorrow.push(t); continue; }
    if(t.due_date <= endOfWeek){ g.week.push(t); continue; }
    g.later.push(t);
  }
  for(const k in g) g[k]=tkSorted(g[k]);
  return g;
}

// ---- item markup ----
// hideDate: the surrounding group header already names the day, so repeating it is noise
function tkItemHtml(t, hideDate){
  const appt=tkIsAppt(t);
  const over=tkOverdue(t);
  const passed=appt && tkPast(t) && !t.done;
  let lead;
  if(appt){
    lead = `<div class="tktime">${t.due_time
      ? `<div class="th">${tkFmtTime(t.due_time)}</div>${t.end_time?`<div class="tm">${tkFmtTime(t.end_time)}</div>`:''}`
      : `<div class="allday">ALL<br>DAY</div>`}</div>`;
  } else {
    lead = `<button class="tkbox" data-tktoggle="${t.id}" aria-label="${t.done?'Mark not done':'Mark done'}">✓</button>`;
  }
  const bits=[];
  if(t.due_date && !hideDate) bits.push(tkFmtDay(t.due_date));
  if(!appt && t.due_time) bits.push(tkFmtTime(t.due_time));
  if(t.location) bits.push('📍 '+escapeHtml(t.location));
  let tags='';
  if(over) tags+=`<span class="tag late">overdue</span>`;
  if(passed) tags+=`<span class="tag">passed</span>`;
  return `<div class="tkitem ${appt?'appt':'todo'}${t.done?' isdone':''}${over?' isover':''}">
    ${lead}
    <div class="tkmain" data-tkedit="${t.id}">
      <div class="tktitle">${escapeHtml(t.title)}</div>
      ${(bits.length||tags)?`<div class="tkmeta">${bits.map(b=>`<span>${b}</span>`).join('<span style="opacity:.4">·</span>')}${tags}</div>`:''}
      ${t.note?`<div class="tknote">${escapeHtml(t.note)}</div>`:''}
    </div>
  </div>`;
}
function tkGroupHtml(label, list, cls, hideDate){
  if(!list.length) return '';
  return `<div class="tkgroup ${cls||''}"><h3>${label}<span class="gc">${list.length}</span></h3>
    ${list.map(t=>tkItemHtml(t,hideDate)).join('')}</div>`;
}

// ---- list mode ----
function tkListHtml(){
  const g=tkBuckets();
  const any = Object.values(g).some(a=>a.length);
  let html='';
  if(!any){
    const noFilter = !tkShowTodos && !tkShowAppts;
    html += `<div class="tkempty">${noFilter
      ? 'Both filters are off — turn on <b>To-dos</b> or <b>Appointments</b> to see anything.'
      : 'Nothing on the list.<br>Tap <b>＋ Add</b> to put something here.'}</div>`;
  } else {
    html += tkGroupHtml('⚠ Overdue', g.overdue, 'overdue');
    html += tkGroupHtml('Today',     g.today,    '', true);
    html += tkGroupHtml('Tomorrow',  g.tomorrow, '', true);
    html += tkGroupHtml('This week', g.week);
    html += tkGroupHtml('Later',     g.later);
    html += tkGroupHtml('Someday',   g.someday,  '', true);
  }
  const done=tkSorted(tasks.filter(t=>t.done && tkVisible(t))).reverse();
  if(done.length){
    html += `<button class="tkdonehead" id="tkDoneToggle">${tkShowDone?'▾':'▸'} Completed · ${done.length}</button>`;
    if(tkShowDone) html += `<div class="tkgroup" style="margin-top:10px">${done.slice(0,50).map(t=>tkItemHtml(t,false)).join('')}</div>`;
  }
  return html;
}

// ---- calendar mode ----
function tkMonthStart(){
  if(!tkCalMonth) tkCalMonth=new Date(today.getFullYear(), today.getMonth(), 1);
  return tkCalMonth;
}
function tkByDay(){
  const m=new Map();
  for(const t of tasks){
    if(!t.due_date || !tkVisible(t)) continue;
    if(!m.has(t.due_date)) m.set(t.due_date,[]);
    m.get(t.due_date).push(t);
  }
  return m;
}
function tkCalHtml(){
  const start=tkMonthStart();
  const byDay=tkByDay();
  const y=start.getFullYear(), mo=start.getMonth();
  const first=new Date(y,mo,1);
  const lead=(first.getDay()+6)%7;                 // Monday-first
  const gridStart=addDays(first,-lead);
  const dsToday=ymd(today);
  const sel=tkCalSel||dsToday;
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), ds=ymd(d);
    const out = d.getMonth()!==mo;
    const items=(byDay.get(ds)||[]).filter(t=>!t.done);
    const hasOver=items.some(tkOverdue);
    let dots='';
    if(items.length){
      const kinds=[...new Set(items.map(t=>t.kind))];
      dots=kinds.slice(0,2).map(k=>`<i style="background:${k==='appt'?TK_APPT_C:TK_TODO_C}"></i>`).join('');
      if(items.length>2) dots+=`<i style="background:var(--muted2)"></i>`;
    }
    cells+=`<button class="tkday${out?' out':''}${ds===dsToday?' today':''}${ds===sel?' sel':''}${hasOver?' hasover':''}"
      data-tkday="${ds}"><span>${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const monthName=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayItems=tkSorted((byDay.get(sel)||[]));
  const undated=tkSorted(tasks.filter(t=>!t.done && !t.due_date && tkVisible(t)));
  return `<div class="tkcal">
      <div class="tkcalhead"><button data-tkmo="-1" aria-label="Previous month">‹</button>
        <div class="cmn">${monthName}</div>
        <button data-tkmo="1" aria-label="Next month">›</button></div>
      <div class="tkdow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="tkgrid">${cells}</div>
    </div>
    <div class="tkdaytitle">${tkFmtDay(sel)}<span class="dc">${dayItems.length||'nothing'}${dayItems.length?' item'+(dayItems.length>1?'s':''):''}</span></div>
    ${dayItems.length ? dayItems.map(t=>tkItemHtml(t,true)).join('')
      : `<div class="tkempty" style="padding:26px 12px">Nothing on this day.</div>`}
    ${undated.length ? `<div class="tktray">${tkGroupHtml('Someday · no date', undated, '', true)}</div>` : ''}`;
}

// ---- the view ----
function renderTasks(){
  const dsToday=ymd(today);
  const daily=routines.filter(r=>!CADENCE[r.cadence].periodic);
  ringSvg(daily.filter(r=>isDone(r.id,dsToday)).length, daily.length);
  const app=$('app');
  if(!tasksReady){
    $('subtitle').textContent='Tasks';
    app.innerHTML=`<div class="gwarn"><b>Tasks needs a one-time setup.</b><br>Run <code>sql/tasks.sql</code> in your Supabase SQL editor, then refresh with a new <code>?v=</code>. The rest of the app works normally in the meantime.</div>`;
    return;
  }
  const openTodos=tkCountOpen('todo'), openAppts=tkCountOpen('appt');
  const dueToday=tasks.filter(t=>!t.done && t.due_date===dsToday).length;
  const over=tasks.filter(tkOverdue).length;
  $('subtitle').textContent = (dueToday?`${dueToday} today`:'Nothing due today') + (over?` · ${over} overdue`:'');
  app.innerHTML = `
    <div class="tkbar">
      <button class="tkchip ${tkShowTodos?'on':''}" id="tkFa" style="--tkc:${TK_TODO_C}">
        <span class="tkdot"></span>To-dos<span class="tkn">${openTodos}</span></button>
      <button class="tkchip ${tkShowAppts?'on':''}" id="tkFb" style="--tkc:${TK_APPT_C}">
        <span class="tkdot"></span>Appts<span class="tkn">${openAppts}</span></button>
      <div class="tkmode">
        <button data-tkmode="list" class="${tkMode==='list'?'on':''}" aria-label="List view">☰</button>
        <button data-tkmode="cal" class="${tkMode==='cal'?'on':''}" aria-label="Calendar view">▦</button>
      </div>
    </div>
    <button class="tkadd" id="tkAdd">＋ Add a to-do or appointment</button>
    ${tkMode==='cal' ? tkCalHtml() : tkListHtml()}`;
  bindTasks();
}
function bindTasks(){
  const app=$('app');
  const fa=$('tkFa'), fb=$('tkFb'), add=$('tkAdd');
  if(fa) fa.onclick=()=>{ tkShowTodos=!tkShowTodos; tkSavePrefs(); renderTasks(); };
  if(fb) fb.onclick=()=>{ tkShowAppts=!tkShowAppts; tkSavePrefs(); renderTasks(); };
  if(add) add.onclick=()=>openTaskForm(null);
  const dt=$('tkDoneToggle'); if(dt) dt.onclick=()=>{ tkShowDone=!tkShowDone; renderTasks(); };
  app.querySelectorAll('[data-tkmode]').forEach(b=>b.onclick=()=>{
    tkMode=b.getAttribute('data-tkmode'); tkSavePrefs(); renderTasks(); });
  app.querySelectorAll('[data-tktoggle]').forEach(b=>b.onclick=()=>toggleTask(b.getAttribute('data-tktoggle'), b));
  app.querySelectorAll('[data-tkedit]').forEach(b=>b.onclick=()=>openTaskForm(tasks.find(t=>t.id===b.getAttribute('data-tkedit'))));
  app.querySelectorAll('[data-tkmo]').forEach(b=>b.onclick=()=>{
    const s=tkMonthStart(); tkCalMonth=new Date(s.getFullYear(), s.getMonth()+Number(b.getAttribute('data-tkmo')), 1);
    renderTasks(); });
  app.querySelectorAll('[data-tkday]').forEach(b=>b.onclick=()=>{ tkCalSel=b.getAttribute('data-tkday'); renderTasks(); });
}

// ---- mutations ----
let tkBusy=false;
async function toggleTask(id, btn){
  if(tkBusy) return;
  const t=tasks.find(x=>x.id===id); if(!t) return;
  const next=!t.done;
  tkBusy=true;
  try{
    const body={ done:next, done_at: next? new Date().toISOString() : null };
    await rest('PATCH','tasks?id=eq.'+id,{body,prefer:'return=minimal'});
    Object.assign(t, body);
    if(next && btn){ if(navigator.vibrate) navigator.vibrate(16); burst(btn); }
    renderTasks();
  }catch(e){ toast('Could not update that task', true); console.error(e); }
  tkBusy=false;
}

      <button class="tkchip ${kind==='appt'?'on':''}" id="tk-ka" style="--tkc:${TK_APPT_C}"><span class="tkdot"></span>Appointment</button>
    </div>
    <div class="field"><label>What is it?</label>
      <input type="text" id="tk-title" value="${escapeHtml(d.title||'')}" placeholder="e.g. Call the garage"></div>
    <div class="field rowly">
      <div><label id="tk-dlbl">Date</label>
        <input type="date" id="tk-date" value="${d.due_date||(isNew&&kind==='appt'?defaultDate:'')}"></div>
      <div><label>Time</label><input type="time" id="tk-time" value="${d.due_time?d.due_time.slice(0,5):''}"></div>

      </div>

    if(!confirm(`Delete "${d.title}"? This cannot be undone.`)) return;
    try{ await rest('DELETE','tasks?id=eq.'+d.id); tasks=tasks.filter(x=>x.id!==d.id);
      close(); toast('Deleted'); render(); }
    catch(e){ toast('Could not delete', true); console.error(e); }
  };
  $('tk-save').onclick=async ()=>{
    const title=$('tk-title').value.trim();
    if(!title){ toast('Give it a name', true); return; }
    const date=$('tk-date').value||null;
    if(k==='appt' && !date){ toast('An appointment needs a date', true); return; }
    const body={ title, kind:k, due_date:date,
      due_time: $('tk-time').value||null,
      end_time: k==='appt' ? ($('tk-end').value||null) : null,
      location: k==='appt' ? ($('tk-loc').value.trim()||null) : null,
      note: $('tk-note').value.trim()||null };
    try{
      if(isNew){ await rest('POST','tasks',{body,prefer:'return=minimal'}); }
      else { await rest('PATCH','tasks?id=eq.'+d.id,{body,prefer:'return=minimal'}); }
      await loadTasks(); close(); toast('Saved');
      if(k==='appt' && date && tkMode==='cal') tkCalSel=date;
      render();
    }catch(e){ toast('Could not save', true); console.error(e); }
  };
}

// ---- compact agenda strip on the Today view ----
function tkTodayStripHtml(){
  if(!tasksReady) return '';
  const ds=ymd(today);
  const items=tkSorted(tasks.filter(t=>!t.done && t.due_date && t.due_date<=ds && !tkStale(t)));
  if(!items.length) return '';
  const shown=items.slice(0,3);
  const lines=shown.map(t=>{
    const appt=tkIsAppt(t);
    const lead=appt ? (t.due_time?tkFmtTime(t.due_time):'all-day') : '○';
    return `<div class="tkline"><span class="lt${appt?'':' todo'}">${lead}</span>
      <span class="ln">${escapeHtml(t.title)}</span>
      ${tkOverdue(t)?'<span class="lx">OVERDUE</span>':''}</div>`;
  }).join('');
  const extra=items.length-shown.length;
  return `<div class="tkstrip" id="tkStrip">
    <div class="tkstriph">🗒 On today<span class="go">Open ›</span></div>
    ${lines}${extra?`<div class="tkmore">+${extra} more</div>`:''}</div>`;
}

let busy=false;
async function onToggle(rid, btn){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid); const ds=ymd(selected);
  const currentlyDone=isDone(rid,ds);
  const valInput=document.querySelector(`[data-val="${rid}"]`);
  const val=valInput?valInput.value:undefined;
  const preLevel = levelInfo(totalXp()).level;
  const preTiers = completedTierCount();
  const preQuests = completedQuestIds(ds);
  try{
    await setLog(r, ds, !currentlyDone, val, true);
    if(!currentlyDone){ btn.classList.add('pop'); if(navigator.vibrate) navigator.vibrate(18); burst(btn); floatXp(btn, xpOfRoutine(r)); checkQuests(preQuests, ds);
      if(!checkSetComplete(preTiers)) checkLevelUp(preLevel); }
    render();
  }catch(e){ toast('Could not save — check connection', true); console.error(e); }
  busy=false;
}
async function onValue(rid, input){
  if(busy) return; busy=true;
  const r=routines.find(x=>x.id===rid); const ds=ymd(selected);
  const v=input.value.trim();
  const wasDone=isDone(rid,ds);
  const preLevel = levelInfo(totalXp()).level;
  const preTiers = completedTierCount();
  const preQuests = completedQuestIds(ds);
  try{
    if(v===''){ const cur=getLog(rid,ds); if(cur&&cur.note){ await setLog(r,ds,true,null,false); } else { await setLog(r,ds,false); } }
    else { const done=valueDone(r,v); await setLog(r,ds,true,v,done);
      if(done && !wasDone){ if(navigator.vibrate)navigator.vibrate(14); floatXp(input, xpOfRoutine(r)); checkQuests(preQuests, ds);
        if(!checkSetComplete(preTiers)) checkLevelUp(preLevel); } }
    render();
  }catch(e){ toast('Could not save value', true); console.error(e); }
  busy=false;
}
function checkQuests(preIds, ds){
  const post=completedQuestIds(ds);
  const fresh=questsForDate(ds).filter(q=>post.has(q.id) && !preIds.has(q.id));
  if(!fresh.length) return;
  const q=fresh[fresh.length-1];
  if(navigator.vibrate) navigator.vibrate([12,30,12]);
  const extra = fresh.length>1 ? ` (+${fresh.length-1} more)` : '';
  toast(`✦ Quest complete — ${q.name} · +${q.xp} XP${extra}`, false, true);
}

  const r = routine || { name:'', category:'health', cadence:'daily', track_value:false, unit:'', target_value:null, active:true };
  const catOpts = CATEGORIES.map(c=>`<option value="${c.key}" ${r.category===c.key?'selected':''}>${c.label}</option>`).join('');
  const cadOpts = Object.entries(CADENCE).map(([k,v])=>`<option value="${k}" ${r.cadence===k?'selected':''}>${v.label}</option>`).join('');
  $('editorBody').innerHTML = `
    <div class="field"><label>Name</label><input type="text" id="f-name" value="${escapeHtml(r.name)}" placeholder="e.g. Vitamin D"></div>
    <div class="field rowly"><div><label>Category</label><select id="f-cat">${catOpts}</select></div>
      <div><label>Cadence</label><select id="f-cad">${cadOpts}</select></div></div>
    <div class="field"><div class="toggle ${r.track_value?'on':''}" id="f-track"><div class="sw"></div>
      <div><div style="font-weight:600;font-size:14px">Track a number</div>
      <div style="font-size:12px;color:var(--muted)">e.g. grams, kg, minutes — not just a checkmark</div></div></div></div>
    <div class="field rowly ${r.track_value?'':'hidden'}" id="f-numwrap">
      <div><label>Unit</label><input type="text" id="f-unit" value="${escapeHtml(r.unit||'')}" placeholder="g, kg, min"></div>
      <div><label>Daily target (optional)</label><input type="number" id="f-target" value="${r.target_value!=null?r.target_value:''}" placeholder="e.g. 150"></div></div>
    <div class="field"><div class="toggle ${r.active?'on':''}" id="f-active"><div class="sw"></div>
      <div style="font-weight:600;font-size:14px">Active</div></div></div>
    <div class="formbtns">${isNew?'':'<button class="btn-del" id="f-del">Delete</button>'}
      <button class="btn-cancel" id="f-cancel">Cancel</button><button class="btn-save" id="f-save">Save</button></div>`;
  let track = r.track_value, active = r.active;
  $('f-track').onclick = ()=>{ track=!track; $('f-track').classList.toggle('on',track); $('f-numwrap').classList.toggle('hidden',!track); };
  $('f-active').onclick = ()=>{ active=!active; $('f-active').classList.toggle('on',active); };
  $('f-cancel').onclick = renderEditorList;
  if(!isNew) $('f-del').onclick = ()=>deleteRoutine(r);
  $('f-save').onclick = async ()=>{
    const name=$('f-name').value.trim(); if(!name){ toast('Give it a name', true); return; }
    const body={ name, category:$('f-cat').value, cadence:$('f-cad').value, track_value:track,
      unit: track?($('f-unit').value.trim()||null):null,
      target_value: track && $('f-target').value!=='' ? Number($('f-target').value) : null, active };
    try{
      if(isNew){ body.sort_order = maxSort(body.category)+1; await rest('POST','routines',{body,prefer:'return=minimal'}); }
      else { await rest('PATCH','routines?id=eq.'+r.id,{body,prefer:'return=minimal'}); }
      toast('Saved'); allRoutines = await loadAll(); await load(); render(); renderEditorList();
    }catch(e){ toast('Could not save routine', true); console.error(e); }
  };
}
function maxSort(cat){ return allRoutines.filter(r=>r.category===cat).reduce((m,r)=>Math.max(m,r.sort_order||0),0); }
async function deleteRoutine(r){
  if(!confirm(`Delete "${r.name}" and all its history? This cannot be undone.\n\nTip: turn Active off to retire it instead.`)) return;
  try{ await rest('DELETE','routines?id=eq.'+r.id); toast('Deleted'); allRoutines = await loadAll(); await load(); render(); renderEditorList(); }
  catch(e){ toast('Could not delete', true); console.error(e); }
}
async function moveRoutine(id, dir){
  const r=allRoutines.find(x=>x.id===id); const group=allRoutines.filter(x=>x.category===r.category);
  const i=group.findIndex(x=>x.id===id), j=dir==='up'?i-1:i+1; if(j<0||j>=group.length) return;
  const a=group[i], b=group[j];
  try{
    await rest('PATCH','routines?id=eq.'+a.id,{body:{sort_order:b.sort_order},prefer:'return=minimal'});
    await rest('PATCH','routines?id=eq.'+b.id,{body:{sort_order:a.sort_order},prefer:'return=minimal'});
    allRoutines = await loadAll(); await load(); render(); renderEditorList();
  }catch(e){ toast('Could not reorder', true); console.error(e); }
}

// confetti + toast + xp
const CONF=['#34d399','#fb923c','#a78bfa','#38bdf8','#fbbf24'];
function spawnConfetti(cx,cy,count,spread){
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.style.background=CONF[i%CONF.length]; s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=spread*(0.5+Math.random());
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy+80}px) scale(.3)`,opacity:0}],
      {duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}
function burst(anchor){ const r=anchor.getBoundingClientRect(); spawnConfetti(r.left+r.width/2, r.top+r.height/2, 12, 70); }
function bigBurst(){ spawnConfetti(window.innerWidth/2, window.innerHeight*0.32, 46, 200); }
function floatXp(anchor, amt){
  const r=anchor.getBoundingClientRect();
  const el=document.createElement('div'); el.className='xpfloat'; el.textContent='+'+amt+' XP';
  el.style.left=(r.left+r.width/2)+'px'; el.style.top=r.top+'px'; document.body.appendChild(el);
  el.animate([{transform:'translateX(-50%) translateY(0)',opacity:0},{transform:'translateX(-50%) translateY(-14px)',opacity:1,offset:.3},
    {transform:'translateX(-50%) translateY(-46px)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>el.remove();
}
let toastT;
function toast(msg,err,level){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':'')+(level?' level':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':'')+(level?' level':''), level?3200:2400); }

// boot
function showLogin(){ $('login').classList.add('show'); }
async function start(){
  $('login').classList.remove('show');
  try{ await load(); render(); }
  catch(e){ console.error(e);
    if(String(e).includes('HTTP 401') || String(e).includes('JWT')){ clearSession(); showLogin(); }
    else { $('app').innerHTML=`<div class="loading">Couldn't connect.<br>Check your internet and refresh.</div>`; toast('Connection failed',true); } }
}
$('l-go').onclick = async ()=>{
  const email=$('l-email').value.trim(), pass=$('l-pass').value;
  $('l-err').textContent=''; $('l-go').textContent='Signing in…';
  try{ await signIn(email,pass); await start(); }
  catch(e){ $('l-err').textContent = String(e.message||e); }
  $('l-go').textContent='Sign in';
};
$('l-pass').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('l-go').click(); });
loadSession();
if(session) start(); else showLogin();
// Push needs a registered worker, so the self-destroying-worker era ends here. sw.js
// has no fetch handler, so this does not reintroduce the stale-build caching that made
// the old worker necessary; it sweeps the leftover caches once on activate instead.
// updateViaCache:'none' stops the browser's HTTP cache serving an old sw.js.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js?v=14', { updateViaCache:'none' })
    .catch(e=>console.warn('service worker registration failed', e));
}
</script>
